                  {"اندازه‌ی نهاییِ یک انسان را نه در لحظه‌های راحتی، بلکه در لحظه‌های چالش می‌سنجند.", "مارتین لوتر کینگ"},
                  {"هیچ‌کس واقعاً آزاد نیست، تا زمانی که همه آزاد نباشند.", "مارتین لوتر کینگ"},
