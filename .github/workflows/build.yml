          # ---- PeakDangerWidgetProvider.java ----
          cat > "$WIDGET_DIR/PeakDangerWidgetProvider.java" <<JAVAEOF
          package ${APP_ID}.widget;

          import ${APP_ID}.R;
          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.widget.RemoteViews;

          /** Home-screen "SOS" widget (نهایت خطر). Unlike the other four widgets this one carries no
           *  configurable theme -- it's an emergency button, so it always renders in the same high-contrast
           *  red alert style on purpose, regardless of the app's current color theme. Tapping it launches
           *  PeakDangerActivity directly (no config step, nothing to set up first). See PeakDangerActivity
           *  for the actual 6-minute intervention flow and the streak-reset-on-abandon logic. */
          public class PeakDangerWidgetProvider extends AppWidgetProvider {

              @Override
              public void onUpdate(Context context, AppWidgetManager mgr, int[] appWidgetIds) {
                  for (int id : appWidgetIds) {
                      updateOne(context, mgr, id);
                  }
              }

              static void refreshAll(Context context) {
                  AppWidgetManager mgr = AppWidgetManager.getInstance(context);
                  int[] ids = mgr.getAppWidgetIds(new ComponentName(context, PeakDangerWidgetProvider.class));
                  for (int id : ids) {
                      updateOne(context, mgr, id);
                  }
              }

              private static void updateOne(Context context, AppWidgetManager mgr, int widgetId) {
                  RemoteViews views = new RemoteViews(context.getPackageName(), R.layout.widget_peak_danger);

                  Intent launch = new Intent(context, PeakDangerActivity.class);
                  launch.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  PendingIntent pi = PendingIntent.getActivity(context, widgetId, launch,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  views.setOnClickPendingIntent(R.id.widgetRoot, pi);

                  mgr.updateAppWidget(widgetId, views);
              }
          }
          JAVAEOF

          # ---- PeakDangerActivity.java ----
          cat > "$WIDGET_DIR/PeakDangerActivity.java" <<JAVAEOF
          package ${APP_ID}.widget;

          import ${APP_ID}.R;
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.Context;
          import android.content.DialogInterface;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.content.SharedPreferences;
          import android.os.Bundle;
          import android.os.CountDownTimer;
          import android.text.Editable;
          import android.text.InputType;
          import android.text.TextWatcher;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import java.util.Locale;
          import java.util.Random;

          /** Full-screen "SOS" intervention launched by PeakDangerWidgetProvider (نهایت خطر). Keeps the
           *  user actively engaged (math / a small tap game / a short writing prompt) for a fixed six
           *  minute window so an intense urge has time to pass. A wrong answer only gets a warning and a
           *  retry -- nothing is lost for making a mistake. What resets the streak to zero is deliberately
           *  abandoning an *active* session (confirmed back-press, or leaving via Home/app-switch), never
           *  an interruption like the screen locking or a phone call, which just pauses and resumes where
           *  it left off. See resetStreakForAbandon() / onUserLeaveHint() / onBackPressed(). */
          public class PeakDangerActivity extends Activity {

              private static final int SESSION_SECONDS = 360;
              public static final String KEY_PENDING_RESET = "peak_danger_pending_reset";
              public static final String KEY_PENDING_RESET_AT = "peak_danger_pending_reset_at";

              private static final String COL_BG = "#170B22";
              private static final String COL_ACCENT = "#FF5449";
              private static final String COL_ACCENT_DARK = "#B71C1C";
              private static final String COL_TEXT = "#FFFFFF";
              private static final String COL_MUTED = "#D8C9E6";
              private static final String COL_OK = "#3FB87F";

              private final Random rnd = new Random();

              private CountDownTimer sessionTimer;
              private boolean sessionActive = false;
              private boolean sessionCompleted = false;
              private boolean leftDeliberately = false;
              private int remainingSeconds = SESSION_SECONDS;
              private int taskIndex = 0;
              private int mathAnswer;

              private LinearLayout root;
              private TextView timerText;
              private FrameLayout taskContainer;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  showIntroScreen();
              }

              private int dp(int v) {
                  return (int) TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, v, getResources().getDisplayMetrics());
              }

              private GradientDrawable pillDrawable(String colorHex) {
                  GradientDrawable d = new GradientDrawable();
                  d.setColor(Color.parseColor(colorHex));
                  d.setCornerRadius(dp(16));
                  return d;
              }

              private GradientDrawable circleDrawable(String colorHex) {
                  GradientDrawable d = new GradientDrawable();
                  d.setShape(GradientDrawable.OVAL);
                  d.setColor(Color.parseColor(colorHex));
                  return d;
              }

              // ---------------------------------------------------------------- intro screen

              private void showIntroScreen() {
                  ScrollView scroll = new ScrollView(this);
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);
                  box.setGravity(Gravity.CENTER);
                  box.setPadding(dp(28), dp(40), dp(28), dp(40));
                  box.setBackgroundColor(Color.parseColor(COL_BG));

                  TextView icon = new TextView(this);
                  icon.setText("\u26A0\uFE0F");
                  icon.setTextSize(44);
                  icon.setGravity(Gravity.CENTER);
                  box.addView(icon);

                  TextView title = new TextView(this);
                  title.setText("نهایت خطر");
                  title.setTextDirection(View.TEXT_DIRECTION_RTL);
                  title.setTextAlignment(View.TEXT_ALIGNMENT_CENTER);
                  title.setTypeface(null, Typeface.BOLD);
                  title.setTextSize(24);
                  title.setTextColor(Color.parseColor(COL_TEXT));
                  LinearLayout.LayoutParams titleLp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  titleLp.topMargin = dp(16);
                  box.addView(title, titleLp);

                  TextView body = new TextView(this);
                  body.setText("۶ دقیقه با هم می‌مونیم. چند تمرین کوتاه (ریاضی، یه بازی کوچیک، چند خط نوشتن) بهت می‌دم تا ذهنت درگیر بشه و این لحظه بگذره.\n\nاگه وسط راه بیرون بزنی و ولش کنی، روزشمارت صفر می‌شه. هر جور شده، تا آخرش بمون.");
                  body.setTextDirection(View.TEXT_DIRECTION_RTL);
                  body.setTextAlignment(View.TEXT_ALIGNMENT_CENTER);
                  body.setTextSize(15);
                  body.setTextColor(Color.parseColor(COL_MUTED));
                  LinearLayout.LayoutParams bodyLp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  bodyLp.topMargin = dp(18);
                  box.addView(body, bodyLp);

                  Button startBtn = new Button(this);
                  startBtn.setText("شروع می‌کنم");
                  startBtn.setAllCaps(false);
                  startBtn.setTypeface(null, Typeface.BOLD);
                  startBtn.setTextColor(Color.parseColor(COL_TEXT));
                  startBtn.setBackground(pillDrawable(COL_ACCENT));
                  LinearLayout.LayoutParams startLp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, dp(54));
                  startLp.topMargin = dp(30);
                  startBtn.setOnClickListener(new View.OnClickListener() {
                      @Override public void onClick(View v) { startSession(); }
                  });
                  box.addView(startBtn, startLp);

                  Button laterBtn = new Button(this);
                  laterBtn.setText("الان نه");
                  laterBtn.setAllCaps(false);
                  laterBtn.setTextColor(Color.parseColor(COL_MUTED));
                  laterBtn.setBackgroundColor(Color.TRANSPARENT);
                  LinearLayout.LayoutParams laterLp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, dp(44));
                  laterLp.topMargin = dp(6);
                  laterBtn.setOnClickListener(new View.OnClickListener() {
                      @Override public void onClick(View v) { finish(); }
                  });
                  box.addView(laterBtn, laterLp);

                  scroll.addView(box, new ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  setContentView(scroll);
              }

              // ---------------------------------------------------------------- session screen

              private void startSession() {
                  sessionActive = true;
                  sessionCompleted = false;
                  leftDeliberately = false;
                  remainingSeconds = SESSION_SECONDS;
                  taskIndex = 0;
                  buildSessionUi();
                  runTimer(remainingSeconds);
                  nextTask();
              }

              private void buildSessionUi() {
                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);
                  root.setBackgroundColor(Color.parseColor(COL_BG));
                  root.setPadding(dp(24), dp(32), dp(24), dp(24));

                  timerText = new TextView(this);
                  timerText.setTextAlignment(View.TEXT_ALIGNMENT_CENTER);
                  timerText.setTypeface(null, Typeface.BOLD);
                  timerText.setTextSize(34);
                  timerText.setTextColor(Color.parseColor(COL_ACCENT));
                  root.addView(timerText, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));
                  updateTimerText();

                  TextView hint = new TextView(this);
                  hint.setText("تا وقتی این تموم نشه، بیرون نرو");
                  hint.setTextDirection(View.TEXT_DIRECTION_RTL);
                  hint.setTextAlignment(View.TEXT_ALIGNMENT_CENTER);
                  hint.setTextSize(12);
                  hint.setTextColor(Color.parseColor(COL_MUTED));
                  LinearLayout.LayoutParams hintLp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  hintLp.bottomMargin = dp(16);
                  root.addView(hint, hintLp);

                  taskContainer = new FrameLayout(this);
                  root.addView(taskContainer, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f));

                  setContentView(root);
              }

              private void runTimer(int fromSeconds) {
                  if (sessionTimer != null) sessionTimer.cancel();
                  sessionTimer = new CountDownTimer(fromSeconds * 1000L, 1000L) {
                      @Override public void onTick(long msLeft) {
                          remainingSeconds = (int) (msLeft / 1000L);
                          updateTimerText();
                      }
                      @Override public void onFinish() {
                          remainingSeconds = 0;
                          sessionActive = false;
                          sessionCompleted = true;
                          showSuccessScreen();
                      }
                  };
                  sessionTimer.start();
              }

              private void updateTimerText() {
                  if (timerText == null) return;
                  int m = remainingSeconds / 60;
                  int s = remainingSeconds % 60;
                  timerText.setText(String.format(Locale.US, "%02d:%02d", m, s));
              }

              // ---------------------------------------------------------------- task rotation

              private void nextTask() {
                  taskIndex++;
                  taskContainer.removeAllViews();
                  int kind = taskIndex % 3;
                  if (kind == 1) buildMathTask();
                  else if (kind == 2) buildTapTask();
                  else buildWriteTask();
              }

              private void buildMathTask() {
                  final LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);
                  box.setGravity(Gravity.CENTER);

                  int a = 2 + rnd.nextInt(18);
                  int b = 2 + rnd.nextInt(18);
                  int op = rnd.nextInt(3);
                  String opSign;
                  if (op == 0) {
                      opSign = "+";
                      mathAnswer = a + b;
                  } else if (op == 1) {
                      if (b > a) { int t = a; a = b; b = t; }
                      opSign = "\u2212";
                      mathAnswer = a - b;
                  } else {
                      a = 2 + rnd.nextInt(9);
                      b = 2 + rnd.nextInt(9);
                      opSign = "\u00D7";
                      mathAnswer = a * b;
                  }

                  TextView label = new TextView(this);
                  label.setText("جواب این چنده؟");
                  label.setTextDirection(View.TEXT_DIRECTION_RTL);
                  label.setTextAlignment(View.TEXT_ALIGNMENT_CENTER);
                  label.setTextColor(Color.parseColor(COL_MUTED));
                  label.setTextSize(14);
                  box.addView(label);

                  TextView expr = new TextView(this);
                  expr.setText(a + " " + opSign + " " + b);
                  expr.setTextAlignment(View.TEXT_ALIGNMENT_CENTER);
                  expr.setTypeface(null, Typeface.BOLD);
                  expr.setTextSize(40);
                  expr.setTextColor(Color.parseColor(COL_TEXT));
                  LinearLayout.LayoutParams exprLp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  exprLp.topMargin = dp(8);
                  exprLp.bottomMargin = dp(20);
                  box.addView(expr, exprLp);

                  final EditText input = new EditText(this);
                  input.setInputType(InputType.TYPE_CLASS_NUMBER);
                  input.setTextAlignment(View.TEXT_ALIGNMENT_CENTER);
                  input.setTextSize(20);
                  input.setTextColor(Color.parseColor(COL_TEXT));
                  input.setHintTextColor(Color.parseColor(COL_MUTED));
                  box.addView(input, new LinearLayout.LayoutParams(dp(160), dp(52)));

                  final TextView feedback = new TextView(this);
                  feedback.setTextAlignment(View.TEXT_ALIGNMENT_CENTER);
                  feedback.setTextSize(13);
                  LinearLayout.LayoutParams feedbackLp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  feedbackLp.topMargin = dp(10);
                  box.addView(feedback, feedbackLp);

                  final Button checkBtn = new Button(this);
                  checkBtn.setText("بررسی کن");
                  checkBtn.setAllCaps(false);
                  checkBtn.setTextColor(Color.parseColor(COL_TEXT));
                  checkBtn.setBackground(pillDrawable(COL_ACCENT));
                  LinearLayout.LayoutParams checkLp = new LinearLayout.LayoutParams(dp(200), dp(50));
                  checkLp.topMargin = dp(18);
                  checkBtn.setOnClickListener(new View.OnClickListener() {
                      @Override public void onClick(View v) {
                          String raw = input.getText().toString().trim();
                          Integer given = null;
                          try { given = Integer.parseInt(raw); } catch (Exception ignored) {}
                          if (given != null && given == mathAnswer) {
                              feedback.setText("\u2705 درست بود!");
                              feedback.setTextColor(Color.parseColor(COL_OK));
                              checkBtn.setEnabled(false);
                              taskContainer.postDelayed(new Runnable() {
                                  @Override public void run() { nextTask(); }
                              }, 550);
                          } else {
                              feedback.setText("\u274C اشتباهه، دوباره امتحان کن");
                              feedback.setTextColor(Color.parseColor(COL_ACCENT));
                              input.setText("");
                          }
                      }
                  });
                  box.addView(checkBtn, checkLp);

                  taskContainer.addView(box, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT, Gravity.CENTER));
              }

              private void buildTapTask() {
                  final int required = 6;
                  final int[] done = { 0 };
                  final int size = dp(64);

                  final FrameLayout stage = new FrameLayout(this);

                  final TextView label = new TextView(this);
                  label.setText("روی دایره ضربه بزن: 0 از " + required);
                  label.setTextDirection(View.TEXT_DIRECTION_RTL);
                  label.setTextColor(Color.parseColor(COL_MUTED));
                  label.setTextSize(14);
                  FrameLayout.LayoutParams labelLp = new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT,
                          Gravity.TOP | Gravity.CENTER_HORIZONTAL);
                  labelLp.topMargin = dp(6);
                  stage.addView(label, labelLp);

                  final Button dot = new Button(this);
                  dot.setText("");
                  dot.setBackground(circleDrawable(COL_ACCENT));
                  final FrameLayout.LayoutParams dotLp = new FrameLayout.LayoutParams(size, size);
                  placeRandom(dotLp, size);
                  stage.addView(dot, dotLp);

                  dot.setOnClickListener(new View.OnClickListener() {
                      @Override public void onClick(View v) {
                          done[0]++;
                          if (done[0] >= required) {
                              nextTask();
                          } else {
                              label.setText("روی دایره ضربه بزن: " + done[0] + " از " + required);
                              FrameLayout.LayoutParams lp = (FrameLayout.LayoutParams) dot.getLayoutParams();
                              placeRandom(lp, size);
                              dot.setLayoutParams(lp);
                          }
                      }
                  });

                  taskContainer.addView(stage, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
              }

              private void placeRandom(FrameLayout.LayoutParams lp, int size) {
                  int stageW = taskContainer.getWidth();
                  int stageH = taskContainer.getHeight();
                  if (stageW <= size || stageH <= size) {
                      lp.gravity = Gravity.CENTER;
                      lp.leftMargin = 0;
                      lp.topMargin = 0;
                      return;
                  }
                  lp.gravity = Gravity.TOP | Gravity.START;
                  lp.leftMargin = rnd.nextInt(stageW - size);
                  lp.topMargin = dp(50) + rnd.nextInt(Math.max(1, stageH - size - dp(50)));
              }

              private void buildWriteTask() {
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);

                  TextView label = new TextView(this);
                  label.setText("چند خط بنویس: الان چه حسی داری؟ یا یکی از دلایلی که می‌خوای ادامه بدی رو بنویس.");
                  label.setTextDirection(View.TEXT_DIRECTION_RTL);
                  label.setTextAlignment(View.TEXT_ALIGNMENT_VIEW_START);
                  label.setTextColor(Color.parseColor(COL_MUTED));
                  label.setTextSize(15);
                  box.addView(label);

                  final EditText input = new EditText(this);
                  input.setGravity(Gravity.TOP | Gravity.START);
                  input.setTextDirection(View.TEXT_DIRECTION_RTL);
                  input.setMinLines(4);
                  input.setTextColor(Color.parseColor(COL_TEXT));
                  input.setHintTextColor(Color.parseColor(COL_MUTED));
                  input.setHint("همینجا بنویس...");
                  LinearLayout.LayoutParams inputLp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  inputLp.topMargin = dp(14);
                  box.addView(input, inputLp);

                  final Button nextBtn = new Button(this);
                  nextBtn.setText("ادامه");
                  nextBtn.setAllCaps(false);
                  nextBtn.setEnabled(false);
                  nextBtn.setTextColor(Color.parseColor(COL_TEXT));
                  nextBtn.setBackground(pillDrawable(COL_ACCENT));
                  LinearLayout.LayoutParams nextLp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, dp(50));
                  nextLp.topMargin = dp(16);
                  nextBtn.setOnClickListener(new View.OnClickListener() {
                      @Override public void onClick(View v) { nextTask(); }
                  });
                  box.addView(nextBtn, nextLp);

                  input.addTextChangedListener(new TextWatcher() {
                      @Override public void beforeTextChanged(CharSequence s, int a, int b, int c) {}
                      @Override public void onTextChanged(CharSequence s, int a, int b, int c) {
                          nextBtn.setEnabled(s.length() >= 12);
                      }
                      @Override public void afterTextChanged(Editable s) {}
                  });

                  taskContainer.addView(box, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT, Gravity.TOP));
              }

              // ---------------------------------------------------------------- success / abandonment

              private void showSuccessScreen() {
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);
                  box.setGravity(Gravity.CENTER);
                  box.setPadding(dp(28), dp(40), dp(28), dp(40));
                  box.setBackgroundColor(Color.parseColor(COL_BG));

                  TextView icon = new TextView(this);
                  icon.setText("\uD83C\uDF3F");
                  icon.setTextSize(44);
                  box.addView(icon);

                  TextView title = new TextView(this);
                  title.setText("گذشت");
                  title.setTextDirection(View.TEXT_DIRECTION_RTL);
                  title.setTextAlignment(View.TEXT_ALIGNMENT_CENTER);
                  title.setTypeface(null, Typeface.BOLD);
                  title.setTextSize(24);
                  title.setTextColor(Color.parseColor(COL_TEXT));
                  LinearLayout.LayoutParams titleLp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  titleLp.topMargin = dp(16);
                  box.addView(title, titleLp);

                  TextView body = new TextView(this);
                  body.setText("۶ دقیقه تموم شد و تو موندی. روزشمارت دست‌نخورده باقی موند.");
                  body.setTextDirection(View.TEXT_DIRECTION_RTL);
                  body.setTextAlignment(View.TEXT_ALIGNMENT_CENTER);
                  body.setTextSize(15);
                  body.setTextColor(Color.parseColor(COL_MUTED));
                  LinearLayout.LayoutParams bodyLp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  bodyLp.topMargin = dp(12);
                  box.addView(body, bodyLp);

                  Button closeBtn = new Button(this);
                  closeBtn.setText("بستن");
                  closeBtn.setAllCaps(false);
                  closeBtn.setTextColor(Color.parseColor(COL_TEXT));
                  closeBtn.setBackground(pillDrawable(COL_OK));
                  LinearLayout.LayoutParams closeLp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, dp(54));
                  closeLp.topMargin = dp(30);
                  closeBtn.setOnClickListener(new View.OnClickListener() {
                      @Override public void onClick(View v) { finish(); }
                  });
                  box.addView(closeBtn, closeLp);

                  setContentView(box);
              }

              private void showAbandonedScreen() {
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);
                  box.setGravity(Gravity.CENTER);
                  box.setPadding(dp(28), dp(40), dp(28), dp(40));
                  box.setBackgroundColor(Color.parseColor(COL_BG));

                  TextView title = new TextView(this);
                  title.setText("جلسه ناتموم موند");
                  title.setTextDirection(View.TEXT_DIRECTION_RTL);
                  title.setTextAlignment(View.TEXT_ALIGNMENT_CENTER);
                  title.setTypeface(null, Typeface.BOLD);
                  title.setTextSize(22);
                  title.setTextColor(Color.parseColor(COL_TEXT));
                  box.addView(title);

                  TextView body = new TextView(this);
                  body.setText("چون وسط راه بیرون رفتی، طبق قانونی که خودت گذاشتی، روزشمار صفر شد. هر وقت آماده بودی، دوباره امتحان کن.");
                  body.setTextDirection(View.TEXT_DIRECTION_RTL);
                  body.setTextAlignment(View.TEXT_ALIGNMENT_CENTER);
                  body.setTextSize(15);
                  body.setTextColor(Color.parseColor(COL_MUTED));
                  LinearLayout.LayoutParams bodyLp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  bodyLp.topMargin = dp(14);
                  box.addView(body, bodyLp);

                  Button closeBtn = new Button(this);
                  closeBtn.setText("بستن");
                  closeBtn.setAllCaps(false);
                  closeBtn.setTextColor(Color.parseColor(COL_TEXT));
                  closeBtn.setBackground(pillDrawable(COL_ACCENT_DARK));
                  LinearLayout.LayoutParams closeLp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, dp(54));
                  closeLp.topMargin = dp(24);
                  closeBtn.setOnClickListener(new View.OnClickListener() {
                      @Override public void onClick(View v) { finish(); }
                  });
                  box.addView(closeBtn, closeLp);

                  setContentView(box);
              }

              private void resetStreakForAbandon() {
                  SharedPreferences prefs = getSharedPreferences(TaskWidgetPlugin.PREFS_NAME, Context.MODE_PRIVATE);
                  prefs.edit()
                          .putInt(TaskWidgetPlugin.KEY_DAY, 0)
                          .putBoolean(KEY_PENDING_RESET, true)
                          .putLong(KEY_PENDING_RESET_AT, System.currentTimeMillis())
                          .apply();
                  DayProgressWidgetProvider.refreshAll(this);
              }

              // ---------------------------------------------------------------- lifecycle

              @Override
              public void onUserLeaveHint() {
                  super.onUserLeaveHint();
                  if (sessionActive && !sessionCompleted) {
                      leftDeliberately = true;
                      sessionActive = false;
                      if (sessionTimer != null) sessionTimer.cancel();
                      resetStreakForAbandon();
                  }
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  if (sessionTimer != null) sessionTimer.cancel();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (leftDeliberately) {
                      showAbandonedScreen();
                  } else if (sessionActive && !sessionCompleted && root != null) {
                      runTimer(remainingSeconds);
                  }
              }

              @Override
              public void onBackPressed() {
                  if (sessionActive && !sessionCompleted) {
                      new AlertDialog.Builder(this)
                              .setTitle("مطمئنی؟")
                              .setMessage("اگه الان بری بیرون، روزشمارت صفر می‌شه. بمون تا این لحظه بگذره.")
                              .setPositiveButton("بمونم", new DialogInterface.OnClickListener() {
                                  @Override public void onClick(DialogInterface d, int w) { d.dismiss(); }
                              })
                              .setNegativeButton("خارج شو", new DialogInterface.OnClickListener() {
                                  @Override public void onClick(DialogInterface d, int w) {
                                      leftDeliberately = true;
                                      sessionActive = false;
                                      if (sessionTimer != null) sessionTimer.cancel();
                                      resetStreakForAbandon();
                                      finish();
                                  }
                              })
                              .setCancelable(true)
                              .show();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  if (sessionTimer != null) sessionTimer.cancel();
              }
          }
          JAVAEOF

      - name: Inject Peak Danger emergency widget (نهایت خطر) -- part 2 of 2 (manifest + widget descriptor + plugin bridge)
        # Completes the widget started in part 1: registers PeakDangerWidgetProvider as a
        # <receiver> and PeakDangerActivity as an <activity> in AndroidManifest.xml, adds the
        # res/xml/widget_peak_danger_info.xml appwidget-provider descriptor PeakDangerWidgetProvider's
        # meta-data already points to, and adds TaskWidgetPlugin.getPeakDangerReset() so app.js can
        # read/clear KEY_PENDING_RESET(_AT) on next launch and mirror the native streak reset that
        # PeakDangerActivity.resetStreakForAbandon() already wrote to SharedPreferences. Only after
        # this step can the widget actually be referenced by the manifest / placed on a home screen.
        run: |
          set -e
          APP_ID="com.mahdihd648.dreamlifeapp"
          APP_PATH="${APP_ID//./\/}"
          JAVA_DIR="android/app/src/main/java/${APP_PATH}"
          WIDGET_DIR="${JAVA_DIR}/widget"
          RES_DIR="android/app/src/main/res"

          mkdir -p "$RES_DIR/xml"

          # ---- res/xml/widget_peak_danger_info.xml ----
          cat > "$RES_DIR/xml/widget_peak_danger_info.xml" <<'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="110dp"
              android:minHeight="110dp"
              android:minResizeWidth="90dp"
              android:minResizeHeight="90dp"
              android:targetCellWidth="2"
              android:targetCellHeight="2"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/widget_peak_danger"
              android:previewImage="@mipmap/ic_launcher"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen" />
          XMLEOF

          # ---- AndroidManifest.xml: register PeakDangerWidgetProvider + PeakDangerActivity ----
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          python3 - "$MANIFEST" "$APP_ID" <<'WIDGETPYEOF'
          import sys, re
          path = sys.argv[1]
          app_id = sys.argv[2]
          with open(path, encoding='utf-8') as f:
              src = f.read()

          if 'PeakDangerWidgetProvider' not in src:
              entries = (
                  '    <receiver android:name="' + app_id + '.widget.PeakDangerWidgetProvider" android:exported="true">\n'
                  '        <intent-filter>\n'
                  '            <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />\n'
                  '        </intent-filter>\n'
                  '        <meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_peak_danger_info" />\n'
                  '    </receiver>\n'
                  '    <!-- No intent-filter: launched only by an explicit Intent from PeakDangerWidgetProvider,\n'
                  '         so it does not need to be exported. -->\n'
                  '    <activity android:name="' + app_id + '.widget.PeakDangerActivity"\n'
                  '        android:exported="false"\n'
                  '        android:launchMode="singleTop"\n'
                  '        android:theme="@android:style/Theme.DeviceDefault.NoActionBar" />\n'
              )
              src = src.replace('</application>', entries + '</application>', 1)

          with open(path, 'w', encoding='utf-8') as f:
              f.write(src)
          WIDGETPYEOF

          # ---- TaskWidgetPlugin.java: add getPeakDangerReset() so app.js can consume the
          #      pending-reset flag PeakDangerActivity.resetStreakForAbandon() writes ----
          python3 - "$WIDGET_DIR/TaskWidgetPlugin.java" <<'PYEOF'
          import sys
          path = sys.argv[1]
          with open(path, encoding='utf-8') as f:
              src = f.read()

          if 'getPeakDangerReset' not in src:
              method = (
                  '\n'
                  '    @PluginMethod\n'
                  '    public void getPeakDangerReset(PluginCall call) {\n'
                  '        SharedPreferences p = prefs();\n'
                  '        boolean pending = p.getBoolean(PeakDangerActivity.KEY_PENDING_RESET, false);\n'
                  '        long at = p.getLong(PeakDangerActivity.KEY_PENDING_RESET_AT, 0);\n'
                  '        if (pending) {\n'
                  '            p.edit()\n'
                  '                .putBoolean(PeakDangerActivity.KEY_PENDING_RESET, false)\n'
                  '                .remove(PeakDangerActivity.KEY_PENDING_RESET_AT)\n'
                  '                .apply();\n'
                  '        }\n'
                  '        JSObject ret = new JSObject();\n'
                  '        ret.put("reset", pending);\n'
                  '        ret.put("resetAt", at);\n'
                  '        call.resolve(ret);\n'
                  '    }\n'
              )
              idx = src.rstrip().rfind('}')
              if idx == -1:
                  print("::error::could not find closing brace in TaskWidgetPlugin.java")
                  sys.exit(1)
              src = src[:idx] + method + src[idx:]

          with open(path, 'w', encoding='utf-8') as f:
              f.write(src)
          PYEOF

          if ! grep -q 'PeakDangerWidgetProvider' "$MANIFEST"; then
            echo "::error::PeakDangerWidgetProvider was not registered in AndroidManifest.xml"
            exit 1
          fi
          if ! grep -q 'getPeakDangerReset' "$WIDGET_DIR/TaskWidgetPlugin.java"; then
            echo "::error::getPeakDangerReset was not added to TaskWidgetPlugin.java"
            exit 1
          fi

      - name: Add notification permissions (POST_NOTIFICATIONS / exact alarm / boot)
        # Without these, @capacitor/local-notifications schedules silently fail or get dropped
        # by the OS on Android 13+ (runtime permission), Android 12+ (exact alarms), and after
        # a phone reboot (rescheduling needs boot access).
        run: |
          set -e
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          python3 - "$MANIFEST" <<'PYEOF'
          import sys, re
          path = sys.argv[1]
          with open(path, encoding='utf-8') as f:
              src = f.read()

          notif_permissions = (
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n'
              '    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n'
              '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n'
              '    <uses-permission android:name="android.permission.VIBRATE" />\n'
          )
          for perm in [
              'android.permission.POST_NOTIFICATIONS',
              'android.permission.SCHEDULE_EXACT_ALARM',
              'android.permission.RECEIVE_BOOT_COMPLETED',
              'android.permission.VIBRATE',
          ]:
              if perm not in src:
                  src = re.sub(r'(<manifest[^>]*>\n)',
                                lambda m, p=perm: m.group(1) + f'    <uses-permission android:name="{p}" />\n',
                                src, count=1)

          with open(path, 'w', encoding='utf-8') as f:
              f.write(src)
          PYEOF

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: Wire up release signing in build.gradle
        run: |
          APP_GRADLE="android/app/build.gradle"
          python3 - "$APP_GRADLE" <<'PYEOF'
          import sys, re
          path = sys.argv[1]
          with open(path, encoding='utf-8') as f:
              src = f.read()

          signing_block = '''
              signingConfigs {
                  release {
                      storeFile file("release.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
          '''
          if 'signingConfigs' not in src:
              src = re.sub(r'(android\s*\{)', r'\1' + signing_block, src, count=1)

          if 'signingConfig signingConfigs.release' not in src:
              src = re.sub(
                  r'(buildTypes\s*\{\s*release\s*\{)',
                  r'\1\n            signingConfig signingConfigs.release',
                  src, count=1
              )

          with open(path, 'w', encoding='utf-8') as f:
              f.write(src)
          PYEOF

      - name: Enable code shrinking/obfuscation (R8) for release build
        # minifyEnabled turns on R8, which renames classes/methods/fields to short
        # meaningless names and strips unused code — this is what actually makes the
        # release APK hard to read in a decompiler (jadx/apktool). shrinkResources
        # drops unused resources too. debuggable=false blocks attaching a debugger to
        # the release build. Rules below keep the handful of classes that are reached
        # via reflection (Capacitor plugin registration, Firebase, our own
        # widget/receiver classes referenced only by class-name string in the
        # AndroidManifest) so R8 doesn't strip or rename something that's still needed
        # at runtime.
        run: |
          set -e
          APP_GRADLE="android/app/build.gradle"
          PROGUARD_RULES="android/app/proguard-rules.pro"

          cat >> "$PROGUARD_RULES" <<'RULESEOF'

          # --- Added by CI: keep classes referenced only by name (manifest / reflection) ---
          -keep class com.getcapacitor.** { *; }
          -keep class com.google.firebase.** { *; }
          -keep class com.mahdihd648.dreamlifeapp.** { *; }
          -keepclassmembers class * extends com.getcapacitor.Plugin { *; }
          -keepattributes *Annotation*
          -dontwarn com.google.firebase.**
          RULESEOF

          python3 - "$APP_GRADLE" <<'PYEOF'
          import sys, re
          path = sys.argv[1]
          with open(path, encoding='utf-8') as f:
              src = f.read()

          if 'minifyEnabled true' not in src:
              if re.search(r'minifyEnabled\s+false', src):
                  # Capacitor's generated build.gradle already ships this line
                  # (defaulted to false) inside buildTypes { release { ... } } —
                  # flip it instead of inserting a duplicate.
                  src = re.sub(r'minifyEnabled\s+false', 'minifyEnabled true', src, count=1)
              else:
                  new_src, n = re.subn(
                      r'(buildTypes\s*\{\s*release\s*\{)',
                      r'\1\n            minifyEnabled true',
                      src, count=1
                  )
                  if n == 0:
                      print("::error::could not find buildTypes { release { } } block in android/app/build.gradle")
                      sys.exit(1)
                  src = new_src

          if 'shrinkResources true' not in src:
              if re.search(r'shrinkResources\s+false', src):
                  src = re.sub(r'shrinkResources\s+false', 'shrinkResources true', src, count=1)
              else:
                  src = re.sub(r'(minifyEnabled\s+true)', r'\1\n            shrinkResources true', src, count=1)

          if 'debuggable false' not in src:
              if re.search(r'debuggable\s+true', src):
                  src = re.sub(r'debuggable\s+true', 'debuggable false', src, count=1)
              else:
                  src = re.sub(r'(minifyEnabled\s+true)', r'\1\n            debuggable false', src, count=1)

          if 'proguard-android-optimize.txt' not in src:
              src = re.sub(
                  r'(minifyEnabled\s+true)',
                  r"\1\n            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'",
                  src, count=1
              )

          with open(path, 'w', encoding='utf-8') as f:
              f.write(src)
          PYEOF
          if ! grep -q 'minifyEnabled true' "$APP_GRADLE"; then
            echo "::error::minifyEnabled was not set in android/app/build.gradle"
            exit 1
          fi

      - name: Build release APK (signed)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: dreamlife-apk-release
          path: android/app/build/outputs/apk/release/app-release.apk
