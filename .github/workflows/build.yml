          # ---- AndroidManifest.xml: register the two widget receivers ----
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          python3 - "$MANIFEST" "$APP_ID" <<'WIDGETPYEOF'
          import sys, re
          path = sys.argv[1]
          app_id = sys.argv[2]
          with open(path, encoding='utf-8') as f:
              src = f.read()

          if 'ChecklistWidgetProvider' not in src:
              receivers = (
                  '    <receiver android:name="' + app_id + '.widget.ChecklistWidgetProvider" android:exported="true">\n'
                  '        <intent-filter>\n'
                  '            <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />\n'
                  '            <action android:name="' + app_id + '.ACTION_TOGGLE_TASK" />\n'
                  '        </intent-filter>\n'
                  '        <meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_checklist_info" />\n'
                  '    </receiver>\n'
                  '    <service android:name="' + app_id + '.widget.ChecklistRemoteViewsService"\n'
                  '        android:exported="false"\n'
                  '        android:permission="android.permission.BIND_REMOTEVIEWS" />\n'
                  '    <receiver android:name="' + app_id + '.widget.DayProgressWidgetProvider" android:exported="true">\n'
                  '        <intent-filter>\n'
                  '            <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />\n'
                  '            <action android:name="' + app_id + '.ACTION_WIDGET_TICK" />\n'
                  '        </intent-filter>\n'
                  '        <meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_day_progress_info" />\n'
                  '    </receiver>\n'
                  '    <receiver android:name="' + app_id + '.widget.QuoteWidgetProvider" android:exported="true">\n'
                  '        <intent-filter>\n'
                  '            <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />\n'
                  '            <action android:name="' + app_id + '.ACTION_QUOTE_TICK" />\n'
                  '            <action android:name="' + app_id + '.ACTION_QUOTE_NEXT" />\n'
                  '        </intent-filter>\n'
                  '        <meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_quote_info" />\n'
                  '    </receiver>\n'
                  '    <receiver android:name="' + app_id + '.widget.CountdownWidgetProvider" android:exported="true">\n'
                  '        <intent-filter>\n'
                  '            <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />\n'
                  '            <action android:name="' + app_id + '.ACTION_COUNTDOWN_TICK" />\n'
                  '        </intent-filter>\n'
                  '        <meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_countdown_info" />\n'
                  '    </receiver>\n'
                  '    <activity android:name="' + app_id + '.widget.WidgetConfigActivity"\n'
                  '        android:exported="true"\n'
                  '        android:theme="@android:style/Theme.DeviceDefault.NoActionBar">\n'
                  '        <intent-filter>\n'
                  '            <action android:name="android.appwidget.action.APPWIDGET_CONFIGURE" />\n'
                  '            <category android:name="android.intent.category.DEFAULT" />\n'
                  '        </intent-filter>\n'
                  '    </activity>\n'
                  '    <activity android:name="' + app_id + '.widget.CountdownConfigActivity"\n'
                  '        android:exported="true"\n'
                  '        android:theme="@android:style/Theme.DeviceDefault.NoActionBar">\n'
                  '        <intent-filter>\n'
                  '            <action android:name="android.appwidget.action.APPWIDGET_CONFIGURE" />\n'
                  '            <category android:name="android.intent.category.DEFAULT" />\n'
                  '        </intent-filter>\n'
                  '    </activity>\n'
              )
              src = src.replace('</application>', receivers + '</application>', 1)

          with open(path, 'w', encoding='utf-8') as f:
              f.write(src)
          WIDGETPYEOF

      - name: Inject Peak Danger emergency widget (نهایت خطر) -- part 1 of 2 (activity + widget provider)
        # Fifth home-screen widget: an SOS button for moments of intense urge. Tapping it opens
        # a fixed 6-minute session (PeakDangerActivity) that keeps the user actively engaged --
        # short math problems, a small tap game, a short writing prompt, cycling until the timer
        # ends. A wrong answer just gets a warning and a retry, no penalty. Deliberately abandoning
        # an *active* session (confirmed back-press, or leaving via Home/app-switch) resets the
        # streak (TaskWidgetPlugin.KEY_DAY) to zero -- but a mere interruption like the screen
        # locking or a call coming in just pauses the timer and resumes where it left off, so the
        # user is never punished for something outside their control.
        #
        # Part 2 (separate follow-up step) still needs to: register PeakDangerWidgetProvider as a
        # <receiver> and PeakDangerActivity as an <activity> in AndroidManifest.xml, add the
        # res/xml/widget_peak_danger_info.xml appwidget-provider descriptor those reference, and
        # add a TaskWidgetPlugin method so the JS app can read/clear KEY_PENDING_RESET on next
        # launch and keep its own local streak state in sync. Until part 2 lands, this widget
        # cannot be placed on a home screen or referenced by the manifest yet -- this step only
        # generates the Java classes + resources it needs.
        run: |
          set -e
          APP_ID="com.mahdihd648.dreamlifeapp"
          APP_PATH="${APP_ID//./\/}"
          JAVA_DIR="android/app/src/main/java/${APP_PATH}"
          WIDGET_DIR="${JAVA_DIR}/widget"
          RES_DIR="android/app/src/main/res"

          mkdir -p "$WIDGET_DIR" "$RES_DIR/layout" "$RES_DIR/xml" "$RES_DIR/drawable"

          # ---- res/drawable/widget_danger_bg.xml ----
          cat > "$RES_DIR/drawable/widget_danger_bg.xml" <<'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <corners android:radius="20dp" />
              <gradient android:startColor="#E53935" android:endColor="#B71C1C" android:angle="135" />
          </shape>
          XMLEOF

          # ---- res/layout/widget_peak_danger.xml ----
          cat > "$RES_DIR/layout/widget_peak_danger.xml" <<'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
