name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Ensure local-notifications plugin is present
        # Safety net in case package.json/lock in the repo hasn't been updated yet — installs
        # the native notifications plugin so `npx cap sync android` has something to sync.
        # Best practice is still to add "@capacitor/local-notifications" to package.json
        # yourself and commit the lockfile, so this step becomes a no-op.
        run: |
          if ! node -e "require.resolve('@capacitor/local-notifications')" 2>/dev/null; then
            npm install @capacitor/local-notifications
          fi

      - name: Prepare web assets (www/)
        run: |
          mkdir -p www
          cp index.html www/index.html
          [ -f manifest.json ] && cp manifest.json www/manifest.json || true
          [ -f icon-192.png ] && cp icon-192.png www/icon-192.png || true
          [ -f icon-512.png ] && cp icon-512.png www/icon-512.png || true
          # index.html registers navigator.serviceWorker at '/sw.js' — the repo file is named
          # sw-1.js, so it must land in www/ as sw.js or registration 404s and the SW never installs.
          [ -f sw-1.js ] && cp sw-1.js www/sw.js || true
          [ -f sw.js ] && cp sw.js www/sw.js || true
          [ -d assets ] && cp -r assets www/assets || true
          ls -la www

      - name: Add Android platform
        run: npx cap add android

      - name: Set app version (versionCode/versionName)
        # Myket (like Google Play) rejects an update unless its versionCode is strictly
        # higher than the previously-uploaded one. android/ is regenerated from scratch every
        # run (it's not committed), so Capacitor's default "versionCode 1 / versionName 1.0"
        # would otherwise be baked into EVERY build — fine for the first upload, but every
        # update after that would be silently rejected by Myket.
        # Fix: versionCode = this workflow run's number (always increasing, guaranteed unique).
        # versionName = content of a VERSION file at repo root if present (e.g. "1.3"), so you
        # control the human-readable version just by editing that one file; defaults to "1.0".
        run: |
          VERSION_NAME="1.0"
          [ -f VERSION ] && VERSION_NAME="$(tr -d '[:space:]' < VERSION)"
          echo "versionCode=${{ github.run_number }}  versionName=${VERSION_NAME}"
          python3 - "android/app/build.gradle" "${{ github.run_number }}" "$VERSION_NAME" <<'PYEOF'
          import sys, re
          path, code, name = sys.argv[1], sys.argv[2], sys.argv[3]
          with open(path, encoding='utf-8') as f:
              src = f.read()
          src = re.sub(r'versionCode\s+\d+', f'versionCode {code}', src, count=1)
          src = re.sub(r'versionName\s+"[^"]*"', f'versionName "{name}"', src, count=1)
          with open(path, 'w', encoding='utf-8') as f:
              f.write(src)
          PYEOF

      - name: Generate app icon (from resources/icon-only.png, direct — no @capacitor/assets)
        # @capacitor/assets kept silently falling back to Ionic's default logo instead of
        # erroring when it couldn't resolve the source file — several runs "succeeded" with
        # the wrong icon and no warning in the log. Generating the mipmaps ourselves with
        # ImageMagick removes that tool (and its file-detection quirks) from the equation
        # entirely, the same way we already do for the notification icon below.
        run: |
          sudo apt-get update -y && sudo apt-get install -y imagemagick
          SRC="resources/icon-only.png"
          if [ ! -f "$SRC" ]; then
            echo "::error::$SRC not found in repo — icon cannot be generated. Check the file was uploaded to resources/icon-only.png."
            exit 1
          fi
          identify "$SRC"
          declare -A sizes=( [mdpi]=48 [hdpi]=72 [xhdpi]=96 [xxhdpi]=144 [xxxhdpi]=192 )
          for density in "${!sizes[@]}"; do
            size="${sizes[$density]}"
            dir="android/app/src/main/res/mipmap-${density}"
            mkdir -p "$dir"
            convert "$SRC" -resize ${size}x${size}^ -gravity center -extent ${size}x${size} "$dir/ic_launcher.png"
            convert "$SRC" -resize ${size}x${size}^ -gravity center -extent ${size}x${size} \
              \( +clone -alpha extract -fill black -colorize 100 -fill white \
                 -draw "circle $((size/2)),$((size/2)) $((size/2)),0" \) \
              -alpha off -compose CopyOpacity -composite "$dir/ic_launcher_round.png"
          done
          # Remove the adaptive-icon XML (foreground/background layers + safe-zone cropping)
          # that `cap add android` generates by default — Android 8+ launchers prefer it over
          # the plain PNGs above when present, which is how the default logo kept winning even
          # after we fixed the PNGs. Deleting it makes the launcher fall back to our PNGs.
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          echo "Generated launcher icons from $SRC:"
          find android/app/src/main/res/mipmap-* -name "ic_launcher*.png" | sort

      - name: Generate notification small icon (ic_stat_icon)
        run: |
          sudo apt-get update -y && sudo apt-get install -y imagemagick
          declare -A sizes=( [mdpi]=24 [hdpi]=36 [xhdpi]=48 [xxhdpi]=72 [xxxhdpi]=96 )
          for density in "${!sizes[@]}"; do
            size="${sizes[$density]}"
            dir="android/app/src/main/res/drawable-${density}"
            mkdir -p "$dir"
            # Simple white bell silhouette on a transparent background — Android notification
            # icons must be a flat white/transparent shape (the OS colors it automatically).
            convert -size ${size}x${size} xc:transparent \
              -fill white -draw "circle $((size/2)),$((size/2)) $((size/2)),$((size/10))" \
              "$dir/ic_stat_icon.png"
          done
          # Fallback copy into the density-less drawable/ folder some plugin versions look at.
          mkdir -p android/app/src/main/res/drawable
          cp android/app/src/main/res/drawable-xhdpi/ic_stat_icon.png android/app/src/main/res/drawable/ic_stat_icon.png

      - name: Inject Myket billing plugin (native-billing/)
        run: |
          set -e
          APP_ID="com.mahdihd648.dreamlifeapp"
          APP_PATH="${APP_ID//./\/}"
          JAVA_DIR="android/app/src/main/java/${APP_PATH}"
          BILLING_DIR="${JAVA_DIR}/billing"

          # 1) AIDL interface Myket's billing service implements
          mkdir -p android/app/src/main/aidl/com/android/vending/billing
          cp native-billing/aidl/com/android/vending/billing/IInAppBillingService.aidl \
             android/app/src/main/aidl/com/android/vending/billing/IInAppBillingService.aidl

          # 2) The plugin itself, into the app's own package under a "billing" sub-package
          mkdir -p "$BILLING_DIR"
          cp native-billing/MarketBillingPlugin.java "$BILLING_DIR/MarketBillingPlugin.java"
          sed -i "s/^package .*billing;/package ${APP_ID}.billing;/" "$BILLING_DIR/MarketBillingPlugin.java"

          # 3) Register the plugin + import in MainActivity (Java, as generated by `cap add android`)
          MAIN_ACTIVITY="${JAVA_DIR}/MainActivity.java"
          python3 - "$MAIN_ACTIVITY" "$APP_ID" <<'PYEOF'
          import sys, re
          path, app_id = sys.argv[1], sys.argv[2]
          with open(path, encoding='utf-8') as f:
              src = f.read()
          if 'MarketBillingPlugin' not in src:
              src = src.replace(
                  'import com.getcapacitor.BridgeActivity;',
                  'import android.os.Bundle;\nimport com.getcapacitor.BridgeActivity;\n'
                  f'import {app_id}.billing.MarketBillingPlugin;'
              )
              src = re.sub(
                  r'public class MainActivity extends BridgeActivity \{\}',
                  'public class MainActivity extends BridgeActivity {\n'
                  '    @Override\n'
                  '    public void onCreate(Bundle savedInstanceState) {\n'
                  '        registerPlugin(MarketBillingPlugin.class);\n'
                  '        super.onCreate(savedInstanceState);\n'
                  '    }\n'
                  '}',
                  src
              )
          with open(path, 'w', encoding='utf-8') as f:
              f.write(src)
          PYEOF

          # 4) Manifest: permission + package visibility <queries> for Myket's classic billing
          #    service (package visibility is required on Android 11+ to see the store app at all)
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          python3 - "$MANIFEST" <<'PYEOF'
          import sys, re
          path = sys.argv[1]
          with open(path, encoding='utf-8') as f:
              src = f.read()

          extra_permissions = (
              '    <uses-permission android:name="ir.mservices.market.BILLING" />\n'
          )
          if 'ir.mservices.market.BILLING' not in src:
              src = re.sub(r'(<manifest[^>]*>\n)', r'\1' + extra_permissions, src, count=1)

          queries_block = (
              '    <queries>\n'
              '        <package android:name="ir.mservices.market" />\n'
              '    </queries>\n'
          )
          if '<queries>' not in src:
              src = src.replace('<application', queries_block + '    <application', 1)

          with open(path, 'w', encoding='utf-8') as f:
              f.write(src)
          PYEOF

          # 5) Enable AIDL compilation. AGP 8+ turns this OFF by default, so without it the
          #    IInAppBillingService.aidl file from step 1 is silently ignored and the plugin
          #    fails to compile ("cannot find symbol: IInAppBillingService").
          APP_GRADLE="android/app/build.gradle"
          python3 - "$APP_GRADLE" <<'PYEOF'
          import sys, re
          path = sys.argv[1]
          with open(path, encoding='utf-8') as f:
              src = f.read()
          if 'buildFeatures' in src:
              if 'aidl' not in src:
                  src = re.sub(r'buildFeatures\s*\{', 'buildFeatures {\n        aidl true', src, count=1)
          else:
              src = re.sub(
                  r'(android\s*\{)',
                  r'\1\n    buildFeatures {\n        aidl true\n    }',
                  src, count=1
              )
          with open(path, 'w', encoding='utf-8') as f:
              f.write(src)
          PYEOF

      - name: Add notification permissions (POST_NOTIFICATIONS / exact alarm / boot)
        # Without these, @capacitor/local-notifications schedules silently fail or get dropped
        # by the OS on Android 13+ (runtime permission), Android 12+ (exact alarms), and after
        # a phone reboot (rescheduling needs boot access).
        run: |
          set -e
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          python3 - "$MANIFEST" <<'PYEOF'
          import sys, re
          path = sys.argv[1]
          with open(path, encoding='utf-8') as f:
              src = f.read()

          notif_permissions = (
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n'
              '    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n'
              '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n'
              '    <uses-permission android:name="android.permission.VIBRATE" />\n'
          )
          for perm in [
              'android.permission.POST_NOTIFICATIONS',
              'android.permission.SCHEDULE_EXACT_ALARM',
              'android.permission.RECEIVE_BOOT_COMPLETED',
              'android.permission.VIBRATE',
          ]:
              if perm not in src:
                  src = re.sub(r'(<manifest[^>]*>\n)',
                                lambda m, p=perm: m.group(1) + f'    <uses-permission android:name="{p}" />\n',
                                src, count=1)

          with open(path, 'w', encoding='utf-8') as f:
              f.write(src)
          PYEOF

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: Wire up release signing in build.gradle
        run: |
          APP_GRADLE="android/app/build.gradle"
          python3 - "$APP_GRADLE" <<'PYEOF'
          import sys, re
          path = sys.argv[1]
          with open(path, encoding='utf-8') as f:
              src = f.read()

          signing_block = '''
              signingConfigs {
                  release {
                      storeFile file("release.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
          '''
          if 'signingConfigs' not in src:
              src = re.sub(r'(android\s*\{)', r'\1' + signing_block, src, count=1)

          if 'signingConfig signingConfigs.release' not in src:
              src = re.sub(
                  r'(buildTypes\s*\{\s*release\s*\{)',
                  r'\1\n            signingConfig signingConfigs.release',
                  src, count=1
              )

          with open(path, 'w', encoding='utf-8') as f:
              f.write(src)
          PYEOF

      - name: Build release APK (signed)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dreamlife-apk-release
          path: android/app/build/outputs/apk/release/app-release.apk
