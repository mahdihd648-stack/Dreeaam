                  // --- نلسون ماندلا ---
                  {"شکست نمی‌خورم مگر آن‌که تسلیم شوم.", "نلسون ماندلا"},
                  {"همیشه به‌نظر غیرممکن می‌رسد، تا زمانی که انجام شود.", "نلسون ماندلا"},
                  {"شجاعت، نبودِ ترس نیست، بلکه پیروزی بر آن است.", "نلسون ماندلا"},
