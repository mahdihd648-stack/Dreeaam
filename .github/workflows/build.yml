                  {"همیشه کارِ درست را انجام بده؛ بعضی‌ها را راضی می‌کند و بقیه را شگفت‌زده.", "مارک تواین"},

                  // --- اپیکور ---
                  {"ثروت واقعی، نه در داشتنِ بیشتر، بلکه در خواستنِ کمتر است.", "اپیکور"},
