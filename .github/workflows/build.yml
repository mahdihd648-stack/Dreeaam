          # ---- WidgetStyle.java (resolves the effective look for one widget instance) ----
          cat > "$WIDGET_DIR/WidgetStyle.java" <<JAVAEOF
          package ${APP_ID}.widget;

          import android.content.Context;
          import android.content.SharedPreferences;
          import android.graphics.Color;

          /** Combines the globally-pushed app theme (TaskWidgetPlugin.KEY_ACCENT etc., set from
           *  index.html whenever the user changes their in-app theme) with any per-widget overrides
           *  saved from WidgetConfigActivity — so each widget instance can either follow the app's
           *  current theme or use its own independent color/background/shape. */
          class WidgetStyle {
              final int accent, accent2, card, text, muted;
              final String bg;        // "opaque" | "glass" | "transparent"
              final String shape;     // "rounded" | "pill" | "sharp" (checklist widget)
              final String thickness; // "thin" | "medium" | "thick" (day-progress widget)
              final String pattern;   // "none" | "dots" | "stripes" | "grid" | "waves" — decorative overlay tinted with accent2
              final boolean showHour;   // day-progress widget only — off by default, costs extra battery when on
              final boolean showMinute; // day-progress widget only — off by default, costs extra battery when on
              final String clockStyle;  // "simple" | "digital" | "capsule" — how the hour/minute text looks

              private WidgetStyle(int accent, int accent2, int card, int text, int muted, String bg, String shape, String thickness, String pattern, boolean showHour, boolean showMinute, String clockStyle) {
                  this.accent = accent; this.accent2 = accent2; this.card = card; this.text = text; this.muted = muted;
                  this.bg = bg; this.shape = shape; this.thickness = thickness; this.pattern = pattern;
                  this.showHour = showHour; this.showMinute = showMinute; this.clockStyle = clockStyle;
              }

              static int safeColor(String hex, int fallback) {
                  try { return Color.parseColor(hex); } catch (Exception e) { return fallback; }
              }

              static String prefKey(int widgetId, String suffix) { return "w" + widgetId + "_" + suffix; }

              static WidgetStyle resolve(Context context, int widgetId) {
                  SharedPreferences prefs = context.getSharedPreferences(TaskWidgetPlugin.PREFS_NAME, Context.MODE_PRIVATE);
                  boolean followTheme = prefs.getBoolean(prefKey(widgetId, "followTheme"), true);
                  int accent, accent2, card, text, muted;
                  if (followTheme) {
                      accent = safeColor(prefs.getString(TaskWidgetPlugin.KEY_ACCENT, "#4338CA"), 0xFF4338CA);
                      accent2 = safeColor(prefs.getString(TaskWidgetPlugin.KEY_ACCENT2, "#BF26D3"), 0xFFBF26D3);
                      card = safeColor(prefs.getString(TaskWidgetPlugin.KEY_CARD, "#FDFCFF"), 0xFFFDFCFF);
                      text = safeColor(prefs.getString(TaskWidgetPlugin.KEY_TEXT, "#241F3D"), 0xFF241F3D);
                      muted = safeColor(prefs.getString(TaskWidgetPlugin.KEY_MUTED, "#8A84AB"), 0xFF8A84AB);
                  } else {
                      String themeName = prefs.getString(prefKey(widgetId, "themeName"), "brand");
                      int[] t = WidgetThemeCatalog.get(themeName);
                      accent = t[0]; accent2 = t[1]; card = t[2]; text = t[3]; muted = t[4];
                  }
                  String bg = prefs.getString(prefKey(widgetId, "bg"), "opaque");
                  String shape = prefs.getString(prefKey(widgetId, "shape"), "rounded");
                  String thickness = prefs.getString(prefKey(widgetId, "thickness"), "medium");
                  String pattern = prefs.getString(prefKey(widgetId, "pattern"), "none");
                  boolean showHour = prefs.getBoolean(prefKey(widgetId, "showHour"), false);
                  boolean showMinute = prefs.getBoolean(prefKey(widgetId, "showMinute"), false);
                  String clockStyle = prefs.getString(prefKey(widgetId, "clockStyle"), "simple");
                  return new WidgetStyle(accent, accent2, card, text, muted, bg, shape, thickness, pattern, showHour, showMinute, clockStyle);
              }

              /** Resolves a pattern key to its drawable resource id, or 0 for "none". */
              static int patternDrawableRes(Context context, String pattern) {
                  String appId = context.getPackageName();
                  if ("none".equals(pattern) || pattern == null) return 0;
                  int id = context.getResources().getIdentifier("widget_pattern_" + pattern, "drawable", appId);
                  return id;
              }
          }
          JAVAEOF

          # ---- ChecklistWidgetProvider.java ----
          cat > "$WIDGET_DIR/ChecklistWidgetProvider.java" <<JAVAEOF
          package ${APP_ID}.widget;

          import ${APP_ID}.R;
          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.view.View;
          import android.widget.RemoteViews;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.util.HashSet;
          import java.util.Set;

          public class ChecklistWidgetProvider extends AppWidgetProvider {

              public static final String ACTION_TOGGLE = "${APP_ID}.ACTION_TOGGLE_TASK";


              public static void refreshAll(Context context) {
                  AppWidgetManager mgr = AppWidgetManager.getInstance(context);
                  int[] ids = mgr.getAppWidgetIds(new ComponentName(context, ChecklistWidgetProvider.class));
                  for (int id : ids) updateOne(context, mgr, id);
              }

              public static void refreshOne(Context context, int widgetId) {
                  updateOne(context, AppWidgetManager.getInstance(context), widgetId);
              }

              private static void updateOne(Context context, AppWidgetManager mgr, int widgetId) {
                  SharedPreferences prefs = context.getSharedPreferences(TaskWidgetPlugin.PREFS_NAME, Context.MODE_PRIVATE);
                  RemoteViews views = new RemoteViews(context.getPackageName(), R.layout.widget_checklist);
                  WidgetStyle st = WidgetStyle.resolve(context, widgetId);

                  if ("transparent".equals(st.bg)) {
                      views.setViewVisibility(R.id.cardShadow, View.GONE);
                      views.setViewVisibility(R.id.cardBg, View.GONE);
                  } else {
                      int shapeRes = "pill".equals(st.shape) ? R.drawable.widget_card_shape_pill
                                   : "sharp".equals(st.shape) ? R.drawable.widget_card_shape_sharp
                                   : R.drawable.widget_card_shape;
                      int shadowRes = "pill".equals(st.shape) ? R.drawable.widget_card_shadow_pill
                                    : "sharp".equals(st.shape) ? R.drawable.widget_card_shadow_sharp
                                    : R.drawable.widget_card_shadow;
                      views.setViewVisibility(R.id.cardShadow, View.VISIBLE);
                      views.setViewVisibility(R.id.cardBg, View.VISIBLE);
                      views.setImageViewResource(R.id.cardShadow, shadowRes);
                      views.setImageViewResource(R.id.cardBg, shapeRes);
                      views.setInt(R.id.cardBg, "setColorFilter", st.card);
                      boolean glass = "glass".equals(st.bg);
                      views.setInt(R.id.cardBg, "setImageAlpha", glass ? 165 : 255);
                      views.setInt(R.id.cardShadow, "setImageAlpha", glass ? 90 : 140);
                  }

                  // Decorative background pattern (dots/stripes/grid/waves), tinted with the
                  // secondary theme color at low alpha so it reads as a subtle texture rather
                  // than competing with the task text. Hidden entirely when the card itself is
                  // hidden (transparent bg) or when the user picked "none".
                  int patternRes = "transparent".equals(st.bg) ? 0 : WidgetStyle.patternDrawableRes(context, st.pattern);
                  if (patternRes != 0) {
                      views.setViewVisibility(R.id.cardPattern, View.VISIBLE);
                      views.setImageViewResource(R.id.cardPattern, patternRes);
                      views.setInt(R.id.cardPattern, "setColorFilter", st.accent2);
                      views.setInt(R.id.cardPattern, "setImageAlpha", 46);
                  } else {
                      views.setViewVisibility(R.id.cardPattern, View.GONE);
                  }

                  views.setInt(R.id.title, "setTextColor", st.text);
                  views.setInt(R.id.emptyView, "setTextColor", st.muted);

                  // Scrollable task list: the row views themselves are built on demand by
                  // ChecklistRemoteViewsFactory (one instance per widgetId), so any number of
                  // tasks can be scrolled through instead of being capped at a handful of rows.
                  Intent adapterIntent = new Intent(context, ChecklistRemoteViewsService.class);
                  adapterIntent.putExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, widgetId);
                  // Distinct data Uri so each widget instance's RemoteViews isn't treated as an
                  // identical/cached intent by the framework (a well-known RemoteViewsService gotcha).
                  adapterIntent.setData(android.net.Uri.parse("widget://checklist/" + widgetId));
                  views.setRemoteAdapter(R.id.checklistListView, adapterIntent);
                  views.setEmptyView(R.id.checklistListView, R.id.emptyView);

                  // One shared click template for every row; each row supplies its own task_id via
                  // a fill-in intent (RemoteViewsFactory#getViewAt). Requires FLAG_MUTABLE so the
                  // system is allowed to merge that fill-in intent's extras in at click time.
                  Intent toggleTemplate = new Intent(context, ChecklistWidgetProvider.class);
                  toggleTemplate.setAction(ACTION_TOGGLE);
                  PendingIntent togglePi = PendingIntent.getBroadcast(context, widgetId, toggleTemplate,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_MUTABLE);
                  views.setPendingIntentTemplate(R.id.checklistListView, togglePi);

                  mgr.updateAppWidget(widgetId, views);
                  mgr.notifyAppWidgetViewDataChanged(widgetId, R.id.checklistListView);
              }

              @Override
              public void onUpdate(Context context, AppWidgetManager mgr, int[] appWidgetIds) {
                  for (int id : appWidgetIds) updateOne(context, mgr, id);
              }

              @Override
              public void onReceive(Context context, Intent intent) {
                  super.onReceive(context, intent);
                  if (!ACTION_TOGGLE.equals(intent.getAction())) return;
                  int taskId = intent.getIntExtra("task_id", -1);
                  if (taskId < 0) return;

                  SharedPreferences prefs = context.getSharedPreferences(TaskWidgetPlugin.PREFS_NAME, Context.MODE_PRIVATE);
                  Set<String> pending = new HashSet<>(prefs.getStringSet(TaskWidgetPlugin.KEY_PENDING, new HashSet<String>()));
                  pending.add(String.valueOf(taskId));

                  try {
                      JSONArray tasks = new JSONArray(prefs.getString(TaskWidgetPlugin.KEY_TASKS, "[]"));
                      for (int i = 0; i < tasks.length(); i++) {
                          JSONObject t = tasks.getJSONObject(i);
                          if (t.optInt("id", i) == taskId) {
                              t.put("done", !t.optBoolean("done", false));
                          }
                      }
                      prefs.edit()
                          .putStringSet(TaskWidgetPlugin.KEY_PENDING, pending)
                          .putString(TaskWidgetPlugin.KEY_TASKS, tasks.toString())
                          .apply();
                  } catch (Exception e) {
                      prefs.edit().putStringSet(TaskWidgetPlugin.KEY_PENDING, pending).apply();
                  }

                  refreshAll(context);
              }
          }
          JAVAEOF

          # ---- ChecklistRemoteViewsService.java (powers the scrollable task list — builds one
          #      row per task on demand instead of a fixed handful of rows, so the list can hold
          #      any number of tasks and be swiped through) ----
          cat > "$WIDGET_DIR/ChecklistRemoteViewsService.java" <<JAVAEOF
          package ${APP_ID}.widget;

          import ${APP_ID}.R;
          import android.appwidget.AppWidgetManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.widget.RemoteViews;
          import android.widget.RemoteViewsService;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class ChecklistRemoteViewsService extends RemoteViewsService {
              @Override
              public RemoteViewsFactory onGetViewFactory(Intent intent) {
                  return new Factory(getApplicationContext(), intent);
              }

              private static class Factory implements RemoteViewsFactory {
                  private final Context context;
                  private final int widgetId;
                  private JSONArray tasks = new JSONArray();
                  private WidgetStyle style;

                  Factory(Context context, Intent intent) {
                      this.context = context;
                      this.widgetId = intent.getIntExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, AppWidgetManager.INVALID_APPWIDGET_ID);
                  }

                  @Override
                  public void onCreate() { reload(); }

                  @Override
                  public void onDataSetChanged() { reload(); }

                  private void reload() {
                      style = WidgetStyle.resolve(context, widgetId);
                      SharedPreferences prefs = context.getSharedPreferences(TaskWidgetPlugin.PREFS_NAME, Context.MODE_PRIVATE);
                      try {
                          tasks = new JSONArray(prefs.getString(TaskWidgetPlugin.KEY_TASKS, "[]"));
                      } catch (Exception e) {
                          tasks = new JSONArray();
                      }
                  }

                  @Override
                  public void onDestroy() { tasks = new JSONArray(); }

                  @Override
                  public int getCount() { return tasks.length(); }

                  @Override
                  public RemoteViews getViewAt(int position) {
                      RemoteViews item = new RemoteViews(context.getPackageName(), R.layout.widget_checklist_item);
                      try {
                          JSONObject t = tasks.getJSONObject(position);
                          int taskId = t.optInt("id", position);
                          boolean done = t.optBoolean("done", false);
                          item.setTextViewText(R.id.itemLabel, t.optString("label"));
                          item.setInt(R.id.itemLabel, "setTextColor", style.text);
                          item.setImageViewResource(R.id.itemCheck, done ? R.drawable.widget_check_on : R.drawable.widget_check_off);
                          item.setInt(R.id.itemCheck, "setColorFilter", done ? style.accent : style.muted);

                          // Only the task_id differs row to row — merged into the provider's shared
                          // PendingIntentTemplate at click time.
                          Intent fillIn = new Intent();
                          fillIn.putExtra("task_id", taskId);
                          item.setOnClickFillInIntent(R.id.itemRow, fillIn);
                      } catch (Exception e) {
                          // leave a blank row rather than crash the whole list
                      }
                      return item;
                  }

                  @Override
                  public RemoteViews getLoadingView() { return null; }

                  @Override
                  public int getViewTypeCount() { return 1; }

                  @Override
                  public long getItemId(int position) { return position; }

                  @Override
                  public boolean hasStableIds() { return true; }
              }
          }
          JAVAEOF

          # ---- DayProgressWidgetProvider.java ----
          cat > "$WIDGET_DIR/DayProgressWidgetProvider.java" <<JAVAEOF
          package ${APP_ID}.widget;

          import ${APP_ID}.R;
          import android.app.AlarmManager;
          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.RectF;
          import android.graphics.SweepGradient;
          import android.view.View;
          import android.widget.RemoteViews;
          import java.util.Calendar;

          public class DayProgressWidgetProvider extends AppWidgetProvider {

              public static final String ACTION_TICK = "${APP_ID}.ACTION_WIDGET_TICK";

              public static void refreshAll(Context context) {
                  AppWidgetManager mgr = AppWidgetManager.getInstance(context);
                  int[] ids = mgr.getAppWidgetIds(new ComponentName(context, DayProgressWidgetProvider.class));
                  for (int id : ids) updateOne(context, mgr, id);
              }

              public static void refreshOne(Context context, int widgetId) {
                  updateOne(context, AppWidgetManager.getInstance(context), widgetId);
              }

              // Android batches/limits how often a widget can auto-refresh in the background (there's
              // no way to get a true once-a-second tick without a foreground service and heavy battery
              // cost) — this inexact repeating alarm gives a ~15 min cadence by default, which is 96
              // steps across the day and reads as smooth motion on a ring this size. If the user turns
              // on the live minute display (opt-in, see WidgetConfigActivity), we switch to a ~1 min
              // cadence just for that — that's the extra battery cost the config screen warns about,
              // so it only applies while at least one placed widget actually asked for it.
              private static PendingIntent tickIntent(Context context) {
                  Intent intent = new Intent(context, DayProgressWidgetProvider.class);
                  intent.setAction(ACTION_TICK);
                  return PendingIntent.getBroadcast(context, 0, intent,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              }

              private static boolean anyWidgetWantsMinuteTick(Context context) {
                  try {
                      AppWidgetManager mgr = AppWidgetManager.getInstance(context);
                      int[] ids = mgr.getAppWidgetIds(new ComponentName(context, DayProgressWidgetProvider.class));
                      SharedPreferences prefs = context.getSharedPreferences(TaskWidgetPlugin.PREFS_NAME, Context.MODE_PRIVATE);
                      for (int id : ids) {
                          if (prefs.getBoolean(WidgetStyle.prefKey(id, "showMinute"), false)) return true;
                      }
                  } catch (Exception e) { /* best-effort — falls back to the cheaper cadence */ }
                  return false;
              }

              private static void scheduleTick(Context context) {
                  try {
                      AlarmManager am = (AlarmManager) context.getSystemService(Context.ALARM_SERVICE);
                      if (am != null) {
                          long interval = anyWidgetWantsMinuteTick(context) ? 60_000L : AlarmManager.INTERVAL_FIFTEEN_MINUTES;
                          am.setInexactRepeating(AlarmManager.RTC, System.currentTimeMillis(),
                                  interval, tickIntent(context));
                      }
                  } catch (Exception e) { /* best-effort */ }
              }

              // Called from WidgetConfigActivity right after the user toggles "نمایش دقیقه" so the
              // tick cadence changes immediately instead of waiting for the next onUpdate cycle.
              static void rescheduleTick(Context context) {
                  cancelTick(context);
                  scheduleTick(context);
              }

              private static void cancelTick(Context context) {
                  try {
                      AlarmManager am = (AlarmManager) context.getSystemService(Context.ALARM_SERVICE);
                      if (am != null) am.cancel(tickIntent(context));
                  } catch (Exception e) { /* best-effort */ }
              }

              @Override
              public void onEnabled(Context context) { scheduleTick(context); }

              @Override
              public void onDisabled(Context context) { cancelTick(context); }

              @Override
              public void onUpdate(Context context, AppWidgetManager mgr, int[] appWidgetIds) {
                  scheduleTick(context); // safety net: re-arms the alarm in case it was lost (e.g. reboot)
                  for (int id : appWidgetIds) updateOne(context, mgr, id);
              }

              @Override
              public void onReceive(Context context, Intent intent) {
                  super.onReceive(context, intent);
                  if (ACTION_TICK.equals(intent.getAction())) {
                      refreshAll(context);
                  }
              }

              // Draws the ring as a soft two-color gradient sweep (accent -> accent2) that fills one
              // full lap every 24 hours (resetting at midnight), instead of the old day/90 fraction.
              private static Bitmap ringBitmap(float pct, int sizeDp, Context context, int accent, int accent2, int trackColor, float strokeFactor) {
                  float density = context.getResources().getDisplayMetrics().density;
                  int size = Math.max(1, (int) (sizeDp * density));
                  Bitmap bmp = Bitmap.createBitmap(size, size, Bitmap.Config.ARGB_8888);
                  Canvas canvas = new Canvas(bmp);
                  float stroke = size * strokeFactor;
                  RectF rect = new RectF(stroke, stroke, size - stroke, size - stroke);
                  float cx = size / 2f, cy = size / 2f;

                  Paint track = new Paint(Paint.ANTI_ALIAS_FLAG);
                  track.setStyle(Paint.Style.STROKE);
                  track.setStrokeWidth(stroke);
                  track.setColor(trackColor);
                  track.setStrokeCap(Paint.Cap.ROUND);
                  canvas.drawArc(rect, 0f, 360f, false, track);

                  Paint fg = new Paint(Paint.ANTI_ALIAS_FLAG);
                  fg.setStyle(Paint.Style.STROKE);
                  fg.setStrokeWidth(stroke);
                  fg.setStrokeCap(Paint.Cap.ROUND);
                  SweepGradient gradient = new SweepGradient(cx, cy,
                      new int[]{ accent, accent2, accent }, new float[]{ 0f, 0.5f, 1f });
                  fg.setShader(gradient);
                  canvas.drawArc(rect, -90f, 360f * pct, false, fg);
                  return bmp;
              }

              private static void updateOne(Context context, AppWidgetManager mgr, int widgetId) {
                  SharedPreferences prefs = context.getSharedPreferences(TaskWidgetPlugin.PREFS_NAME, Context.MODE_PRIVATE);
                  int day = prefs.getInt(TaskWidgetPlugin.KEY_DAY, 0);
                  WidgetStyle st = WidgetStyle.resolve(context, widgetId);

                  Calendar now = Calendar.getInstance();
                  int minutesSinceMidnight = now.get(Calendar.HOUR_OF_DAY) * 60 + now.get(Calendar.MINUTE);
                  float pct = Math.max(0f, Math.min(1f, minutesSinceMidnight / 1440f));
                  float strokeFactor = "thin".equals(st.thickness) ? 0.06f : "thick".equals(st.thickness) ? 0.13f : 0.09f;

                  RemoteViews views = new RemoteViews(context.getPackageName(), R.layout.widget_day_progress);

                  if ("transparent".equals(st.bg)) {
                      views.setViewVisibility(R.id.cardShadow, View.GONE);
                      views.setViewVisibility(R.id.cardBg, View.GONE);
                  } else {
                      views.setViewVisibility(R.id.cardShadow, View.VISIBLE);
                      views.setViewVisibility(R.id.cardBg, View.VISIBLE);
                      views.setInt(R.id.cardBg, "setColorFilter", st.card);
                      boolean glass = "glass".equals(st.bg);
                      views.setInt(R.id.cardBg, "setImageAlpha", glass ? 165 : 255);
                      views.setInt(R.id.cardShadow, "setImageAlpha", glass ? 90 : 140);
                  }

                  int patternRes = "transparent".equals(st.bg) ? 0 : WidgetStyle.patternDrawableRes(context, st.pattern);
                  if (patternRes != 0) {
                      views.setViewVisibility(R.id.cardPattern, View.VISIBLE);
                      views.setImageViewResource(R.id.cardPattern, patternRes);
                      views.setInt(R.id.cardPattern, "setColorFilter", st.accent2);
                      views.setInt(R.id.cardPattern, "setImageAlpha", 46);
                  } else {
                      views.setViewVisibility(R.id.cardPattern, View.GONE);
                  }

                  int track = (st.muted & 0x00FFFFFF) | 0x33000000;
                  views.setImageViewBitmap(R.id.ring, ringBitmap(pct, 96, context, st.accent, st.accent2, track, strokeFactor));
                  views.setTextViewText(R.id.dayLabel, "روز " + day);
                  views.setInt(R.id.dayLabel, "setTextColor", st.text);

                  if (st.showHour || st.showMinute) {
                      String clockText;
                      if (st.showHour && st.showMinute) {
                          clockText = String.format(java.util.Locale.US, "%02d:%02d", now.get(Calendar.HOUR_OF_DAY), now.get(Calendar.MINUTE));
                      } else if (st.showHour) {
                          clockText = String.format(java.util.Locale.US, "%02d", now.get(Calendar.HOUR_OF_DAY));
                      } else {
                          clockText = String.format(java.util.Locale.US, "%02d", now.get(Calendar.MINUTE));
                      }
                      views.setViewVisibility(R.id.clockLabelWrap, View.VISIBLE);
                      views.setTextViewText(R.id.clockLabel, clockText);
                      if ("capsule".equals(st.clockStyle)) {
                          // Small tinted pill behind the text, same recolor trick as cardBg.
                          views.setViewVisibility(R.id.clockBadgeBg, View.VISIBLE);
                          views.setInt(R.id.clockBadgeBg, "setColorFilter", st.accent);
                          views.setInt(R.id.clockBadgeBg, "setImageAlpha", 210);
                          views.setInt(R.id.clockLabel, "setTextColor", Color.WHITE);
                          views.setFloat(R.id.clockLabel, "setLetterSpacing", 0f);
                          views.setFloat(R.id.clockLabel, "setTextSize", 9f);
                      } else if ("digital".equals(st.clockStyle)) {
                          // Letter-spaced + accent-colored, for a spaced-out "LED display" feel.
                          views.setViewVisibility(R.id.clockBadgeBg, View.GONE);
                          views.setInt(R.id.clockLabel, "setTextColor", st.accent);
                          views.setFloat(R.id.clockLabel, "setLetterSpacing", 0.18f);
                          views.setFloat(R.id.clockLabel, "setTextSize", 9.5f);
                      } else {
                          // "simple" (default): small and muted, no decoration.
                          views.setViewVisibility(R.id.clockBadgeBg, View.GONE);
                          views.setInt(R.id.clockLabel, "setTextColor", st.muted);
                          views.setFloat(R.id.clockLabel, "setLetterSpacing", 0f);
                          views.setFloat(R.id.clockLabel, "setTextSize", 9f);
                      }
                  } else {
                      views.setViewVisibility(R.id.clockLabelWrap, View.GONE);
                  }

                  mgr.updateAppWidget(widgetId, views);
              }
          }
          JAVAEOF

          # ---- WidgetConfigActivity.java (the "add widget" / long-press "Edit" customization screen) ----
          cat > "$WIDGET_DIR/WidgetConfigActivity.java" <<JAVAEOF
          package ${APP_ID}.widget;

          import ${APP_ID}.R;
          import android.app.Activity;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProviderInfo;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.CompoundButton;
          import android.widget.FrameLayout;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.Switch;
          import android.widget.TextView;

          /** Shared "add widget" / long-press "Edit" screen for both home-screen widgets. Each
           *  widget instance can either follow the app's current in-app theme (default), or use
           *  one of the app's own theme palettes independently, plus its own background opacity
           *  and card shape / ring thickness — this is the per-widget customization layer. */
          public class WidgetConfigActivity extends Activity {

              private int appWidgetId = AppWidgetManager.INVALID_APPWIDGET_ID;
              private boolean isChecklist = true;

              private boolean followTheme = true;
              private String themeName = "brand";
              private String bg = "opaque";
              private String shape = "rounded";
              private String thickness = "medium";
              private String pattern = "none";
              private boolean showHour = false;
              private boolean showMinute = false;
              private String clockStyle = "simple";

              private LinearLayout themeSwatchRow, bgOptionRow, shapeOptionRow, thicknessOptionRow, patternOptionRow;
              private LinearLayout showHourRow, showMinuteRow, clockStyleOptionRow;
              private TextView clockBatteryHint, clockStyleLabel;
              private FrameLayout previewHolder;
              private Switch followThemeSwitch, showHourSwitch, showMinuteSwitch;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setResult(RESULT_CANCELED);

                  Bundle extras = getIntent().getExtras();
                  if (extras != null) {
                      appWidgetId = extras.getInt(AppWidgetManager.EXTRA_APPWIDGET_ID, AppWidgetManager.INVALID_APPWIDGET_ID);
                  }
                  if (appWidgetId == AppWidgetManager.INVALID_APPWIDGET_ID) {
                      finish();
                      return;
                  }

                  AppWidgetManager mgr = AppWidgetManager.getInstance(this);
                  AppWidgetProviderInfo info = mgr.getAppWidgetInfo(appWidgetId);
                  isChecklist = info == null || info.provider == null
                          || info.provider.getClassName().endsWith("ChecklistWidgetProvider");

                  setContentView(R.layout.activity_widget_config);

                  SharedPreferences prefs = getSharedPreferences(TaskWidgetPlugin.PREFS_NAME, Context.MODE_PRIVATE);
                  followTheme = prefs.getBoolean(WidgetStyle.prefKey(appWidgetId, "followTheme"), true);
                  themeName = prefs.getString(WidgetStyle.prefKey(appWidgetId, "themeName"), "brand");
                  bg = prefs.getString(WidgetStyle.prefKey(appWidgetId, "bg"), "opaque");
                  shape = prefs.getString(WidgetStyle.prefKey(appWidgetId, "shape"), "rounded");
                  thickness = prefs.getString(WidgetStyle.prefKey(appWidgetId, "thickness"), "medium");
                  pattern = prefs.getString(WidgetStyle.prefKey(appWidgetId, "pattern"), "none");
                  showHour = prefs.getBoolean(WidgetStyle.prefKey(appWidgetId, "showHour"), false);
                  showMinute = prefs.getBoolean(WidgetStyle.prefKey(appWidgetId, "showMinute"), false);
                  clockStyle = prefs.getString(WidgetStyle.prefKey(appWidgetId, "clockStyle"), "simple");

                  previewHolder = findViewById(R.id.previewHolder);
                  themeSwatchRow = findViewById(R.id.themeSwatchRow);
                  bgOptionRow = findViewById(R.id.bgOptionRow);
                  shapeOptionRow = findViewById(R.id.shapeOptionRow);
                  thicknessOptionRow = findViewById(R.id.thicknessOptionRow);
                  patternOptionRow = findViewById(R.id.patternOptionRow);
                  followThemeSwitch = findViewById(R.id.followThemeSwitch);
                  showHourRow = findViewById(R.id.showHourRow);
                  showMinuteRow = findViewById(R.id.showMinuteRow);
                  showHourSwitch = findViewById(R.id.showHourSwitch);
                  showMinuteSwitch = findViewById(R.id.showMinuteSwitch);
                  clockBatteryHint = findViewById(R.id.clockBatteryHint);
                  clockStyleOptionRow = findViewById(R.id.clockStyleOptionRow);
                  clockStyleLabel = findViewById(R.id.clockStyleLabel);
                  TextView shapeLabel = findViewById(R.id.shapeLabel);
                  TextView thicknessLabel = findViewById(R.id.thicknessLabel);

                  if (isChecklist) {
                      thicknessOptionRow.setVisibility(View.GONE);
                      thicknessLabel.setVisibility(View.GONE);
                      showHourRow.setVisibility(View.GONE);
                      showMinuteRow.setVisibility(View.GONE);
                      clockBatteryHint.setVisibility(View.GONE);
                      clockStyleOptionRow.setVisibility(View.GONE);
                      clockStyleLabel.setVisibility(View.GONE);
                  } else {
                      shapeOptionRow.setVisibility(View.GONE);
                      shapeLabel.setVisibility(View.GONE);
                  }

                  followThemeSwitch.setChecked(followTheme);
                  showHourSwitch.setChecked(showHour);
                  showMinuteSwitch.setChecked(showMinute);
                  buildThemeSwatches();
                  buildBgOptions();
                  if (isChecklist) buildShapeOptions(); else buildThicknessOptions();
                  buildPatternOptions();
                  buildClockStyleOptions();
                  updateClockStyleRowVisibility();
                  updateSwatchEnabled();
                  renderPreview();

                  followThemeSwitch.setOnCheckedChangeListener(new CompoundButton.OnCheckedChangeListener() {
                      @Override public void onCheckedChanged(CompoundButton buttonView, boolean isChecked) {
                          followTheme = isChecked;
                          updateSwatchEnabled();
                          renderPreview();
                      }
                  });
                  showHourSwitch.setOnCheckedChangeListener(new CompoundButton.OnCheckedChangeListener() {
                      @Override public void onCheckedChanged(CompoundButton buttonView, boolean isChecked) {
                          showHour = isChecked;
                          updateClockStyleRowVisibility();
                          renderPreview();
                      }
                  });
                  showMinuteSwitch.setOnCheckedChangeListener(new CompoundButton.OnCheckedChangeListener() {
                      @Override public void onCheckedChanged(CompoundButton buttonView, boolean isChecked) {
                          showMinute = isChecked;
                          updateClockStyleRowVisibility();
                          renderPreview();
                      }
                  });

                  Button saveBtn = findViewById(R.id.saveBtn);
                  saveBtn.setOnClickListener(new View.OnClickListener() {
                      @Override public void onClick(View v) { save(); }
                  });
              }

              private void updateSwatchEnabled() {
                  themeSwatchRow.setAlpha(followTheme ? 0.35f : 1f);
                  for (int i = 0; i < themeSwatchRow.getChildCount(); i++) {
                      themeSwatchRow.getChildAt(i).setEnabled(!followTheme);
                  }
              }

              // The clock-appearance row only makes sense once the user actually turned the
              // hour/minute display on — keep it out of the way otherwise.
              private void updateClockStyleRowVisibility() {
                  if (isChecklist) return;
                  int vis = (showHour || showMinute) ? View.VISIBLE : View.GONE;
                  clockStyleOptionRow.setVisibility(vis);
                  clockStyleLabel.setVisibility(vis);
              }

              private int dp(int v) {
                  return (int) TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, v, getResources().getDisplayMetrics());
              }

              private void buildThemeSwatches() {
                  themeSwatchRow.removeAllViews();
                  for (final String name : WidgetThemeCatalog.NAMES) {
                      int[] colors = WidgetThemeCatalog.get(name);
                      FrameLayout holder = new FrameLayout(this);
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(dp(44), dp(44));
                      lp.setMargins(dp(6), dp(4), dp(6), dp(4));
                      holder.setLayoutParams(lp);

                      View dot = new View(this);
                      FrameLayout.LayoutParams dotLp = new FrameLayout.LayoutParams(dp(36), dp(36), Gravity.CENTER);
                      GradientDrawable circle = new GradientDrawable();
                      circle.setShape(GradientDrawable.OVAL);
                      circle.setColor(colors[0]);
                      if (name.equals(themeName)) circle.setStroke(dp(3), Color.WHITE);
                      dot.setBackground(circle);
                      dot.setLayoutParams(dotLp);
                      holder.addView(dot);
                      holder.setOnClickListener(new View.OnClickListener() {
                          @Override public void onClick(View v) {
                              themeName = name;
                              buildThemeSwatches();
                              updateSwatchEnabled();
                              renderPreview();
                          }
                      });
                      themeSwatchRow.addView(holder);
                  }
              }

              private Button pillButton(String label, boolean selected) {
                  Button b = new Button(this);
                  b.setText(label);
                  b.setAllCaps(false);
                  b.setTextSize(13);
                  b.setTextColor(selected ? Color.WHITE : Color.parseColor("#CFCBE0"));
                  GradientDrawable bgShape = new GradientDrawable();
                  bgShape.setCornerRadius(dp(18));
                  bgShape.setColor(selected ? Color.parseColor("#4338CA") : Color.parseColor("#262A38"));
                  b.setBackground(bgShape);
                  b.setPadding(dp(14), dp(8), dp(14), dp(8));
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  lp.setMarginEnd(dp(10));
                  b.setLayoutParams(lp);
                  return b;
              }

              private void buildBgOptions() {
                  bgOptionRow.removeAllViews();
                  String[] keys = { "opaque", "glass", "transparent" };
                  String[] labels = { "کدر", "شیشه‌ای", "بدون پس‌زمینه" };
                  for (int i = 0; i < keys.length; i++) {
                      final String key = keys[i];
                      Button b = pillButton(labels[i], key.equals(bg));
                      b.setOnClickListener(new View.OnClickListener() {
                          @Override public void onClick(View v) { bg = key; buildBgOptions(); renderPreview(); }
                      });
                      bgOptionRow.addView(b);
                  }
              }

              private void buildShapeOptions() {
                  shapeOptionRow.removeAllViews();
                  String[] keys = { "rounded", "pill", "sharp" };
                  String[] labels = { "گردگوشه", "بیضی", "تیز" };
                  for (int i = 0; i < keys.length; i++) {
                      final String key = keys[i];
                      Button b = pillButton(labels[i], key.equals(shape));
                      b.setOnClickListener(new View.OnClickListener() {
                          @Override public void onClick(View v) { shape = key; buildShapeOptions(); renderPreview(); }
                      });
                      shapeOptionRow.addView(b);
                  }
              }

              private void buildThicknessOptions() {
                  thicknessOptionRow.removeAllViews();
                  String[] keys = { "thin", "medium", "thick" };
                  String[] labels = { "نازک", "متوسط", "ضخیم" };
                  for (int i = 0; i < keys.length; i++) {
                      final String key = keys[i];
                      Button b = pillButton(labels[i], key.equals(thickness));
                      b.setOnClickListener(new View.OnClickListener() {
                          @Override public void onClick(View v) { thickness = key; buildThicknessOptions(); renderPreview(); }
                      });
                      thicknessOptionRow.addView(b);
                  }
              }

              private void buildPatternOptions() {
                  patternOptionRow.removeAllViews();
                  String[] keys = { "none", "dots", "stripes", "grid", "waves", "chevron", "circles", "confetti", "crosshatch", "hearts" };
                  String[] labels = { "بدون طرح", "نقطه‌ای", "راه‌راه", "شطرنجی", "موجی", "زیگزاگ", "حبابی", "کانفتی", "شبکه مورب", "قلبی" };
                  for (int i = 0; i < keys.length; i++) {
                      final String key = keys[i];
                      Button b = pillButton(labels[i], key.equals(pattern));
                      b.setOnClickListener(new View.OnClickListener() {
                          @Override public void onClick(View v) { pattern = key; buildPatternOptions(); renderPreview(); }
                      });
                      patternOptionRow.addView(b);
                  }
              }

              private void buildClockStyleOptions() {
                  clockStyleOptionRow.removeAllViews();
                  String[] keys = { "simple", "digital", "capsule" };
                  String[] labels = { "ساده", "دیجیتال", "کپسولی" };
                  for (int i = 0; i < keys.length; i++) {
                      final String key = keys[i];
                      Button b = pillButton(labels[i], key.equals(clockStyle));
                      b.setOnClickListener(new View.OnClickListener() {
                          @Override public void onClick(View v) { clockStyle = key; buildClockStyleOptions(); renderPreview(); }
                      });
                      clockStyleOptionRow.addView(b);
                  }
              }

              private int[] currentAppColors() {
                  SharedPreferences prefs = getSharedPreferences(TaskWidgetPlugin.PREFS_NAME, Context.MODE_PRIVATE);
                  return new int[]{
                      WidgetStyle.safeColor(prefs.getString(TaskWidgetPlugin.KEY_ACCENT, "#4338CA"), 0xFF4338CA),
                      WidgetStyle.safeColor(prefs.getString(TaskWidgetPlugin.KEY_ACCENT2, "#BF26D3"), 0xFFBF26D3),
                      WidgetStyle.safeColor(prefs.getString(TaskWidgetPlugin.KEY_CARD, "#FDFCFF"), 0xFFFDFCFF),
                      WidgetStyle.safeColor(prefs.getString(TaskWidgetPlugin.KEY_TEXT, "#241F3D"), 0xFF241F3D),
                      WidgetStyle.safeColor(prefs.getString(TaskWidgetPlugin.KEY_MUTED, "#8A84AB"), 0xFF8A84AB)
                  };
              }

              private void renderPreview() {
                  previewHolder.removeAllViews();
                  int[] colors = followTheme ? currentAppColors() : WidgetThemeCatalog.get(themeName);
                  int accent = colors[0], accent2 = colors[1], card = colors[2], text = colors[3], muted = colors[4];

                  FrameLayout.LayoutParams full = new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT);

                  if (!"transparent".equals(bg)) {
                      View cardView = new View(this);
                      GradientDrawable shapeDrawable = new GradientDrawable();
                      shapeDrawable.setColor(card);
                      if (!isChecklist || "pill".equals(shape)) shapeDrawable.setCornerRadius(dp(999));
                      else if ("sharp".equals(shape)) shapeDrawable.setCornerRadius(dp(4));
                      else shapeDrawable.setCornerRadius(dp(24));
                      cardView.setBackground(shapeDrawable);
                      cardView.setAlpha("glass".equals(bg) ? 0.65f : 1f);
                      previewHolder.addView(cardView, full);

                      int patRes = WidgetStyle.patternDrawableRes(this, pattern);
                      if (patRes != 0) {
                          ImageView patView = new ImageView(this);
                          patView.setImageResource(patRes);
                          patView.setScaleType(ImageView.ScaleType.FIT_XY);
                          patView.setColorFilter(accent2);
                          patView.setImageAlpha(46);
                          previewHolder.addView(patView, full);
                      }
                  }

                  if (isChecklist) {
                      LinearLayout content = new LinearLayout(this);
                      content.setOrientation(LinearLayout.VERTICAL);
                      content.setPadding(dp(16), dp(14), dp(16), dp(14));
                      TextView title = new TextView(this);
                      title.setText("چک‌لیست امروز");
                      title.setTextColor(text);
                      title.setTextSize(13);
                      title.setTypeface(null, Typeface.BOLD);
                      content.addView(title);
                      for (int i = 0; i < 2; i++) {
                          LinearLayout row = new LinearLayout(this);
                          row.setOrientation(LinearLayout.HORIZONTAL);
                          row.setGravity(Gravity.CENTER_VERTICAL);
                          row.setPadding(0, dp(6), 0, dp(6));
                          View dot = new View(this);
                          GradientDrawable dotShape = new GradientDrawable();
                          dotShape.setShape(GradientDrawable.OVAL);
                          dotShape.setColor(i == 0 ? accent : Color.TRANSPARENT);
                          dotShape.setStroke(dp(1), muted);
                          dot.setBackground(dotShape);
                          LinearLayout.LayoutParams dotLp = new LinearLayout.LayoutParams(dp(14), dp(14));
                          dotLp.setMarginEnd(dp(8));
                          row.addView(dot, dotLp);
                          View line = new View(this);
                          line.setBackgroundColor(muted);
                          LinearLayout.LayoutParams lineLp = new LinearLayout.LayoutParams(dp(90), dp(2));
                          line.setLayoutParams(lineLp);
                          row.addView(line);
                          content.addView(row);
                      }
                      previewHolder.addView(content, full);
                  } else {
                      LinearLayout dayCol = new LinearLayout(this);
                      dayCol.setOrientation(LinearLayout.VERTICAL);
                      dayCol.setGravity(Gravity.CENTER);
                      TextView dayText = new TextView(this);
                      dayText.setText("روز ۱۲");
                      dayText.setTextColor(text);
                      dayText.setTypeface(null, Typeface.BOLD);
                      dayText.setTextSize(15);
                      dayCol.addView(dayText);
                      if (showHour || showMinute) {
                          String clockStr = showHour && showMinute ? "12:34" : showHour ? "12" : "34";
                          TextView clockText = new TextView(this);
                          clockText.setText(clockStr);
                          clockText.setTextSize(9);
                          LinearLayout.LayoutParams clockLp = new LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                          clockLp.topMargin = dp(1);
                          if ("capsule".equals(clockStyle)) {
                              GradientDrawable pill = new GradientDrawable();
                              pill.setShape(GradientDrawable.RECTANGLE);
                              pill.setCornerRadius(dp(999));
                              pill.setColor(accent);
                              clockText.setBackground(pill);
                              clockText.setPadding(dp(6), dp(1), dp(6), dp(1));
                              clockText.setTextColor(Color.WHITE);
                          } else if ("digital".equals(clockStyle)) {
                              clockText.setLetterSpacing(0.18f);
                              clockText.setTextColor(accent);
                          } else {
                              clockText.setTextColor(muted);
                          }
                          dayCol.addView(clockText, clockLp);
                      }
                      FrameLayout.LayoutParams centerLp = new FrameLayout.LayoutParams(
                              ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT, Gravity.CENTER);
                      previewHolder.addView(dayCol, centerLp);
                  }
              }

              private void save() {
                  SharedPreferences prefs = getSharedPreferences(TaskWidgetPlugin.PREFS_NAME, Context.MODE_PRIVATE);
                  SharedPreferences.Editor editor = prefs.edit();
                  editor.putBoolean(WidgetStyle.prefKey(appWidgetId, "followTheme"), followTheme);
                  editor.putString(WidgetStyle.prefKey(appWidgetId, "themeName"), themeName);
                  editor.putString(WidgetStyle.prefKey(appWidgetId, "bg"), bg);
                  editor.putString(WidgetStyle.prefKey(appWidgetId, "shape"), shape);
                  editor.putString(WidgetStyle.prefKey(appWidgetId, "thickness"), thickness);
                  editor.putString(WidgetStyle.prefKey(appWidgetId, "pattern"), pattern);
                  editor.putBoolean(WidgetStyle.prefKey(appWidgetId, "showHour"), showHour);
                  editor.putBoolean(WidgetStyle.prefKey(appWidgetId, "showMinute"), showMinute);
                  editor.putString(WidgetStyle.prefKey(appWidgetId, "clockStyle"), clockStyle);
                  editor.apply();

                  if (isChecklist) {
                      ChecklistWidgetProvider.refreshOne(this, appWidgetId);
                  } else {
                      DayProgressWidgetProvider.refreshOne(this, appWidgetId);
                      // Applies the battery-cost cadence change (see the config screen's warning
                      // text) immediately, instead of waiting for the next background onUpdate.
                      DayProgressWidgetProvider.rescheduleTick(this);
                  }

                  Intent result = new Intent();
                  result.putExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, appWidgetId);
                  setResult(RESULT_OK, result);
                  finish();
              }
          }
          JAVAEOF

          # ---- res/layout/widget_checklist.xml ----
          cat > "$RES_DIR/layout/widget_checklist.xml" <<'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent">

              <!-- Soft drop shadow: a static translucent rounded rect, offset a couple dp down so
                   the card in front reads as gently floating instead of a flat pasted-on rectangle. -->
              <ImageView
                  android:id="@+id/cardShadow"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:layout_marginTop="3dp"
                  android:src="@drawable/widget_card_shadow"
                  android:scaleType="fitXY" />

              <!-- The actual card: one shape recolored at runtime (setColorFilter) to whatever
                   theme.card color the app is currently using — this is what makes the widget
                   follow the in-app theme instead of a hardcoded lavender box. -->
              <ImageView
                  android:id="@+id/cardBg"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:src="@drawable/widget_card_shape"
                  android:scaleType="fitXY" />

              <!-- Optional decorative pattern (dots/stripes/grid/waves), drawn on top of cardBg
                   and tinted with the secondary theme color at runtime. Gone by default. -->
              <ImageView
                  android:id="@+id/cardPattern"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:scaleType="fitXY"
                  android:visibility="gone" />

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:orientation="vertical"
                  android:padding="16dp">

                  <TextView
                      android:id="@+id/title"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="چک‌لیست امروز"
                      android:textDirection="rtl"
                      android:textAlignment="viewStart"
                      android:textColor="#241F3D"
                      android:textStyle="bold"
                      android:textSize="14sp"
                      android:paddingBottom="8dp" />

                  <!-- Real scrollable task list (backed by ChecklistRemoteViewsService), so any
                       number of tasks can be swiped through — not capped at a fixed row count,
                       and resizing the widget taller simply reveals more rows at once. -->
                  <ListView
                      android:id="@+id/checklistListView"
                      android:layout_width="match_parent"
                      android:layout_height="0dp"
                      android:layout_weight="1"
                      android:divider="@null"
                      android:dividerHeight="0dp"
                      android:scrollbars="none"
                      android:listSelector="@android:color/transparent"
                      android:cacheColorHint="#00000000" />

                  <TextView
                      android:id="@+id/emptyView"
                      android:layout_width="match_parent"
                      android:layout_height="0dp"
                      android:layout_weight="1"
                      android:gravity="center"
                      android:text="کاری برای امروز نیست"
                      android:textDirection="rtl"
                      android:textColor="#8A84AB"
                      android:textSize="12sp"
                      android:visibility="gone" />

              </LinearLayout>
          </FrameLayout>
          XMLEOF

          # ---- res/layout/widget_checklist_item.xml (one row inside the scrollable list, built
          #      per-item by ChecklistRemoteViewsFactory) ----
          cat > "$RES_DIR/layout/widget_checklist_item.xml" <<'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/itemRow"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:orientation="horizontal"
              android:gravity="center_vertical"
              android:paddingTop="5dp"
              android:paddingBottom="5dp">
              <ImageView
