          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.util.HashSet;
          import java.util.Set;

          @CapacitorPlugin(name = "TaskWidget")
          public class TaskWidgetPlugin extends Plugin {
              public static final String PREFS_NAME = "TaskWidgetPrefs";
              public static final String KEY_TASKS = "tasks_json";
              public static final String KEY_DAY = "day_number";
              public static final String KEY_PENDING = "pending_toggles";
              public static final String KEY_ACCENT = "theme_accent";
              public static final String KEY_ACCENT2 = "theme_accent2";
              public static final String KEY_CARD = "theme_card";
              public static final String KEY_TEXT = "theme_text";
              public static final String KEY_MUTED = "theme_muted";

              private SharedPreferences prefs() {
                  return getContext().getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE);
              }

              @PluginMethod
              public void updateTasks(PluginCall call) {
                  JSArray tasks = call.getArray("tasks");
                  if (tasks == null) tasks = new JSArray();
                  prefs().edit().putString(KEY_TASKS, tasks.toString()).apply();
                  ChecklistWidgetProvider.refreshAll(getContext());
                  call.resolve();
              }

              @PluginMethod
              public void updateDayProgress(PluginCall call) {
                  Integer day = call.getInt("dayNumber", 0);
                  prefs().edit().putInt(KEY_DAY, day).apply();
                  DayProgressWidgetProvider.refreshAll(getContext());
                  call.resolve();
              }

              @PluginMethod
              public void updateTheme(PluginCall call) {
                  prefs().edit()
                      .putString(KEY_ACCENT, call.getString("accent", "#4338CA"))
                      .putString(KEY_ACCENT2, call.getString("accent2", "#BF26D3"))
                      .putString(KEY_CARD, call.getString("card", "#FDFCFF"))
                      .putString(KEY_TEXT, call.getString("text", "#241F3D"))
                      .putString(KEY_MUTED, call.getString("muted", "#8A84AB"))
                      .apply();
                  ChecklistWidgetProvider.refreshAll(getContext());
                  DayProgressWidgetProvider.refreshAll(getContext());
                  QuoteWidgetProvider.refreshAll(getContext());
                  CountdownWidgetProvider.refreshAll(getContext());
                  call.resolve();
              }

              @PluginMethod
              public void getPendingToggles(PluginCall call) {
                  Set<String> pending = prefs().getStringSet(KEY_PENDING, new HashSet<String>());
                  JSArray ids = new JSArray();
                  if (pending != null) {
                      for (String s : pending) {
                          try { ids.put(Integer.parseInt(s)); } catch (NumberFormatException ignored) {}
                      }
                  }
                  prefs().edit().remove(KEY_PENDING).apply();
                  JSObject ret = new JSObject();
                  ret.put("ids", ids);
                  call.resolve(ret);
              }
          }
