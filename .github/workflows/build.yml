          package ${APP_ID}.widget;

          import ${APP_ID}.R;
          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Bitmap;
          import android.graphics.BlurMaskFilter;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.LinearGradient;
          import android.graphics.Paint;
          import android.graphics.Path;
          import android.graphics.RadialGradient;
          import android.graphics.RectF;
          import android.graphics.Shader;
          import android.os.Bundle;
          import android.view.View;
          import android.widget.RemoteViews;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.util.HashSet;
          import java.util.Set;

          public class ChecklistWidgetProvider extends AppWidgetProvider {

              public static final String ACTION_TOGGLE = "${APP_ID}.ACTION_TOGGLE_TASK";


              public static void refreshAll(Context context) {
                  AppWidgetManager mgr = AppWidgetManager.getInstance(context);
                  int[] ids = mgr.getAppWidgetIds(new ComponentName(context, ChecklistWidgetProvider.class));
                  for (int id : ids) updateOne(context, mgr, id);
              }

              public static void refreshOne(Context context, int widgetId) {
                  updateOne(context, AppWidgetManager.getInstance(context), widgetId);
              }

              // Small color-math helpers, mirrored from DayProgressWidgetProvider so the checklist
              // widget's hand-drawn accents (progress bar, check medallions) share the same premium
              // gradient/glow language as the rest of the widget family instead of looking bolted on.
              private static int withAlpha(int color, int alpha) {
                  return (color & 0x00FFFFFF) | (alpha << 24);
              }
              private static int lighten(int color, float factor) {
                  int a = Color.alpha(color);
                  int r = Math.min(255, (int) (Color.red(color) + (255 - Color.red(color)) * factor));
                  int g = Math.min(255, (int) (Color.green(color) + (255 - Color.green(color)) * factor));
                  int b = Math.min(255, (int) (Color.blue(color) + (255 - Color.blue(color)) * factor));
                  return Color.argb(a, r, g, b);
              }
              private static int darken(int color, float factor) {
                  int a = Color.alpha(color);
                  int r = (int) (Color.red(color) * (1 - factor));
                  int g = (int) (Color.green(color) * (1 - factor));
                  int b = (int) (Color.blue(color) * (1 - factor));
                  return Color.argb(a, r, g, b);
              }

              // Slim gradient progress bar for the header. Baked into a fixed-reference-width bitmap
              // and stretched via the ImageView's scaleType="fitXY" -- the same trick cardBg/cardShadow
              // already use to fill an unknown widget width. Bitmap height matches the layout height
              // exactly, so fitXY only ever stretches the width axis, never the height.
              static Bitmap progressBarBitmap(float pct, int widthDp, int heightDp, Context context,
                                               int accent, int accent2, int trackColor) {
                  float density = context.getResources().getDisplayMetrics().density;
                  int w = Math.max(1, (int) (widthDp * density));
                  int h = Math.max(1, (int) (heightDp * density));
                  Bitmap bmp = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888);
                  Canvas canvas = new Canvas(bmp);
                  float r = h / 2f;

                  Paint trackPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  trackPaint.setColor(trackColor);
                  canvas.drawRoundRect(new RectF(0, 0, w, h), r, r, trackPaint);

                  float fillW = Math.max(h, w * Math.max(0f, Math.min(1f, pct)));
                  if (pct > 0.01f) {
                      RectF fillRect = new RectF(0, 0, fillW, h);

                      Paint glow = new Paint(Paint.ANTI_ALIAS_FLAG);
                      glow.setColor(withAlpha(accent2, 110));
                      glow.setMaskFilter(new BlurMaskFilter(h * 0.7f, BlurMaskFilter.Blur.NORMAL));
                      canvas.drawRoundRect(fillRect, r, r, glow);

                      Paint fill = new Paint(Paint.ANTI_ALIAS_FLAG);
                      fill.setShader(new LinearGradient(0, 0, fillW, 0,
                          new int[]{ accent, accent2 }, null, Shader.TileMode.CLAMP));
                      canvas.drawRoundRect(fillRect, r, r, fill);

                      Paint sheen = new Paint(Paint.ANTI_ALIAS_FLAG);
                      sheen.setShader(new LinearGradient(0, 0, 0, h,
                          new int[]{ withAlpha(Color.WHITE, 100), withAlpha(Color.WHITE, 0) },
                          new float[]{ 0f, 1f }, Shader.TileMode.CLAMP));
                      canvas.save();
                      canvas.clipRect(0, 0, fillW, h * 0.55f);
                      canvas.drawRoundRect(fillRect, r, r, sheen);
                      canvas.restore();
                  }
                  return bmp;
              }

              // Per-row check "medallion": a glowing gradient jewel when done, a light outline ring
              // when pending -- drawn twice per data refresh (see ChecklistRemoteViewsService) and
              // reused across every row of that state, so scrolling never re-runs the drawing code.
              static Bitmap checkMedallion(boolean done, int sizeDp, Context context, int accent, int accent2, int muted) {
                  float density = context.getResources().getDisplayMetrics().density;
                  int size = Math.max(1, (int) (sizeDp * density));
                  Bitmap bmp = Bitmap.createBitmap(size, size, Bitmap.Config.ARGB_8888);
                  Canvas canvas = new Canvas(bmp);
                  float cx = size / 2f, cy = size / 2f, r = size / 2f - size * 0.09f;

                  if (done) {
                      Paint glow = new Paint(Paint.ANTI_ALIAS_FLAG);
                      glow.setShader(new RadialGradient(cx, cy, size * 0.62f,
                          new int[]{ withAlpha(accent2, 120), withAlpha(accent2, 0) },
                          new float[]{ 0.5f, 1f }, Shader.TileMode.CLAMP));
                      canvas.drawCircle(cx, cy, size * 0.62f, glow);

                      Paint fill = new Paint(Paint.ANTI_ALIAS_FLAG);
                      fill.setShader(new RadialGradient(cx - r * 0.3f, cy - r * 0.3f, r * 1.4f,
                          new int[]{ lighten(accent2, 0.28f), accent, darken(accent, 0.12f) },
                          new float[]{ 0f, 0.55f, 1f }, Shader.TileMode.CLAMP));
                      canvas.drawCircle(cx, cy, r, fill);

                      Paint check = new Paint(Paint.ANTI_ALIAS_FLAG);
                      check.setStyle(Paint.Style.STROKE);
                      check.setStrokeWidth(size * 0.09f);
                      check.setStrokeCap(Paint.Cap.ROUND);
                      check.setStrokeJoin(Paint.Join.ROUND);
                      check.setColor(Color.WHITE);
                      Path path = new Path();
                      path.moveTo(cx - r * 0.5f, cy + r * 0.02f);
                      path.lineTo(cx - r * 0.12f, cy + r * 0.4f);
                      path.lineTo(cx + r * 0.55f, cy - r * 0.32f);
                      canvas.drawPath(path, check);
                  } else {
                      Paint ring = new Paint(Paint.ANTI_ALIAS_FLAG);
                      ring.setStyle(Paint.Style.STROKE);
                      ring.setStrokeWidth(size * 0.075f);
                      ring.setColor(withAlpha(muted, 190));
                      canvas.drawCircle(cx, cy, r, ring);
                  }
                  return bmp;
              }

              // کارتِ گرادیانتِ پرمیوم برایِ حالتِ bg="gradient": به‌جایِ یه شکلِ تخت با یه رنگ،
              // یه بیت‌مپِ واقعی با گرادیانتِ دوتُنِ accent→accent2، سیهنِ نوریِ بالا (همون تکنیکِ
              // progressBarBitmap) و یه خطِ باریکِ روشن دورِ لبه می‌کشه -- چون RemoteViews هیچ راهی
              // برایِ ست‌کردنِ یه GradientDrawable واقعی نداره (فقط setColorFilter تک‌رنگ رو
              // می‌شناسه)، تنها راهِ گرادیانتِ واقعی رو پیشِ‌رو، رندرِ دستیِ یه Bitmap ه.
              // اندازه‌ی بیت‌مپ دقیقاً از رویِ سایزِ فعلیِ خودِ ویجت (getAppWidgetOptions) گرفته
              // می‌شه -- نه یه سایزِ ثابتِ حدسی -- تا با کشیده‌شدنِ fitXY، گوشه‌های گردِ بیضی/کج
              // نشن.
              static Bitmap cardGradientBitmap(int widthDp, int heightDp, Context context,
                                                int accent, int accent2, float cornerRadiusDp) {
                  float density = context.getResources().getDisplayMetrics().density;
                  int w = Math.max(1, (int) (widthDp * density));
                  int h = Math.max(1, (int) (heightDp * density));
                  float r = Math.min(cornerRadiusDp * density, Math.min(w, h) / 2f);
                  Bitmap bmp = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888);
                  Canvas canvas = new Canvas(bmp);
                  RectF rect = new RectF(0, 0, w, h);

                  Paint fill = new Paint(Paint.ANTI_ALIAS_FLAG);
                  fill.setShader(new LinearGradient(0, 0, w, h, accent, accent2, Shader.TileMode.CLAMP));
                  canvas.drawRoundRect(rect, r, r, fill);

                  Paint sheen = new Paint(Paint.ANTI_ALIAS_FLAG);
                  sheen.setShader(new LinearGradient(0, 0, 0, h * 0.55f,
                      new int[]{ withAlpha(Color.WHITE, 70), withAlpha(Color.WHITE, 0) },
                      new float[]{ 0f, 1f }, Shader.TileMode.CLAMP));
                  canvas.save();
                  canvas.clipRect(0, 0, w, h * 0.55f);
                  canvas.drawRoundRect(rect, r, r, sheen);
                  canvas.restore();

                  Paint edge = new Paint(Paint.ANTI_ALIAS_FLAG);
                  edge.setStyle(Paint.Style.STROKE);
                  edge.setStrokeWidth(density * 1f);
                  edge.setColor(withAlpha(Color.WHITE, 90));
                  canvas.drawRoundRect(new RectF(1, 1, w - 1, h - 1), r, r, edge);

                  return bmp;
              }

              private static void updateOne(Context context, AppWidgetManager mgr, int widgetId) {
                  SharedPreferences prefs = context.getSharedPreferences(TaskWidgetPlugin.PREFS_NAME, Context.MODE_PRIVATE);
                  RemoteViews views = new RemoteViews(context.getPackageName(), R.layout.widget_checklist);
                  WidgetStyle st = WidgetStyle.resolve(context, widgetId);

                  // bg="gradient" paints an accent->accent2 bitmap behind everything below, so the
                  // theme's normal card-oriented text/muted colors (chosen to read on st.card) can't
                  // be trusted here -- swap in contrast-checked ones (see gradientTextColors).
                  int effText = st.text, effMuted = st.muted;
                  if ("gradient".equals(st.bg)) {
                      int[] gtc = WidgetStyle.gradientTextColors(st.accent, st.accent2);
                      effText = gtc[0];
                      effMuted = gtc[1];
                  }

                  if ("transparent".equals(st.bg)) {
                      views.setViewVisibility(R.id.cardShadow, View.GONE);
                      views.setViewVisibility(R.id.cardBg, View.GONE);
                  } else if ("outline".equals(st.bg)) {
                      // مینیمالِ پرمیوم: بدونِ پرِ رنگ، فقط یه حاشیه‌ی رنگیِ تمیز -- سایه هم لازم
                      // نداره چون داخلش شفافه، سایه‌ی زیرِ یه چیزِ شفاف عجیب می‌شد.
                      int outlineRes = "pill".equals(st.shape) ? R.drawable.widget_card_outline_pill
                                     : "sharp".equals(st.shape) ? R.drawable.widget_card_outline_sharp
                                     : R.drawable.widget_card_outline;
                      views.setViewVisibility(R.id.cardShadow, View.GONE);
                      views.setViewVisibility(R.id.cardBg, View.VISIBLE);
                      views.setImageViewResource(R.id.cardBg, outlineRes);
                      views.setInt(R.id.cardBg, "setColorFilter", st.accent);
                      views.setInt(R.id.cardBg, "setImageAlpha", 255);
                  } else if ("gradient".equals(st.bg)) {
                      // گرادیانتِ واقعیِ دوتُن -- تنها حالتی که به‌جایِ یه شکلِ XML رنگ‌شده، یه
                      // Bitmap واقعی رندر می‌شه (توضیح کامل بالایِ cardGradientBitmap).
                      float cornerRadiusDp = "pill".equals(st.shape) ? 999f : "sharp".equals(st.shape) ? 4f : 24f;
                      Bundle sizeOpts = mgr.getAppWidgetOptions(widgetId);
                      int wDp = Math.max(120, sizeOpts.getInt(AppWidgetManager.OPTION_APPWIDGET_MIN_WIDTH, 250));
                      int hDp = Math.max(90, sizeOpts.getInt(AppWidgetManager.OPTION_APPWIDGET_MIN_HEIGHT, 180));
                      int shadowRes = "pill".equals(st.shape) ? R.drawable.widget_card_shadow_pill
                                    : "sharp".equals(st.shape) ? R.drawable.widget_card_shadow_sharp
                                    : R.drawable.widget_card_shadow;
                      views.setViewVisibility(R.id.cardShadow, View.VISIBLE);
                      views.setViewVisibility(R.id.cardBg, View.VISIBLE);
                      views.setImageViewResource(R.id.cardShadow, shadowRes);
                      views.setInt(R.id.cardShadow, "setImageAlpha", 150);
                      views.setImageViewBitmap(R.id.cardBg, cardGradientBitmap(wDp, hDp, context, st.accent, st.accent2, cornerRadiusDp));
                      views.setInt(R.id.cardBg, "setImageAlpha", 255);
                  } else {
                      int shapeRes = "pill".equals(st.shape) ? R.drawable.widget_card_shape_pill
                                   : "sharp".equals(st.shape) ? R.drawable.widget_card_shape_sharp
                                   : R.drawable.widget_card_shape;
                      int shadowRes = "pill".equals(st.shape) ? R.drawable.widget_card_shadow_pill
                                    : "sharp".equals(st.shape) ? R.drawable.widget_card_shadow_sharp
                                    : R.drawable.widget_card_shadow;
                      views.setViewVisibility(R.id.cardShadow, View.VISIBLE);
                      views.setViewVisibility(R.id.cardBg, View.VISIBLE);
                      views.setImageViewResource(R.id.cardShadow, shadowRes);
                      views.setImageViewResource(R.id.cardBg, shapeRes);
                      views.setInt(R.id.cardBg, "setColorFilter", st.card);
                      boolean glass = "glass".equals(st.bg);
                      views.setInt(R.id.cardBg, "setImageAlpha", glass ? 165 : 255);
                      views.setInt(R.id.cardShadow, "setImageAlpha", glass ? 90 : 140);
                  }

                  // Decorative background pattern (dots/stripes/grid/waves), tinted with the
                  // secondary theme color at low alpha so it reads as a subtle texture rather
                  // than competing with the task text. Hidden entirely when the card itself is
                  // hidden (transparent bg) or when the user picked "none".
                  int patternRes = "transparent".equals(st.bg) ? 0 : WidgetStyle.patternDrawableRes(context, st.pattern);
                  if (patternRes != 0) {
                      views.setViewVisibility(R.id.cardPattern, View.VISIBLE);
                      views.setImageViewResource(R.id.cardPattern, patternRes);
                      views.setInt(R.id.cardPattern, "setColorFilter", st.accent2);
                      views.setInt(R.id.cardPattern, "setImageAlpha", 46);
                  } else {
                      views.setViewVisibility(R.id.cardPattern, View.GONE);
                  }

                  views.setInt(R.id.title, "setTextColor", effText);
                  views.setInt(R.id.emptyView, "setTextColor", effMuted);
                  views.setInt(R.id.emptyIcon, "setColorFilter", effMuted);
                  views.setInt(R.id.emptyIcon, "setImageAlpha", 140);

                  // Count today's progress purely for the header's "done/total" jewel badge and its
                  // gradient bar -- cosmetic only, the ListView below still owns the real task data.
                  int done = 0, total = 0;
                  try {
                      JSONArray countTasks = new JSONArray(prefs.getString(TaskWidgetPlugin.KEY_TASKS, "[]"));
                      total = countTasks.length();
                      for (int i = 0; i < total; i++) {
                          if (countTasks.getJSONObject(i).optBoolean("done", false)) done++;
                      }
                  } catch (Exception e) { /* keep done=0, total=0 -- badge/bar just hide below */ }

                  if (total > 0) {
                      float pct = Math.max(0f, Math.min(1f, done / (float) total));
                      views.setViewVisibility(R.id.progressBadgeWrap, View.VISIBLE);
                      views.setViewVisibility(R.id.progressBar, View.VISIBLE);
                      views.setTextViewText(R.id.progressBadgeText, done + "/" + total);
                      views.setInt(R.id.progressBadgeBg, "setColorFilter", st.accent);
                      views.setInt(R.id.progressBadgeBg, "setImageAlpha", 225);
                      int track = (effMuted & 0x00FFFFFF) | 0x33000000;
                      views.setImageViewBitmap(R.id.progressBar, progressBarBitmap(pct, 300, 7, context, st.accent, st.accent2, track));
                  } else {
                      views.setViewVisibility(R.id.progressBadgeWrap, View.GONE);
                      views.setViewVisibility(R.id.progressBar, View.GONE);
                  }

                  // Scrollable task list: the row views themselves are built on demand by
                  // ChecklistRemoteViewsFactory (one instance per widgetId), so any number of
                  // tasks can be scrolled through instead of being capped at a handful of rows.
                  Intent adapterIntent = new Intent(context, ChecklistRemoteViewsService.class);
                  adapterIntent.putExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, widgetId);
                  // Distinct data Uri so each widget instance's RemoteViews isn't treated as an
                  // identical/cached intent by the framework (a well-known RemoteViewsService gotcha).
                  adapterIntent.setData(android.net.Uri.parse("widget://checklist/" + widgetId));
                  views.setRemoteAdapter(R.id.checklistListView, adapterIntent);
                  views.setEmptyView(R.id.checklistListView, R.id.emptyViewWrap);

                  // One shared click template for every row; each row supplies its own task_id via
                  // a fill-in intent (RemoteViewsFactory#getViewAt). Requires FLAG_MUTABLE so the
                  // system is allowed to merge that fill-in intent's extras in at click time.
                  Intent toggleTemplate = new Intent(context, ChecklistWidgetProvider.class);
                  toggleTemplate.setAction(ACTION_TOGGLE);
                  PendingIntent togglePi = PendingIntent.getBroadcast(context, widgetId, toggleTemplate,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_MUTABLE);
                  views.setPendingIntentTemplate(R.id.checklistListView, togglePi);

                  mgr.updateAppWidget(widgetId, views);
                  mgr.notifyAppWidgetViewDataChanged(widgetId, R.id.checklistListView);
              }

              @Override
              public void onUpdate(Context context, AppWidgetManager mgr, int[] appWidgetIds) {
                  for (int id : appWidgetIds) updateOne(context, mgr, id);
              }

              @Override
              public void onReceive(Context context, Intent intent) {
                  super.onReceive(context, intent);
                  if (!ACTION_TOGGLE.equals(intent.getAction())) return;
                  int taskId = intent.getIntExtra("task_id", -1);
                  if (taskId < 0) return;

                  SharedPreferences prefs = context.getSharedPreferences(TaskWidgetPlugin.PREFS_NAME, Context.MODE_PRIVATE);
                  Set<String> pending = new HashSet<>(prefs.getStringSet(TaskWidgetPlugin.KEY_PENDING, new HashSet<String>()));
                  pending.add(String.valueOf(taskId));

                  try {
                      JSONArray tasks = new JSONArray(prefs.getString(TaskWidgetPlugin.KEY_TASKS, "[]"));
                      for (int i = 0; i < tasks.length(); i++) {
                          JSONObject t = tasks.getJSONObject(i);
                          if (t.optInt("id", i) == taskId) {
                              t.put("done", !t.optBoolean("done", false));
                          }
                      }
                      prefs.edit()
                          .putStringSet(TaskWidgetPlugin.KEY_PENDING, pending)
                          .putString(TaskWidgetPlugin.KEY_TASKS, tasks.toString())
                          .apply();
                  } catch (Exception e) {
                      prefs.edit().putStringSet(TaskWidgetPlugin.KEY_PENDING, pending).apply();
                  }

                  refreshAll(context);
              }
          }
          JAVAEOF

          # ---- ChecklistRemoteViewsService.java (powers the scrollable task list — builds one
          #      row per task on demand instead of a fixed handful of rows, so the list can hold
          #      any number of tasks and be swiped through) ----
          cat > "$WIDGET_DIR/ChecklistRemoteViewsService.java" <<JAVAEOF
          package ${APP_ID}.widget;

          import ${APP_ID}.R;
          import android.appwidget.AppWidgetManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Bitmap;
          import android.graphics.Paint;
          import android.widget.RemoteViews;
          import android.widget.RemoteViewsService;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class ChecklistRemoteViewsService extends RemoteViewsService {
              @Override
              public RemoteViewsFactory onGetViewFactory(Intent intent) {
                  return new Factory(getApplicationContext(), intent);
              }

              private static class Factory implements RemoteViewsFactory {
                  private final Context context;
                  private final int widgetId;
                  private JSONArray tasks = new JSONArray();
                  private WidgetStyle style;
                  private int rowTextColor;
                  private Bitmap doneMedallion;
                  private Bitmap pendingMedallion;

                  Factory(Context context, Intent intent) {
                      this.context = context;
                      this.widgetId = intent.getIntExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, AppWidgetManager.INVALID_APPWIDGET_ID);
                  }

                  @Override
                  public void onCreate() { reload(); }

                  @Override
                  public void onDataSetChanged() { reload(); }

                  private void reload() {
                      style = WidgetStyle.resolve(context, widgetId);
                      // Same reasoning as ChecklistWidgetProvider.updateOne: row text sits on top of
                      // the accent->accent2 gradient bitmap in bg="gradient" mode, so it needs the
                      // contrast-checked color, not the theme's card-oriented style.text.
                      rowTextColor = "gradient".equals(style.bg)
                              ? WidgetStyle.gradientTextColors(style.accent, style.accent2)[0]
                              : style.text;
                      SharedPreferences prefs = context.getSharedPreferences(TaskWidgetPlugin.PREFS_NAME, Context.MODE_PRIVATE);
                      try {
                          tasks = new JSONArray(prefs.getString(TaskWidgetPlugin.KEY_TASKS, "[]"));
                      } catch (Exception e) {
                          tasks = new JSONArray();
                      }
                      // Both check-medallion states are drawn once per data refresh and reused for
                      // every row below, so scrolling through a long list never re-runs the
                      // gradient/glow drawing code -- it just stamps one of two cached bitmaps.
                      doneMedallion = ChecklistWidgetProvider.checkMedallion(true, 22, context, style.accent, style.accent2, style.muted);
                      pendingMedallion = ChecklistWidgetProvider.checkMedallion(false, 22, context, style.accent, style.accent2, style.muted);
                  }

                  @Override
                  public void onDestroy() { tasks = new JSONArray(); }

                  @Override
                  public int getCount() { return tasks.length(); }

                  @Override
                  public RemoteViews getViewAt(int position) {
                      RemoteViews item = new RemoteViews(context.getPackageName(), R.layout.widget_checklist_item);
                      try {
                          JSONObject t = tasks.getJSONObject(position);
                          int taskId = t.optInt("id", position);
                          boolean done = t.optBoolean("done", false);

                          item.setTextViewText(R.id.itemLabel, t.optString("label"));
                          item.setInt(R.id.itemLabel, "setTextColor", rowTextColor);
                          // Strikethrough + soft fade for completed tasks; crisp full color for pending.
                          item.setInt(R.id.itemLabel, "setPaintFlags",
                              done ? (Paint.ANTI_ALIAS_FLAG | Paint.STRIKE_THRU_TEXT_FLAG) : Paint.ANTI_ALIAS_FLAG);
                          item.setFloat(R.id.itemRow, "setAlpha", done ? 0.55f : 1f);

                          item.setImageViewBitmap(R.id.itemCheck, done ? doneMedallion : pendingMedallion);

                          // Soft accent-tinted capsule glow behind completed rows only; alpha 0 keeps
                          // it fully invisible behind pending rows without a visibility toggle.
                          item.setInt(R.id.itemHighlight, "setColorFilter", style.accent);
                          item.setInt(R.id.itemHighlight, "setImageAlpha", done ? 34 : 0);

                          // Only the task_id differs row to row — merged into the provider's shared
                          // PendingIntentTemplate at click time.
                          Intent fillIn = new Intent();
                          fillIn.putExtra("task_id", taskId);
                          item.setOnClickFillInIntent(R.id.itemRow, fillIn);
                      } catch (Exception e) {
                          // leave a blank row rather than crash the whole list
                      }
                      return item;
                  }

                  @Override
                  public RemoteViews getLoadingView() { return null; }

                  @Override
                  public int getViewTypeCount() { return 1; }

                  @Override
                  public long getItemId(int position) { return position; }

                  @Override
                  public boolean hasStableIds() { return true; }
              }
          }
          JAVAEOF

          # ---- DayProgressWidgetProvider.java ----
          cat > "$WIDGET_DIR/DayProgressWidgetProvider.java" <<JAVAEOF
          package ${APP_ID}.widget;

          import ${APP_ID}.R;
          import android.app.AlarmManager;
          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Bitmap;
          import android.graphics.BlurMaskFilter;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.RadialGradient;
          import android.graphics.RectF;
          import android.graphics.Shader;
          import android.graphics.SweepGradient;
          import android.view.View;
          import android.widget.RemoteViews;
          import java.util.Calendar;

          public class DayProgressWidgetProvider extends AppWidgetProvider {

              public static final String ACTION_TICK = "${APP_ID}.ACTION_WIDGET_TICK";

              public static void refreshAll(Context context) {
                  AppWidgetManager mgr = AppWidgetManager.getInstance(context);
                  int[] ids = mgr.getAppWidgetIds(new ComponentName(context, DayProgressWidgetProvider.class));
                  for (int id : ids) updateOne(context, mgr, id);
              }

              public static void refreshOne(Context context, int widgetId) {
                  updateOne(context, AppWidgetManager.getInstance(context), widgetId);
              }

              // Android batches/limits how often a widget can auto-refresh in the background (there's
              // no way to get a true once-a-second tick without a foreground service and heavy battery
              // cost) — this inexact repeating alarm gives a ~15 min cadence by default, which is 96
              // steps across the day and reads as smooth motion on a ring this size. If the user turns
              // on the live minute display (opt-in, see WidgetConfigActivity), we switch to a ~1 min
              // cadence just for that — that's the extra battery cost the config screen warns about,
              // so it only applies while at least one placed widget actually asked for it.
              private static PendingIntent tickIntent(Context context) {
                  Intent intent = new Intent(context, DayProgressWidgetProvider.class);
                  intent.setAction(ACTION_TICK);
                  return PendingIntent.getBroadcast(context, 0, intent,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              }

              private static boolean anyWidgetWantsMinuteTick(Context context) {
                  try {
                      AppWidgetManager mgr = AppWidgetManager.getInstance(context);
                      int[] ids = mgr.getAppWidgetIds(new ComponentName(context, DayProgressWidgetProvider.class));
                      SharedPreferences prefs = context.getSharedPreferences(TaskWidgetPlugin.PREFS_NAME, Context.MODE_PRIVATE);
                      for (int id : ids) {
                          if (prefs.getBoolean(WidgetStyle.prefKey(id, "showMinute"), false)) return true;
                      }
                  } catch (Exception e) { /* best-effort — falls back to the cheaper cadence */ }
                  return false;
              }

              private static void scheduleTick(Context context) {
                  try {
                      AlarmManager am = (AlarmManager) context.getSystemService(Context.ALARM_SERVICE);
                      if (am != null) {
                          long interval = anyWidgetWantsMinuteTick(context) ? 60_000L : AlarmManager.INTERVAL_FIFTEEN_MINUTES;
                          am.setInexactRepeating(AlarmManager.RTC, System.currentTimeMillis(),
                                  interval, tickIntent(context));
                      }
                  } catch (Exception e) { /* best-effort */ }
              }

              // Called from WidgetConfigActivity right after the user toggles "نمایش دقیقه" so the
              // tick cadence changes immediately instead of waiting for the next onUpdate cycle.
              static void rescheduleTick(Context context) {
                  cancelTick(context);
                  scheduleTick(context);
              }

              private static void cancelTick(Context context) {
                  try {
                      AlarmManager am = (AlarmManager) context.getSystemService(Context.ALARM_SERVICE);
                      if (am != null) am.cancel(tickIntent(context));
                  } catch (Exception e) { /* best-effort */ }
              }

              @Override
              public void onEnabled(Context context) { scheduleTick(context); }

              @Override
              public void onDisabled(Context context) { cancelTick(context); }

              @Override
              public void onUpdate(Context context, AppWidgetManager mgr, int[] appWidgetIds) {
                  scheduleTick(context); // safety net: re-arms the alarm in case it was lost (e.g. reboot)
                  for (int id : appWidgetIds) updateOne(context, mgr, id);
              }

              @Override
              public void onReceive(Context context, Intent intent) {
                  super.onReceive(context, intent);
                  if (ACTION_TICK.equals(intent.getAction())) {
                      refreshAll(context);
                  }
              }

              // Small color-math helpers used only by dialBitmap() below.
              private static int withAlpha(int color, int alpha) {
                  return (color & 0x00FFFFFF) | (alpha << 24);
              }
              private static int lighten(int color, float factor) {
                  int a = Color.alpha(color);
                  int r = Math.min(255, (int) (Color.red(color) + (255 - Color.red(color)) * factor));
                  int g = Math.min(255, (int) (Color.green(color) + (255 - Color.green(color)) * factor));
                  int b = Math.min(255, (int) (Color.blue(color) + (255 - Color.blue(color)) * factor));
                  return Color.argb(a, r, g, b);
              }
              private static int darken(int color, float factor) {
                  int a = Color.alpha(color);
                  int r = (int) (Color.red(color) * (1 - factor));
                  int g = (int) (Color.green(color) * (1 - factor));
                  int b = (int) (Color.blue(color) * (1 - factor));
                  return Color.argb(a, r, g, b);
              }

              // Renders the whole widget face as one bitmap — a premium circular gauge/medallion
              // instead of a flat ring: ambient colored glow, an embossed metal bezel + dial face
              // (skipped in "transparent" bg mode so the ring floats directly on the wallpaper),
              // twelve chronograph-style tick marks, a grooved track, a rich multi-stop gradient
              // progress arc with its own soft glow underneath, a bright jewel-like tip marker at
              // the current progress point, and a soft glass sheen across the upper dome.
              static Bitmap dialBitmap(float pct, int sizeDp, Context context, int accent, int accent2,
                                                int trackColor, float strokeFactor, String bgMode, int faceColor) {
                  float density = context.getResources().getDisplayMetrics().density;
                  int size = Math.max(1, (int) (sizeDp * density));
                  Bitmap bmp = Bitmap.createBitmap(size, size, Bitmap.Config.ARGB_8888);
                  Canvas canvas = new Canvas(bmp);
                  float cx = size / 2f, cy = size / 2f;
                  boolean transparent = "transparent".equals(bgMode);
                  boolean glass = "glass".equals(bgMode);

                  float stroke = size * strokeFactor;
                  float ringR = size / 2f - size * 0.16f;
                  RectF ringRect = new RectF(cx - ringR, cy - ringR, cx + ringR, cy + ringR);

                  // ---- Layer 1: ambient outer glow, colored with the accent — reads as a soft
                  // halo even in transparent mode, so the widget still feels "lit" on any wallpaper.
                  Paint glowBg = new Paint(Paint.ANTI_ALIAS_FLAG);
                  glowBg.setShader(new RadialGradient(cx, cy, size * 0.5f,
                      new int[]{ withAlpha(accent2, 90), withAlpha(accent2, 0) },
                      new float[]{ 0.55f, 1f }, Shader.TileMode.CLAMP));
                  canvas.drawCircle(cx, cy, size * 0.5f, glowBg);

                  // ---- Layer 2: dial face + embossed metal bezel (opaque/glass modes only) ----
                  if (!transparent) {
                      float faceR = size / 2f - size * 0.05f;
                      Paint face = new Paint(Paint.ANTI_ALIAS_FLAG);
                      int faceCenter = lighten(faceColor, 0.10f);
                      int faceEdge = darken(faceColor, glass ? 0.22f : 0.10f);
                      face.setShader(new RadialGradient(cx, cy - faceR * 0.15f, faceR * 1.15f,
                          new int[]{ faceCenter, faceEdge },
                          new float[]{ 0f, 1f }, Shader.TileMode.CLAMP));
                      face.setAlpha(glass ? 190 : 255);
                      canvas.drawCircle(cx, cy, faceR, face);

                      Paint bezelOuter = new Paint(Paint.ANTI_ALIAS_FLAG);
                      bezelOuter.setStyle(Paint.Style.STROKE);
                      bezelOuter.setStrokeWidth(size * 0.012f);
                      bezelOuter.setColor(withAlpha(darken(faceColor, 0.35f), 140));
                      canvas.drawCircle(cx, cy, faceR - size * 0.006f, bezelOuter);

                      Paint bezelInner = new Paint(Paint.ANTI_ALIAS_FLAG);
                      bezelInner.setStyle(Paint.Style.STROKE);
                      bezelInner.setStrokeWidth(size * 0.008f);
                      bezelInner.setColor(withAlpha(Color.WHITE, 60));
                      canvas.drawCircle(cx, cy, faceR - size * 0.024f, bezelInner);
                  }

                  // ---- Layer 3: twelve chronograph tick marks, heavier every 90° ----
                  float tickOuter = ringR + stroke * 0.62f;
                  for (int i = 0; i < 12; i++) {
                      boolean major = i % 3 == 0;
                      float tickLen = major ? size * 0.045f : size * 0.025f;
                      Paint tickPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                      tickPaint.setStrokeWidth(major ? size * 0.014f : size * 0.008f);
                      tickPaint.setColor(withAlpha(trackColor, major ? 150 : 90));
                      tickPaint.setStrokeCap(Paint.Cap.ROUND);
                      canvas.save();
                      canvas.rotate(i * 30f, cx, cy);
                      canvas.drawLine(cx, cy - tickOuter, cx, cy - tickOuter + tickLen, tickPaint);
                      canvas.restore();
                  }

                  // ---- Layer 4: grooved track (dark under-stroke + lighter top stroke = inset feel) ----
                  Paint grooveShadow = new Paint(Paint.ANTI_ALIAS_FLAG);
                  grooveShadow.setStyle(Paint.Style.STROKE);
                  grooveShadow.setStrokeWidth(stroke + size * 0.01f);
                  grooveShadow.setColor(withAlpha(Color.BLACK, 45));
                  canvas.drawArc(ringRect, 0f, 360f, false, grooveShadow);

                  Paint track = new Paint(Paint.ANTI_ALIAS_FLAG);
                  track.setStyle(Paint.Style.STROKE);
                  track.setStrokeWidth(stroke);
                  track.setColor(trackColor);
                  track.setStrokeCap(Paint.Cap.ROUND);
                  canvas.drawArc(ringRect, 0f, 360f, false, track);

                  // ---- Layer 5: soft blurred glow directly under the progress arc (neon feel) ----
                  Paint glowArc = new Paint(Paint.ANTI_ALIAS_FLAG);
                  glowArc.setStyle(Paint.Style.STROKE);
                  glowArc.setStrokeWidth(stroke * 1.9f);
                  glowArc.setStrokeCap(Paint.Cap.ROUND);
                  glowArc.setColor(withAlpha(accent, 130));
                  glowArc.setMaskFilter(new BlurMaskFilter(stroke * 0.9f, BlurMaskFilter.Blur.NORMAL));
                  canvas.drawArc(ringRect, -90f, 360f * pct, false, glowArc);

                  // ---- Layer 6: the crisp progress arc — rich 5-stop gradient with a bright core ----
                  Paint fg = new Paint(Paint.ANTI_ALIAS_FLAG);
                  fg.setStyle(Paint.Style.STROKE);
                  fg.setStrokeWidth(stroke);
                  fg.setStrokeCap(Paint.Cap.ROUND);
                  int coreHighlight = lighten(accent2, 0.55f);
                  SweepGradient gradient = new SweepGradient(cx, cy,
                      new int[]{ accent, accent2, coreHighlight, accent2, accent },
                      new float[]{ 0f, 0.4f, 0.72f, 0.86f, 1f });
                  fg.setShader(gradient);
                  canvas.drawArc(ringRect, -90f, 360f * pct, false, fg);

                  // ---- Layer 7: soft glass sheen across the upper dome ----
                  if (!transparent) {
                      Paint sheen = new Paint(Paint.ANTI_ALIAS_FLAG);
                      sheen.setShader(new RadialGradient(cx, cy - size * 0.22f, size * 0.42f,
                          new int[]{ withAlpha(Color.WHITE, 70), withAlpha(Color.WHITE, 0) },
                          new float[]{ 0f, 1f }, Shader.TileMode.CLAMP));
                      canvas.save();
                      canvas.clipRect(0, 0, size, size * 0.5f);
                      canvas.drawCircle(cx, cy, size / 2f - size * 0.05f, sheen);
                      canvas.restore();
                  }

                  // ---- Layer 8: bright jewel-like marker exactly at the current progress point ----
                  if (pct > 0.01f) {
                      double angleRad = Math.toRadians(-90 + 360 * pct);
                      float tipX = (float) (cx + ringR * Math.cos(angleRad));
                      float tipY = (float) (cy + ringR * Math.sin(angleRad));

                      Paint tipGlow = new Paint(Paint.ANTI_ALIAS_FLAG);
                      tipGlow.setShader(new RadialGradient(tipX, tipY, stroke * 1.6f,
                          new int[]{ withAlpha(Color.WHITE, 200), withAlpha(accent2, 0) },
                          new float[]{ 0f, 1f }, Shader.TileMode.CLAMP));
                      canvas.drawCircle(tipX, tipY, stroke * 1.6f, tipGlow);

                      Paint tipDot = new Paint(Paint.ANTI_ALIAS_FLAG);
                      tipDot.setColor(Color.WHITE);
                      canvas.drawCircle(tipX, tipY, stroke * 0.34f, tipDot);

                      Paint tipRing = new Paint(Paint.ANTI_ALIAS_FLAG);
                      tipRing.setStyle(Paint.Style.STROKE);
                      tipRing.setStrokeWidth(stroke * 0.12f);
                      tipRing.setColor(accent2);
                      canvas.drawCircle(tipX, tipY, stroke * 0.34f, tipRing);
                  }

                  return bmp;
              }

              private static void updateOne(Context context, AppWidgetManager mgr, int widgetId) {
                  SharedPreferences prefs = context.getSharedPreferences(TaskWidgetPlugin.PREFS_NAME, Context.MODE_PRIVATE);
                  int day = prefs.getInt(TaskWidgetPlugin.KEY_DAY, 0);
                  WidgetStyle st = WidgetStyle.resolve(context, widgetId);

                  Calendar now = Calendar.getInstance();
                  int minutesSinceMidnight = now.get(Calendar.HOUR_OF_DAY) * 60 + now.get(Calendar.MINUTE);
                  float pct = Math.max(0f, Math.min(1f, minutesSinceMidnight / 1440f));
                  float strokeFactor = "thin".equals(st.thickness) ? 0.06f : "thick".equals(st.thickness) ? 0.13f : 0.09f;

                  RemoteViews views = new RemoteViews(context.getPackageName(), R.layout.widget_day_progress);

                  // The whole face (glow, bezel, dial, ring, tick marks, sheen) is now baked into
                  // one bitmap by dialBitmap() below, so the old flat card/shadow/pattern layers
                  // are no longer used for this widget — they stay GONE unconditionally.
                  views.setViewVisibility(R.id.cardShadow, View.GONE);
                  views.setViewVisibility(R.id.cardBg, View.GONE);
                  views.setViewVisibility(R.id.cardPattern, View.GONE);

                  int track = (st.muted & 0x00FFFFFF) | 0x40000000;
                  views.setImageViewBitmap(R.id.ring, dialBitmap(pct, 128, context, st.accent, st.accent2, track, strokeFactor, st.bg, st.card));
                  views.setTextViewText(R.id.dayCaptionLabel, "روز");
                  views.setInt(R.id.dayCaptionLabel, "setTextColor", st.muted);
                  views.setTextViewText(R.id.dayNumberLabel, String.valueOf(day));
                  views.setInt(R.id.dayNumberLabel, "setTextColor", st.text);

                  if (st.showHour || st.showMinute) {
                      String clockText;
                      if (st.showHour && st.showMinute) {
                          clockText = String.format(java.util.Locale.US, "%02d:%02d", now.get(Calendar.HOUR_OF_DAY), now.get(Calendar.MINUTE));
                      } else if (st.showHour) {
                          clockText = String.format(java.util.Locale.US, "%02d", now.get(Calendar.HOUR_OF_DAY));
                      } else {
                          clockText = String.format(java.util.Locale.US, "%02d", now.get(Calendar.MINUTE));
                      }
                      views.setViewVisibility(R.id.clockLabelWrap, View.VISIBLE);
                      views.setTextViewText(R.id.clockLabel, clockText);
                      if ("capsule".equals(st.clockStyle)) {
                          // Small tinted pill behind the text, same recolor trick as cardBg.
                          views.setViewVisibility(R.id.clockBadgeBg, View.VISIBLE);
                          views.setInt(R.id.clockBadgeBg, "setColorFilter", st.accent);
                          views.setInt(R.id.clockBadgeBg, "setImageAlpha", 210);
                          views.setInt(R.id.clockLabel, "setTextColor", Color.WHITE);
                          views.setFloat(R.id.clockLabel, "setLetterSpacing", 0f);
                          views.setFloat(R.id.clockLabel, "setTextSize", 9f);
                      } else if ("digital".equals(st.clockStyle)) {
                          // Letter-spaced + accent-colored, for a spaced-out "LED display" feel.
                          views.setViewVisibility(R.id.clockBadgeBg, View.GONE);
                          views.setInt(R.id.clockLabel, "setTextColor", st.accent);
                          views.setFloat(R.id.clockLabel, "setLetterSpacing", 0.18f);
                          views.setFloat(R.id.clockLabel, "setTextSize", 9.5f);
                      } else {
                          // "simple" (default): small and muted, no decoration.
                          views.setViewVisibility(R.id.clockBadgeBg, View.GONE);
                          views.setInt(R.id.clockLabel, "setTextColor", st.muted);
                          views.setFloat(R.id.clockLabel, "setLetterSpacing", 0f);
                          views.setFloat(R.id.clockLabel, "setTextSize", 9f);
                      }
                  } else {
                      views.setViewVisibility(R.id.clockLabelWrap, View.GONE);
                  }

                  mgr.updateAppWidget(widgetId, views);
              }
          }
          JAVAEOF

          # ---- QuoteWidgetProvider.java (daily quote widget -- see QuoteCatalog for
          #      the quote pool and todayIndex() below for how one is picked per day) ----
          cat > "$WIDGET_DIR/QuoteWidgetProvider.java" <<JAVAEOF
          package ${APP_ID}.widget;

          import ${APP_ID}.R;
          import android.app.AlarmManager;
          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Bundle;
          import android.view.View;
          import android.widget.RemoteViews;
          import java.util.Calendar;

          /** Home-screen "quote of the day" widget: shows one real, attributed quote from
           *  QuoteCatalog, the same one all day, deterministically picked from the calendar date
           *  (see todayIndex) so it doesn't depend on when the widget last happened to refresh.
           *  A single exact alarm fires right after midnight to swap in the next day's quote; every
           *  onUpdate also recomputes it as a safety net (covers reboots / missed alarms / a widget
           *  freshly dropped on the home screen). No configure activity -- it simply follows
           *  whatever look WidgetStyle.resolve() resolves to (defaults to the app's live theme),
           *  same as a checklist/day-progress widget instance that was never customized. */
          public class QuoteWidgetProvider extends AppWidgetProvider {

              public static final String ACTION_QUOTE_TICK = "${APP_ID}.ACTION_QUOTE_TICK";
              // Fired when the user taps the widget card -- swaps in a different random quote
              // from the pool (distinct from the one currently shown), same behavior as the
              // in-app "Library" quote-of-the-day card. The override only lasts for the rest of
              // the calendar day: once the stored epoch day no longer matches "today" (checked in
              // currentIndex()), it's ignored and the widget falls back to the deterministic
              // daily quote again -- no separate reset logic needed at midnight.
              public static final String ACTION_QUOTE_NEXT = "${APP_ID}.ACTION_QUOTE_NEXT";

              public static void refreshAll(Context context) {
                  AppWidgetManager mgr = AppWidgetManager.getInstance(context);
                  int[] ids = mgr.getAppWidgetIds(new ComponentName(context, QuoteWidgetProvider.class));
                  for (int id : ids) updateOne(context, mgr, id);
              }

              public static void refreshOne(Context context, int widgetId) {
                  updateOne(context, AppWidgetManager.getInstance(context), widgetId);
              }

              private static PendingIntent tickIntent(Context context) {
                  Intent intent = new Intent(context, QuoteWidgetProvider.class);
                  intent.setAction(ACTION_QUOTE_TICK);
                  return PendingIntent.getBroadcast(context, 0, intent,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              }

              // requestCode is the widgetId itself so every widget instance gets its own distinct
              // PendingIntent (otherwise FLAG_UPDATE_CURRENT would make separate instances share
              // one extra bundle and stomp on each other's widgetId).
              private static PendingIntent nextIntent(Context context, int widgetId) {
                  Intent intent = new Intent(context, QuoteWidgetProvider.class);
                  intent.setAction(ACTION_QUOTE_NEXT);
                  intent.putExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, widgetId);
                  return PendingIntent.getBroadcast(context, widgetId, intent,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              }

              /** Schedules one exact alarm for the next local midnight -- cheap (fires once a day,
               *  not on a repeating cadence like the day-progress ring) and precise, using the same
               *  SCHEDULE_EXACT_ALARM permission this app already requests for local notifications. */
              private static void scheduleMidnightAlarm(Context context) {
                  try {
                      AlarmManager am = (AlarmManager) context.getSystemService(Context.ALARM_SERVICE);
                      if (am == null) return;
                      Calendar next = Calendar.getInstance();
                      next.add(Calendar.DAY_OF_YEAR, 1);
                      next.set(Calendar.HOUR_OF_DAY, 0);
                      next.set(Calendar.MINUTE, 0);
                      next.set(Calendar.SECOND, 5);
                      next.set(Calendar.MILLISECOND, 0);
                      am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, next.getTimeInMillis(), tickIntent(context));
                  } catch (Exception e) { /* best-effort */ }
              }

              private static void cancelMidnightAlarm(Context context) {
                  try {
                      AlarmManager am = (AlarmManager) context.getSystemService(Context.ALARM_SERVICE);
                      if (am != null) am.cancel(tickIntent(context));
                  } catch (Exception e) { /* best-effort */ }
              }

              @Override
              public void onEnabled(Context context) { scheduleMidnightAlarm(context); }

              @Override
              public void onDisabled(Context context) { cancelMidnightAlarm(context); }

              @Override
              public void onUpdate(Context context, AppWidgetManager mgr, int[] appWidgetIds) {
                  scheduleMidnightAlarm(context); // safety net: re-arms the alarm in case it was lost (e.g. reboot)
                  for (int id : appWidgetIds) updateOne(context, mgr, id);
              }

              @Override
              public void onReceive(Context context, Intent intent) {
                  super.onReceive(context, intent);
                  if (ACTION_QUOTE_TICK.equals(intent.getAction())) {
                      refreshAll(context);
                      scheduleMidnightAlarm(context); // reschedule for the following midnight
                  } else if (ACTION_QUOTE_NEXT.equals(intent.getAction())) {
                      int widgetId = intent.getIntExtra(AppWidgetManager.EXTRA_APPWIDGET_ID,
                              AppWidgetManager.INVALID_APPWIDGET_ID);
                      if (widgetId != AppWidgetManager.INVALID_APPWIDGET_ID) {
                          rollOverrideIndex(context, widgetId);
                          refreshOne(context, widgetId);
                      }
                  }
              }

              /** Deterministic per-day index: two devices (or the same device on two different days)
               *  land on the same entry for the same calendar date, and it naturally cycles back
               *  through the pool once every QuoteCatalog.QUOTES.length days. */
              private static int todayIndex() {
                  Calendar cal = Calendar.getInstance();
                  int epochDay = cal.get(Calendar.YEAR) * 366 + cal.get(Calendar.DAY_OF_YEAR);
                  int n = QuoteCatalog.QUOTES.length;
                  return ((epochDay % n) + n) % n;
              }

              private static int currentEpochDay() {
                  Calendar cal = Calendar.getInstance();
                  return cal.get(Calendar.YEAR) * 366 + cal.get(Calendar.DAY_OF_YEAR);
              }

              /** Picks a fresh random quote (never the one currently on screen) and stores it as
               *  today's override, so tapping the widget again keeps cycling instead of undoing
               *  itself. Stored per-widget-instance (multiple widgets can each be on a different
               *  quote) and tagged with today's epoch day so currentIndex() below stops honoring it
               *  once the calendar day rolls over -- at that point it's simply stale data that's
               *  never read again, not something that needs an explicit clear. */
              private static void rollOverrideIndex(Context context, int widgetId) {
                  SharedPreferences prefs = context.getSharedPreferences(TaskWidgetPlugin.PREFS_NAME, Context.MODE_PRIVATE);
                  int n = QuoteCatalog.QUOTES.length;
                  if (n < 2) return;
                  int current = currentIndex(context, widgetId);
                  int next = current;
                  while (next == current) next = (int) (Math.random() * n);
                  prefs.edit()
                          .putInt("quoteOverrideIdx_" + widgetId, next)
                          .putInt("quoteOverrideDay_" + widgetId, currentEpochDay())
                          .apply();
              }

              /** The index actually shown: today's tap-driven override if there is one, otherwise
               *  the deterministic daily quote. */
              private static int currentIndex(Context context, int widgetId) {
                  SharedPreferences prefs = context.getSharedPreferences(TaskWidgetPlugin.PREFS_NAME, Context.MODE_PRIVATE);
                  int storedDay = prefs.getInt("quoteOverrideDay_" + widgetId, -1);
                  if (storedDay == currentEpochDay()) {
                      return prefs.getInt("quoteOverrideIdx_" + widgetId, todayIndex());
                  }
                  return todayIndex();
              }

              private static void updateOne(Context context, AppWidgetManager mgr, int widgetId) {
                  WidgetStyle st = WidgetStyle.resolve(context, widgetId);
                  RemoteViews views = new RemoteViews(context.getPackageName(), R.layout.widget_quote);

                  // In bg="gradient" mode, quoteAuthor/quoteMark normally use st.accent/st.accent2
                  // for a branded tint -- but that means literally the same colors as the gradient
                  // behind them, which is unreadable. Fall back to contrast-checked text there too.
                  int effText = st.text, effAccent = st.accent, effAccent2 = st.accent2;
                  if ("gradient".equals(st.bg)) {
                      int[] gtc = WidgetStyle.gradientTextColors(st.accent, st.accent2);
                      effText = gtc[0];
                      effAccent = gtc[0];
                      effAccent2 = gtc[1];
                  }

                  // Same recolorable card treatment as the checklist widget (rounded/pill/sharp,
                  // opaque/glass/transparent/gradient/outline), so a quote widget dropped next to
                  // the others matches. cardGradientBitmap is reused from ChecklistWidgetProvider
                  // (same package) instead of duplicating the whole Canvas/Paint drawing code here.
                  if ("transparent".equals(st.bg)) {
                      views.setViewVisibility(R.id.cardShadow, View.GONE);
                      views.setViewVisibility(R.id.cardBg, View.GONE);
                  } else if ("outline".equals(st.bg)) {
                      int outlineRes = "pill".equals(st.shape) ? R.drawable.widget_card_outline_pill
                                     : "sharp".equals(st.shape) ? R.drawable.widget_card_outline_sharp
                                     : R.drawable.widget_card_outline;
                      views.setViewVisibility(R.id.cardShadow, View.GONE);
                      views.setViewVisibility(R.id.cardBg, View.VISIBLE);
                      views.setImageViewResource(R.id.cardBg, outlineRes);
                      views.setInt(R.id.cardBg, "setColorFilter", st.accent);
                      views.setInt(R.id.cardBg, "setImageAlpha", 255);
                  } else if ("gradient".equals(st.bg)) {
                      float cornerRadiusDp = "pill".equals(st.shape) ? 999f : "sharp".equals(st.shape) ? 4f : 24f;
                      Bundle sizeOpts = mgr.getAppWidgetOptions(widgetId);
                      int wDp = Math.max(120, sizeOpts.getInt(AppWidgetManager.OPTION_APPWIDGET_MIN_WIDTH, 250));
                      int hDp = Math.max(90, sizeOpts.getInt(AppWidgetManager.OPTION_APPWIDGET_MIN_HEIGHT, 180));
                      int shadowRes = "pill".equals(st.shape) ? R.drawable.widget_card_shadow_pill
                                    : "sharp".equals(st.shape) ? R.drawable.widget_card_shadow_sharp
                                    : R.drawable.widget_card_shadow;
                      views.setViewVisibility(R.id.cardShadow, View.VISIBLE);
                      views.setViewVisibility(R.id.cardBg, View.VISIBLE);
                      views.setImageViewResource(R.id.cardShadow, shadowRes);
                      views.setInt(R.id.cardShadow, "setImageAlpha", 150);
                      views.setImageViewBitmap(R.id.cardBg, ChecklistWidgetProvider.cardGradientBitmap(wDp, hDp, context, st.accent, st.accent2, cornerRadiusDp));
                      views.setInt(R.id.cardBg, "setImageAlpha", 255);
                  } else {
                      int shapeRes = "pill".equals(st.shape) ? R.drawable.widget_card_shape_pill
                                   : "sharp".equals(st.shape) ? R.drawable.widget_card_shape_sharp
                                   : R.drawable.widget_card_shape;
                      int shadowRes = "pill".equals(st.shape) ? R.drawable.widget_card_shadow_pill
                                    : "sharp".equals(st.shape) ? R.drawable.widget_card_shadow_sharp
                                    : R.drawable.widget_card_shadow;
                      views.setViewVisibility(R.id.cardShadow, View.VISIBLE);
                      views.setViewVisibility(R.id.cardBg, View.VISIBLE);
                      views.setImageViewResource(R.id.cardShadow, shadowRes);
                      views.setImageViewResource(R.id.cardBg, shapeRes);
                      views.setInt(R.id.cardBg, "setColorFilter", st.card);
                      boolean glass = "glass".equals(st.bg);
                      views.setInt(R.id.cardBg, "setImageAlpha", glass ? 165 : 255);
                      views.setInt(R.id.cardShadow, "setImageAlpha", glass ? 90 : 140);
                  }

                  int patternRes = "transparent".equals(st.bg) ? 0 : WidgetStyle.patternDrawableRes(context, st.pattern);
                  if (patternRes != 0) {
                      views.setViewVisibility(R.id.cardPattern, View.VISIBLE);
                      views.setImageViewResource(R.id.cardPattern, patternRes);
                      views.setInt(R.id.cardPattern, "setColorFilter", st.accent2);
                      views.setInt(R.id.cardPattern, "setImageAlpha", 46);
                  } else {
                      views.setViewVisibility(R.id.cardPattern, View.GONE);
                  }

                  String[] entry = QuoteCatalog.QUOTES[currentIndex(context, widgetId)];
                  views.setTextViewText(R.id.quoteText, entry[0]);
                  views.setTextViewText(R.id.quoteAuthor, "\u2014 " + entry[1]);
                  views.setInt(R.id.quoteMark, "setTextColor", effAccent2);
                  views.setInt(R.id.quoteText, "setTextColor", effText);
                  views.setInt(R.id.quoteAuthor, "setTextColor", effAccent);

                  // Tap anywhere on the card to swap in a different quote (see ACTION_QUOTE_NEXT).
                  views.setOnClickPendingIntent(R.id.widgetRoot, nextIntent(context, widgetId));

                  mgr.updateAppWidget(widgetId, views);
              }
          }
          JAVAEOF

          # ---- WidgetConfigActivity.java (the "add widget" / long-press "Edit" customization screen) ----
          cat > "$WIDGET_DIR/WidgetConfigActivity.java" <<JAVAEOF
          package ${APP_ID}.widget;

          import ${APP_ID}.R;
          import android.app.Activity;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProviderInfo;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.CompoundButton;
          import android.widget.FrameLayout;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.Switch;
          import android.widget.TextView;
          import java.util.Calendar;

          /** Shared "add widget" / long-press "Edit" screen for both home-screen widgets. Each
           *  widget instance can either follow the app's current in-app theme (default), or use
           *  one of the app's own theme palettes independently, plus its own background opacity
           *  and card shape / ring thickness — this is the per-widget customization layer. */
          public class WidgetConfigActivity extends Activity {

              private int appWidgetId = AppWidgetManager.INVALID_APPWIDGET_ID;
              private boolean isChecklist = true;

              private boolean followTheme = true;
              private String themeName = "brand";
              private String bg = "opaque";
              private String shape = "rounded";
              private String thickness = "medium";
              private String pattern = "none";
              private boolean showHour = false;
              private boolean showMinute = false;
              private String clockStyle = "simple";

              private LinearLayout themeSwatchRow, bgOptionRow, shapeOptionRow, thicknessOptionRow, patternOptionRow;
              private LinearLayout showHourRow, showMinuteRow, clockStyleOptionRow;
              private TextView clockBatteryHint, clockStyleLabel;
              private FrameLayout previewHolder;
              private Switch followThemeSwitch, showHourSwitch, showMinuteSwitch;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setResult(RESULT_CANCELED);

                  Bundle extras = getIntent().getExtras();
                  if (extras != null) {
                      appWidgetId = extras.getInt(AppWidgetManager.EXTRA_APPWIDGET_ID, AppWidgetManager.INVALID_APPWIDGET_ID);
                  }
                  if (appWidgetId == AppWidgetManager.INVALID_APPWIDGET_ID) {
                      finish();
                      return;
                  }

                  AppWidgetManager mgr = AppWidgetManager.getInstance(this);
                  AppWidgetProviderInfo info = mgr.getAppWidgetInfo(appWidgetId);
                  isChecklist = info == null || info.provider == null
                          || info.provider.getClassName().endsWith("ChecklistWidgetProvider");

                  setContentView(R.layout.activity_widget_config);

                  SharedPreferences prefs = getSharedPreferences(TaskWidgetPlugin.PREFS_NAME, Context.MODE_PRIVATE);
                  followTheme = prefs.getBoolean(WidgetStyle.prefKey(appWidgetId, "followTheme"), true);
                  themeName = prefs.getString(WidgetStyle.prefKey(appWidgetId, "themeName"), "brand");
                  bg = prefs.getString(WidgetStyle.prefKey(appWidgetId, "bg"), "opaque");
                  shape = prefs.getString(WidgetStyle.prefKey(appWidgetId, "shape"), "rounded");
                  thickness = prefs.getString(WidgetStyle.prefKey(appWidgetId, "thickness"), "medium");
                  pattern = prefs.getString(WidgetStyle.prefKey(appWidgetId, "pattern"), "none");
                  showHour = prefs.getBoolean(WidgetStyle.prefKey(appWidgetId, "showHour"), false);
                  showMinute = prefs.getBoolean(WidgetStyle.prefKey(appWidgetId, "showMinute"), false);
                  clockStyle = prefs.getString(WidgetStyle.prefKey(appWidgetId, "clockStyle"), "simple");

                  previewHolder = findViewById(R.id.previewHolder);
                  themeSwatchRow = findViewById(R.id.themeSwatchRow);
                  bgOptionRow = findViewById(R.id.bgOptionRow);
                  shapeOptionRow = findViewById(R.id.shapeOptionRow);
                  thicknessOptionRow = findViewById(R.id.thicknessOptionRow);
                  patternOptionRow = findViewById(R.id.patternOptionRow);
                  followThemeSwitch = findViewById(R.id.followThemeSwitch);
                  showHourRow = findViewById(R.id.showHourRow);
                  showMinuteRow = findViewById(R.id.showMinuteRow);
                  showHourSwitch = findViewById(R.id.showHourSwitch);
                  showMinuteSwitch = findViewById(R.id.showMinuteSwitch);
                  clockBatteryHint = findViewById(R.id.clockBatteryHint);
                  clockStyleOptionRow = findViewById(R.id.clockStyleOptionRow);
                  clockStyleLabel = findViewById(R.id.clockStyleLabel);
                  TextView shapeLabel = findViewById(R.id.shapeLabel);
                  TextView thicknessLabel = findViewById(R.id.thicknessLabel);

                  if (isChecklist) {
                      thicknessOptionRow.setVisibility(View.GONE);
                      thicknessLabel.setVisibility(View.GONE);
                      showHourRow.setVisibility(View.GONE);
                      showMinuteRow.setVisibility(View.GONE);
                      clockBatteryHint.setVisibility(View.GONE);
                      clockStyleOptionRow.setVisibility(View.GONE);
                      clockStyleLabel.setVisibility(View.GONE);
                  } else {
                      shapeOptionRow.setVisibility(View.GONE);
                      shapeLabel.setVisibility(View.GONE);
                  }

                  followThemeSwitch.setChecked(followTheme);
                  showHourSwitch.setChecked(showHour);
                  showMinuteSwitch.setChecked(showMinute);
                  buildThemeSwatches();
                  buildBgOptions();
                  if (isChecklist) buildShapeOptions(); else buildThicknessOptions();
                  buildPatternOptions();
                  buildClockStyleOptions();
                  updateClockStyleRowVisibility();
                  updateSwatchEnabled();
                  renderPreview();

                  followThemeSwitch.setOnCheckedChangeListener(new CompoundButton.OnCheckedChangeListener() {
                      @Override public void onCheckedChanged(CompoundButton buttonView, boolean isChecked) {
                          followTheme = isChecked;
                          updateSwatchEnabled();
                          renderPreview();
                      }
                  });
                  showHourSwitch.setOnCheckedChangeListener(new CompoundButton.OnCheckedChangeListener() {
                      @Override public void onCheckedChanged(CompoundButton buttonView, boolean isChecked) {
                          showHour = isChecked;
                          updateClockStyleRowVisibility();
                          renderPreview();
                      }
                  });
                  showMinuteSwitch.setOnCheckedChangeListener(new CompoundButton.OnCheckedChangeListener() {
                      @Override public void onCheckedChanged(CompoundButton buttonView, boolean isChecked) {
                          showMinute = isChecked;
                          updateClockStyleRowVisibility();
                          renderPreview();
                      }
                  });

                  Button saveBtn = findViewById(R.id.saveBtn);
                  saveBtn.setOnClickListener(new View.OnClickListener() {
                      @Override public void onClick(View v) { save(); }
                  });
              }

              private void updateSwatchEnabled() {
                  themeSwatchRow.setAlpha(followTheme ? 0.35f : 1f);
                  for (int i = 0; i < themeSwatchRow.getChildCount(); i++) {
                      themeSwatchRow.getChildAt(i).setEnabled(!followTheme);
                  }
              }

              // The clock-appearance row only makes sense once the user actually turned the
              // hour/minute display on — keep it out of the way otherwise.
              private void updateClockStyleRowVisibility() {
                  if (isChecklist) return;
                  int vis = (showHour || showMinute) ? View.VISIBLE : View.GONE;
                  clockStyleOptionRow.setVisibility(vis);
                  clockStyleLabel.setVisibility(vis);
              }

              private int dp(int v) {
                  return (int) TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, v, getResources().getDisplayMetrics());
              }

              private void buildThemeSwatches() {
                  themeSwatchRow.removeAllViews();
                  for (final String name : WidgetThemeCatalog.NAMES) {
                      int[] colors = WidgetThemeCatalog.get(name);
                      FrameLayout holder = new FrameLayout(this);
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(dp(44), dp(44));
                      lp.setMargins(dp(6), dp(4), dp(6), dp(4));
                      holder.setLayoutParams(lp);

                      View dot = new View(this);
                      FrameLayout.LayoutParams dotLp = new FrameLayout.LayoutParams(dp(36), dp(36), Gravity.CENTER);
                      GradientDrawable circle = new GradientDrawable();
                      circle.setShape(GradientDrawable.OVAL);
                      circle.setColor(colors[0]);
                      if (name.equals(themeName)) circle.setStroke(dp(3), Color.WHITE);
                      dot.setBackground(circle);
                      dot.setLayoutParams(dotLp);
                      holder.addView(dot);
                      holder.setOnClickListener(new View.OnClickListener() {
                          @Override public void onClick(View v) {
                              themeName = name;
                              buildThemeSwatches();
                              updateSwatchEnabled();
                              renderPreview();
                          }
                      });
                      themeSwatchRow.addView(holder);
                  }
              }

              private Button pillButton(String label, boolean selected) {
                  Button b = new Button(this);
                  b.setText(label);
                  b.setAllCaps(false);
                  b.setTextSize(13);
                  b.setTextColor(selected ? Color.WHITE : Color.parseColor("#CFCBE0"));
                  GradientDrawable bgShape = new GradientDrawable();
                  bgShape.setCornerRadius(dp(18));
                  bgShape.setColor(selected ? Color.parseColor("#4338CA") : Color.parseColor("#262A38"));
                  b.setBackground(bgShape);
                  b.setPadding(dp(14), dp(8), dp(14), dp(8));
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  lp.setMarginEnd(dp(10));
                  b.setLayoutParams(lp);
                  return b;
              }

              private void buildBgOptions() {
                  bgOptionRow.removeAllViews();
                  // گرادیانت/آوت‌لاین فقط برایِ ویجتِ چک‌لیست معنی داره -- دیالِ روزشمار خودش یه
                  // بیت‌مپِ یکپارچه (glow/bezel/ring) می‌کشه و این دو حالت توش پیاده نشده.
                  String[] keys = isChecklist
                      ? new String[]{ "opaque", "glass", "gradient", "outline", "transparent" }
                      : new String[]{ "opaque", "glass", "transparent" };
                  String[] labels = isChecklist
                      ? new String[]{ "کدر", "شیشه‌ای", "گرادیانت", "خط‌دور", "بدون پس‌زمینه" }
                      : new String[]{ "کدر", "شیشه‌ای", "بدون پس‌زمینه" };
                  for (int i = 0; i < keys.length; i++) {
                      final String key = keys[i];
                      Button b = pillButton(labels[i], key.equals(bg));
                      b.setOnClickListener(new View.OnClickListener() {
                          @Override public void onClick(View v) { bg = key; buildBgOptions(); renderPreview(); }
                      });
                      bgOptionRow.addView(b);
                  }
              }

              private void buildShapeOptions() {
                  shapeOptionRow.removeAllViews();
                  String[] keys = { "rounded", "pill", "sharp" };
                  String[] labels = { "گردگوشه", "بیضی", "تیز" };
                  for (int i = 0; i < keys.length; i++) {
                      final String key = keys[i];
                      Button b = pillButton(labels[i], key.equals(shape));
                      b.setOnClickListener(new View.OnClickListener() {
                          @Override public void onClick(View v) { shape = key; buildShapeOptions(); renderPreview(); }
                      });
                      shapeOptionRow.addView(b);
                  }
              }

              private void buildThicknessOptions() {
                  thicknessOptionRow.removeAllViews();
                  String[] keys = { "thin", "medium", "thick" };
                  String[] labels = { "نازک", "متوسط", "ضخیم" };
                  for (int i = 0; i < keys.length; i++) {
                      final String key = keys[i];
                      Button b = pillButton(labels[i], key.equals(thickness));
                      b.setOnClickListener(new View.OnClickListener() {
                          @Override public void onClick(View v) { thickness = key; buildThicknessOptions(); renderPreview(); }
                      });
                      thicknessOptionRow.addView(b);
                  }
              }

              private void buildPatternOptions() {
                  patternOptionRow.removeAllViews();
                  String[] keys = { "none", "dots", "stripes", "grid", "waves", "chevron", "circles", "confetti", "crosshatch", "hearts" };
                  String[] labels = { "بدون طرح", "نقطه‌ای", "راه‌راه", "شطرنجی", "موجی", "زیگزاگ", "حبابی", "کانفتی", "شبکه مورب", "قلبی" };
                  for (int i = 0; i < keys.length; i++) {
                      final String key = keys[i];
                      Button b = pillButton(labels[i], key.equals(pattern));
                      b.setOnClickListener(new View.OnClickListener() {
                          @Override public void onClick(View v) { pattern = key; buildPatternOptions(); renderPreview(); }
                      });
                      patternOptionRow.addView(b);
                  }
              }

              private void buildClockStyleOptions() {
                  clockStyleOptionRow.removeAllViews();
                  String[] keys = { "simple", "digital", "capsule" };
                  String[] labels = { "ساده", "دیجیتال", "کپسولی" };
                  for (int i = 0; i < keys.length; i++) {
                      final String key = keys[i];
                      Button b = pillButton(labels[i], key.equals(clockStyle));
                      b.setOnClickListener(new View.OnClickListener() {
                          @Override public void onClick(View v) { clockStyle = key; buildClockStyleOptions(); renderPreview(); }
                      });
                      clockStyleOptionRow.addView(b);
                  }
              }

              private int[] currentAppColors() {
                  SharedPreferences prefs = getSharedPreferences(TaskWidgetPlugin.PREFS_NAME, Context.MODE_PRIVATE);
                  return new int[]{
                      WidgetStyle.safeColor(prefs.getString(TaskWidgetPlugin.KEY_ACCENT, "#4338CA"), 0xFF4338CA),
                      WidgetStyle.safeColor(prefs.getString(TaskWidgetPlugin.KEY_ACCENT2, "#BF26D3"), 0xFFBF26D3),
                      WidgetStyle.safeColor(prefs.getString(TaskWidgetPlugin.KEY_CARD, "#FDFCFF"), 0xFFFDFCFF),
                      WidgetStyle.safeColor(prefs.getString(TaskWidgetPlugin.KEY_TEXT, "#241F3D"), 0xFF241F3D),
                      WidgetStyle.safeColor(prefs.getString(TaskWidgetPlugin.KEY_MUTED, "#8A84AB"), 0xFF8A84AB)
                  };
              }

              private void renderPreview() {
                  previewHolder.removeAllViews();
                  int[] colors = followTheme ? currentAppColors() : WidgetThemeCatalog.get(themeName);
                  int accent = colors[0], accent2 = colors[1], card = colors[2], text = colors[3], muted = colors[4];
                  // Mirror ChecklistWidgetProvider.updateOne: on the gradient background, preview
                  // text needs contrast-checked colors instead of the theme's card-oriented pair,
                  // so this preview actually matches what shows up on the home screen.
                  if (isChecklist && "gradient".equals(bg)) {
                      int[] gtc = WidgetStyle.gradientTextColors(accent, accent2);
                      text = gtc[0];
                      muted = gtc[1];
                  }

                  FrameLayout.LayoutParams full = new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT);

                  // The flat rounded/pill card + pattern below is only for the checklist widget now —
                  // the day-progress dial bakes its own bezel/face/glow into one bitmap (see the
                  // dialBitmap() branch further down), so drawing this flat card underneath it too
                  // would just double up the background.
                  if (isChecklist && !"transparent".equals(bg)) {
                      View cardView = new View(this);
                      GradientDrawable shapeDrawable = new GradientDrawable();
                      float radius = "pill".equals(shape) ? dp(999) : "sharp".equals(shape) ? dp(4) : dp(24);
                      shapeDrawable.setCornerRadius(radius);
                      // پیش‌نمایشِ این صفحه یه View/GradientDrawable واقعیه (نه RemoteViews محدود)،
                      // پس برخلافِ خودِ ویجت (که برایِ گرادیانتِ واقعی مجبور به رندرِ Bitmap دستیه —
                      // ببین cardGradientBitmap تو ChecklistWidgetProvider)، اینجا می‌شه مستقیم از
                      // GradientDrawable.setColors استفاده کرد.
                      if ("gradient".equals(bg)) {
                          shapeDrawable.setColors(new int[]{ accent, accent2 });
                          shapeDrawable.setOrientation(GradientDrawable.Orientation.TL_BR);
                          shapeDrawable.setStroke(dp(1), 0x5AFFFFFF);
                      } else if ("outline".equals(bg)) {
                          shapeDrawable.setColor(Color.TRANSPARENT);
                          shapeDrawable.setStroke(dp(2), accent);
                      } else {
                          shapeDrawable.setColor(card);
                      }
                      cardView.setBackground(shapeDrawable);
                      cardView.setAlpha("glass".equals(bg) ? 0.65f : 1f);
                      previewHolder.addView(cardView, full);

                      int patRes = WidgetStyle.patternDrawableRes(this, pattern);
                      if (patRes != 0) {
                          ImageView patView = new ImageView(this);
                          patView.setImageResource(patRes);
                          patView.setScaleType(ImageView.ScaleType.FIT_XY);
                          patView.setColorFilter(accent2);
                          patView.setImageAlpha(46);
                          previewHolder.addView(patView, full);
                      }
                  }

                  if (isChecklist) {
                      LinearLayout content = new LinearLayout(this);
                      content.setOrientation(LinearLayout.VERTICAL);
                      content.setPadding(dp(16), dp(14), dp(16), dp(14));
                      TextView title = new TextView(this);
                      title.setText("چک‌لیست امروز");
                      title.setTextColor(text);
                      title.setTextSize(13);
                      title.setTypeface(null, Typeface.BOLD);
                      content.addView(title);
                      for (int i = 0; i < 2; i++) {
                          LinearLayout row = new LinearLayout(this);
                          row.setOrientation(LinearLayout.HORIZONTAL);
                          row.setGravity(Gravity.CENTER_VERTICAL);
                          row.setPadding(0, dp(6), 0, dp(6));
                          View dot = new View(this);
                          GradientDrawable dotShape = new GradientDrawable();
                          dotShape.setShape(GradientDrawable.OVAL);
                          dotShape.setColor(i == 0 ? accent : Color.TRANSPARENT);
                          dotShape.setStroke(dp(1), muted);
                          dot.setBackground(dotShape);
                          LinearLayout.LayoutParams dotLp = new LinearLayout.LayoutParams(dp(14), dp(14));
                          dotLp.setMarginEnd(dp(8));
                          row.addView(dot, dotLp);
                          View line = new View(this);
                          line.setBackgroundColor(muted);
                          LinearLayout.LayoutParams lineLp = new LinearLayout.LayoutParams(dp(90), dp(2));
                          line.setLayoutParams(lineLp);
                          row.addView(line);
                          content.addView(row);
                      }
                      previewHolder.addView(content, full);
                  } else {
                      FrameLayout dialWrap = new FrameLayout(this);
                      ImageView ringPreview = new ImageView(this);
                      Calendar previewNow = Calendar.getInstance();
                      float pct = Math.max(0f, Math.min(1f,
                              (previewNow.get(Calendar.HOUR_OF_DAY) * 60 + previewNow.get(Calendar.MINUTE)) / 1440f));
                      float strokeFactor = "thin".equals(thickness) ? 0.06f : "thick".equals(thickness) ? 0.13f : 0.09f;
                      int trackPreview = (muted & 0x00FFFFFF) | 0x40000000;
                      ringPreview.setImageBitmap(DayProgressWidgetProvider.dialBitmap(
                              pct, 128, this, accent, accent2, trackPreview, strokeFactor, bg, card));
                      dialWrap.addView(ringPreview, full);

                      LinearLayout dayCol = new LinearLayout(this);
                      dayCol.setOrientation(LinearLayout.VERTICAL);
                      dayCol.setGravity(Gravity.CENTER);
                      TextView captionText = new TextView(this);
                      captionText.setText("روز");
                      captionText.setTextColor(muted);
                      captionText.setTypeface(null, Typeface.BOLD);
                      captionText.setTextSize(8.5f);
                      captionText.setLetterSpacing(0.12f);
                      dayCol.addView(captionText);
                      TextView dayText = new TextView(this);
                      dayText.setText("12");
                      dayText.setTextColor(text);
                      dayText.setTypeface(null, Typeface.BOLD);
                      dayText.setTextSize(20);
                      dayCol.addView(dayText);
                      if (showHour || showMinute) {
                          String clockStr = showHour && showMinute ? "12:34" : showHour ? "12" : "34";
                          TextView clockText = new TextView(this);
                          clockText.setText(clockStr);
                          clockText.setTextSize(9);
                          LinearLayout.LayoutParams clockLp = new LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                          clockLp.topMargin = dp(1);
                          if ("capsule".equals(clockStyle)) {
                              GradientDrawable pill = new GradientDrawable();
                              pill.setShape(GradientDrawable.RECTANGLE);
                              pill.setCornerRadius(dp(999));
                              pill.setColor(accent);
                              clockText.setBackground(pill);
                              clockText.setPadding(dp(6), dp(1), dp(6), dp(1));
                              clockText.setTextColor(Color.WHITE);
                          } else if ("digital".equals(clockStyle)) {
                              clockText.setLetterSpacing(0.18f);
                              clockText.setTextColor(accent);
                          } else {
                              clockText.setTextColor(muted);
                          }
                          dayCol.addView(clockText, clockLp);
                      }
                      FrameLayout.LayoutParams centerLp = new FrameLayout.LayoutParams(
                              ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT, Gravity.CENTER);
                      dialWrap.addView(dayCol, centerLp);
                      previewHolder.addView(dialWrap, full);
                  }
              }

              private void save() {
                  SharedPreferences prefs = getSharedPreferences(TaskWidgetPlugin.PREFS_NAME, Context.MODE_PRIVATE);
                  SharedPreferences.Editor editor = prefs.edit();
                  editor.putBoolean(WidgetStyle.prefKey(appWidgetId, "followTheme"), followTheme);
                  editor.putString(WidgetStyle.prefKey(appWidgetId, "themeName"), themeName);
                  editor.putString(WidgetStyle.prefKey(appWidgetId, "bg"), bg);
                  editor.putString(WidgetStyle.prefKey(appWidgetId, "shape"), shape);
                  editor.putString(WidgetStyle.prefKey(appWidgetId, "thickness"), thickness);
                  editor.putString(WidgetStyle.prefKey(appWidgetId, "pattern"), pattern);
                  editor.putBoolean(WidgetStyle.prefKey(appWidgetId, "showHour"), showHour);
                  editor.putBoolean(WidgetStyle.prefKey(appWidgetId, "showMinute"), showMinute);
                  editor.putString(WidgetStyle.prefKey(appWidgetId, "clockStyle"), clockStyle);
                  editor.apply();

                  if (isChecklist) {
                      ChecklistWidgetProvider.refreshOne(this, appWidgetId);
                  } else {
                      DayProgressWidgetProvider.refreshOne(this, appWidgetId);
                      // Applies the battery-cost cadence change (see the config screen's warning
                      // text) immediately, instead of waiting for the next background onUpdate.
                      DayProgressWidgetProvider.rescheduleTick(this);
                  }

                  Intent result = new Intent();
                  result.putExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, appWidgetId);
                  setResult(RESULT_OK, result);
                  finish();
              }
          }
          JAVAEOF

          # ---- CountdownWidgetProvider.java (custom "days until X" countdown widget -- unlike
          #      DayProgressWidgetProvider, which fills a ring from local midnight to midnight
          #      *today*, this counts the whole-day gap to a date the user picked, e.g. "110 days
          #      until کنکور", ticking down by exactly 1 once every 24h) ----
          cat > "$WIDGET_DIR/CountdownWidgetProvider.java" <<JAVAEOF
          package ${APP_ID}.widget;

          import ${APP_ID}.R;
          import android.app.AlarmManager;
          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Bundle;
          import android.view.View;
          import android.widget.RemoteViews;
          import java.util.Calendar;

          /** Home-screen "days until X" countdown widget: the user picks an event title and a
           *  target date in CountdownConfigActivity when adding the widget (or by tapping it
           *  later to edit), and the widget shows the whole-day difference between today and
           *  that date. A single exact alarm fires right after local midnight to recompute every
           *  instance's remaining-days count; every onUpdate also recomputes it as a safety net
           *  (covers reboots / missed alarms / a widget freshly dropped on the home screen). */
          public class CountdownWidgetProvider extends AppWidgetProvider {

              public static final String ACTION_COUNTDOWN_TICK = "${APP_ID}.ACTION_COUNTDOWN_TICK";

              static String titleKey(int widgetId) { return "cd_title_" + widgetId; }
              static String yearKey(int widgetId) { return "cd_year_" + widgetId; }
              static String monthKey(int widgetId) { return "cd_month_" + widgetId; }
              static String dayKey(int widgetId) { return "cd_day_" + widgetId; }

              public static void refreshAll(Context context) {
                  AppWidgetManager mgr = AppWidgetManager.getInstance(context);
                  int[] ids = mgr.getAppWidgetIds(new ComponentName(context, CountdownWidgetProvider.class));
                  for (int id : ids) updateOne(context, mgr, id);
              }

              public static void refreshOne(Context context, int widgetId) {
                  updateOne(context, AppWidgetManager.getInstance(context), widgetId);
              }

              private static PendingIntent tickIntent(Context context) {
                  Intent intent = new Intent(context, CountdownWidgetProvider.class);
                  intent.setAction(ACTION_COUNTDOWN_TICK);
                  return PendingIntent.getBroadcast(context, 0, intent,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              }

              /** Schedules one exact alarm for the next local midnight -- same low-cost once-a-day
               *  approach as QuoteWidgetProvider. All instances share this one alarm; updateOne
               *  recomputes each of them independently since each has its own stored target date. */
              private static void scheduleMidnightAlarm(Context context) {
                  try {
                      AlarmManager am = (AlarmManager) context.getSystemService(Context.ALARM_SERVICE);
                      if (am == null) return;
                      Calendar next = Calendar.getInstance();
                      next.add(Calendar.DAY_OF_YEAR, 1);
                      next.set(Calendar.HOUR_OF_DAY, 0);
                      next.set(Calendar.MINUTE, 0);
                      next.set(Calendar.SECOND, 5);
                      next.set(Calendar.MILLISECOND, 0);
                      am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, next.getTimeInMillis(), tickIntent(context));
                  } catch (Exception e) { /* best-effort */ }
              }

              private static void cancelMidnightAlarm(Context context) {
                  try {
                      AlarmManager am = (AlarmManager) context.getSystemService(Context.ALARM_SERVICE);
                      if (am != null) am.cancel(tickIntent(context));
                  } catch (Exception e) { /* best-effort */ }
              }

              @Override
              public void onEnabled(Context context) { scheduleMidnightAlarm(context); }

              @Override
              public void onDisabled(Context context) { cancelMidnightAlarm(context); }

              @Override
              public void onUpdate(Context context, AppWidgetManager mgr, int[] appWidgetIds) {
                  scheduleMidnightAlarm(context); // safety net: re-arms the alarm in case it was lost (e.g. reboot)
                  for (int id : appWidgetIds) updateOne(context, mgr, id);
              }

              @Override
              public void onReceive(Context context, Intent intent) {
                  super.onReceive(context, intent);
                  if (ACTION_COUNTDOWN_TICK.equals(intent.getAction())) {
                      refreshAll(context);
                      scheduleMidnightAlarm(context); // reschedule for the following midnight
                  }
              }

              @Override
              public void onDeleted(Context context, int[] appWidgetIds) {
                  SharedPreferences prefs = context.getSharedPreferences(TaskWidgetPlugin.PREFS_NAME, Context.MODE_PRIVATE);
                  SharedPreferences.Editor editor = prefs.edit();
                  for (int id : appWidgetIds) {
                      editor.remove(titleKey(id));
                      editor.remove(yearKey(id));
                      editor.remove(monthKey(id));
                      editor.remove(dayKey(id));
                  }
                  editor.apply();
              }

              /** Whole-day difference between local midnight today and local midnight on the
               *  target date -- both sides zeroed to midnight first so e.g. "tomorrow at 11pm"
               *  still reads as 1, not 0. Returns Long.MIN_VALUE if no date has been saved yet. */
              static long daysRemaining(Context context, int widgetId) {
                  SharedPreferences prefs = context.getSharedPreferences(TaskWidgetPlugin.PREFS_NAME, Context.MODE_PRIVATE);
                  int y = prefs.getInt(yearKey(widgetId), -1);
                  if (y == -1) return Long.MIN_VALUE;
                  int m = prefs.getInt(monthKey(widgetId), 0);
                  int d = prefs.getInt(dayKey(widgetId), 1);

                  Calendar today = Calendar.getInstance();
                  today.set(Calendar.HOUR_OF_DAY, 0); today.set(Calendar.MINUTE, 0);
                  today.set(Calendar.SECOND, 0); today.set(Calendar.MILLISECOND, 0);

                  Calendar target = Calendar.getInstance();
                  target.set(y, m, d, 0, 0, 0);
                  target.set(Calendar.MILLISECOND, 0);

                  long diffMs = target.getTimeInMillis() - today.getTimeInMillis();
                  return Math.round(diffMs / 86400000.0);
              }

              private static void updateOne(Context context, AppWidgetManager mgr, int widgetId) {
                  WidgetStyle st = WidgetStyle.resolve(context, widgetId);
                  RemoteViews views = new RemoteViews(context.getPackageName(), R.layout.widget_countdown);

                  // Same contrast fallback as QuoteWidgetProvider: on a gradient background the
                  // accent colors are the background itself, so they're unreadable as text color.
                  int effText = st.text, effAccent = st.accent, effAccent2 = st.accent2, effMuted = st.muted;
                  if ("gradient".equals(st.bg)) {
                      int[] gtc = WidgetStyle.gradientTextColors(st.accent, st.accent2);
                      effText = gtc[0];
                      effAccent = gtc[0];
                      effAccent2 = gtc[1];
                      effMuted = gtc[0];
                  }

                  // Same recolorable card treatment as the quote/checklist widgets (rounded/pill/sharp,
                  // opaque/glass/transparent/gradient/outline).
                  if ("transparent".equals(st.bg)) {
                      views.setViewVisibility(R.id.cardShadow, View.GONE);
                      views.setViewVisibility(R.id.cardBg, View.GONE);
                  } else if ("outline".equals(st.bg)) {
                      int outlineRes = "pill".equals(st.shape) ? R.drawable.widget_card_outline_pill
                                     : "sharp".equals(st.shape) ? R.drawable.widget_card_outline_sharp
                                     : R.drawable.widget_card_outline;
                      views.setViewVisibility(R.id.cardShadow, View.GONE);
                      views.setViewVisibility(R.id.cardBg, View.VISIBLE);
                      views.setImageViewResource(R.id.cardBg, outlineRes);
                      views.setInt(R.id.cardBg, "setColorFilter", st.accent);
                      views.setInt(R.id.cardBg, "setImageAlpha", 255);
                  } else if ("gradient".equals(st.bg)) {
                      float cornerRadiusDp = "pill".equals(st.shape) ? 999f : "sharp".equals(st.shape) ? 4f : 24f;
                      Bundle sizeOpts = mgr.getAppWidgetOptions(widgetId);
                      int wDp = Math.max(90, sizeOpts.getInt(AppWidgetManager.OPTION_APPWIDGET_MIN_WIDTH, 130));
                      int hDp = Math.max(90, sizeOpts.getInt(AppWidgetManager.OPTION_APPWIDGET_MIN_HEIGHT, 130));
                      int shadowRes = "pill".equals(st.shape) ? R.drawable.widget_card_shadow_pill
                                    : "sharp".equals(st.shape) ? R.drawable.widget_card_shadow_sharp
                                    : R.drawable.widget_card_shadow;
                      views.setViewVisibility(R.id.cardShadow, View.VISIBLE);
                      views.setViewVisibility(R.id.cardBg, View.VISIBLE);
                      views.setImageViewResource(R.id.cardShadow, shadowRes);
                      views.setInt(R.id.cardShadow, "setImageAlpha", 150);
                      views.setImageViewBitmap(R.id.cardBg, ChecklistWidgetProvider.cardGradientBitmap(wDp, hDp, context, st.accent, st.accent2, cornerRadiusDp));
                      views.setInt(R.id.cardBg, "setImageAlpha", 255);
                  } else {
                      int shapeRes = "pill".equals(st.shape) ? R.drawable.widget_card_shape_pill
                                   : "sharp".equals(st.shape) ? R.drawable.widget_card_shape_sharp
                                   : R.drawable.widget_card_shape;
                      int shadowRes = "pill".equals(st.shape) ? R.drawable.widget_card_shadow_pill
                                    : "sharp".equals(st.shape) ? R.drawable.widget_card_shadow_sharp
                                    : R.drawable.widget_card_shadow;
                      views.setViewVisibility(R.id.cardShadow, View.VISIBLE);
                      views.setViewVisibility(R.id.cardBg, View.VISIBLE);
                      views.setImageViewResource(R.id.cardShadow, shadowRes);
                      views.setImageViewResource(R.id.cardBg, shapeRes);
                      views.setInt(R.id.cardBg, "setColorFilter", st.card);
                      boolean glass = "glass".equals(st.bg);
                      views.setInt(R.id.cardBg, "setImageAlpha", glass ? 165 : 255);
                      views.setInt(R.id.cardShadow, "setImageAlpha", glass ? 90 : 140);
                  }

                  int patternRes = "transparent".equals(st.bg) ? 0 : WidgetStyle.patternDrawableRes(context, st.pattern);
                  if (patternRes != 0) {
                      views.setViewVisibility(R.id.cardPattern, View.VISIBLE);
                      views.setImageViewResource(R.id.cardPattern, patternRes);
                      views.setInt(R.id.cardPattern, "setColorFilter", st.accent2);
                      views.setInt(R.id.cardPattern, "setImageAlpha", 46);
                  } else {
                      views.setViewVisibility(R.id.cardPattern, View.GONE);
                  }

                  SharedPreferences prefs = context.getSharedPreferences(TaskWidgetPlugin.PREFS_NAME, Context.MODE_PRIVATE);
                  String title = prefs.getString(titleKey(widgetId), "");
                  long days = daysRemaining(context, widgetId);

                  views.setTextViewText(R.id.countdownTitle, title.isEmpty() ? "رویداد" : title);
                  views.setInt(R.id.countdownTitle, "setTextColor", effMuted);

                  if (days == Long.MIN_VALUE) {
                      views.setTextViewText(R.id.countdownNumber, "?");
                      views.setTextViewText(R.id.countdownLabel, "برای تنظیم ضربه بزن");
                  } else if (days > 0) {
                      views.setTextViewText(R.id.countdownNumber, String.valueOf(days));
                      views.setTextViewText(R.id.countdownLabel, "روز مانده");
                  } else if (days == 0) {
                      views.setTextViewText(R.id.countdownNumber, "\uD83C\uDF89");
                      views.setTextViewText(R.id.countdownLabel, "امروز است!");
                  } else {
                      views.setTextViewText(R.id.countdownNumber, String.valueOf(-days));
                      views.setTextViewText(R.id.countdownLabel, "روز گذشت");
                  }
                  views.setInt(R.id.countdownNumber, "setTextColor", effAccent);
                  views.setInt(R.id.countdownLabel, "setTextColor", effAccent2);

                  // Tap the card to reopen the config screen and change the title/date later.
                  Intent configIntent = new Intent(context, CountdownConfigActivity.class);
                  configIntent.putExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, widgetId);
                  configIntent.setData(android.net.Uri.parse("widget://countdown/" + widgetId));
                  PendingIntent editPi = PendingIntent.getActivity(context, widgetId, configIntent,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  views.setOnClickPendingIntent(R.id.widgetRoot, editPi);

                  mgr.updateAppWidget(widgetId, views);
              }
          }
          JAVAEOF

          # ---- CountdownConfigActivity.java (the "add widget" / tap-to-edit screen for the
          #      countdown widget -- unlike WidgetConfigActivity, which only customizes *look*
          #      for the checklist/day-progress widgets, this collects the actual content: an
          #      event title and a target date, since every countdown instance points at a
          #      different date the user picks) ----
          cat > "$WIDGET_DIR/CountdownConfigActivity.java" <<JAVAEOF
          package ${APP_ID}.widget;

          import android.app.Activity;
          import android.app.DatePickerDialog;
          import android.appwidget.AppWidgetManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.text.InputType;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import java.util.Calendar;
          import java.util.Locale;

          /** "Add widget" / tap-to-edit screen for the countdown widget. Reused both when the
           *  widget is first dropped on the home screen (system-driven, must call setResult
           *  before finishing) and when the user taps an already-placed widget to change its
           *  event or date later -- CountdownWidgetProvider routes both flows here. */
          public class CountdownConfigActivity extends Activity {

              private int appWidgetId = AppWidgetManager.INVALID_APPWIDGET_ID;
              private int pickedYear, pickedMonth, pickedDay;
              private boolean dateChosen = false;

              private EditText titleInput;
              private TextView dateValueText;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setResult(RESULT_CANCELED);

                  Bundle extras = getIntent().getExtras();
                  if (extras != null) {
                      appWidgetId = extras.getInt(AppWidgetManager.EXTRA_APPWIDGET_ID, AppWidgetManager.INVALID_APPWIDGET_ID);
                  }
                  if (appWidgetId == AppWidgetManager.INVALID_APPWIDGET_ID) {
                      finish();
                      return;
                  }

                  SharedPreferences prefs = getSharedPreferences(TaskWidgetPlugin.PREFS_NAME, Context.MODE_PRIVATE);
                  String existingTitle = prefs.getString(CountdownWidgetProvider.titleKey(appWidgetId), "");
                  int existingYear = prefs.getInt(CountdownWidgetProvider.yearKey(appWidgetId), -1);

                  Calendar cal = Calendar.getInstance();
                  if (existingYear != -1) {
                      pickedYear = existingYear;
                      pickedMonth = prefs.getInt(CountdownWidgetProvider.monthKey(appWidgetId), cal.get(Calendar.MONTH));
                      pickedDay = prefs.getInt(CountdownWidgetProvider.dayKey(appWidgetId), cal.get(Calendar.DAY_OF_MONTH));
                      dateChosen = true;
                  } else {
                      // Sensible default so "Save" always works even if the user never opens the
                      // date picker: one month out, rather than leaving the widget unconfigured.
                      cal.add(Calendar.MONTH, 1);
                      pickedYear = cal.get(Calendar.YEAR);
                      pickedMonth = cal.get(Calendar.MONTH);
                      pickedDay = cal.get(Calendar.DAY_OF_MONTH);
                  }

                  buildUi(existingTitle);
              }

              private int dp(int v) {
                  return (int) TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, v, getResources().getDisplayMetrics());
              }

              private void buildUi(String existingTitle) {
                  ScrollView scroll = new ScrollView(this);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);
                  root.setPadding(dp(24), dp(28), dp(24), dp(28));
                  root.setBackgroundColor(Color.parseColor("#FDFCFF"));

                  TextView heading = new TextView(this);
                  heading.setText("شمارش معکوس تا رویداد");
                  heading.setTextDirection(View.TEXT_DIRECTION_RTL);
                  heading.setTextAlignment(View.TEXT_ALIGNMENT_VIEW_START);
                  heading.setTypeface(null, Typeface.BOLD);
                  heading.setTextSize(19);
                  heading.setTextColor(Color.parseColor("#241F3D"));
                  root.addView(heading);

                  TextView subheading = new TextView(this);
                  subheading.setText("مثلاً: کنکور، تولد، سفر، یا هر ددلاینی که داری");
                  subheading.setTextDirection(View.TEXT_DIRECTION_RTL);
                  subheading.setTextAlignment(View.TEXT_ALIGNMENT_VIEW_START);
                  subheading.setTextSize(13);
                  subheading.setTextColor(Color.parseColor("#8A84AB"));
                  LinearLayout.LayoutParams subLp = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  subLp.topMargin = dp(4);
                  subLp.bottomMargin = dp(24);
                  root.addView(subheading, subLp);

                  TextView titleLabel = new TextView(this);
                  titleLabel.setText("عنوان رویداد");
                  titleLabel.setTextDirection(View.TEXT_DIRECTION_RTL);
                  titleLabel.setTextAlignment(View.TEXT_ALIGNMENT_VIEW_START);
                  titleLabel.setTextSize(13);
                  titleLabel.setTypeface(null, Typeface.BOLD);
                  titleLabel.setTextColor(Color.parseColor("#241F3D"));
                  root.addView(titleLabel);

                  titleInput = new EditText(this);
                  titleInput.setText(existingTitle);
                  titleInput.setHint("مثلاً: کنکور");
                  titleInput.setInputType(InputType.TYPE_CLASS_TEXT);
                  titleInput.setTextDirection(View.TEXT_DIRECTION_RTL);
                  titleInput.setTextAlignment(View.TEXT_ALIGNMENT_VIEW_START);
                  titleInput.setGravity(Gravity.END | Gravity.CENTER_VERTICAL);
                  titleInput.setTextSize(15);
                  titleInput.setPadding(dp(12), dp(10), dp(12), dp(10));
                  GradientDrawable inputBg = new GradientDrawable();
                  inputBg.setCornerRadius(dp(12));
                  inputBg.setColor(Color.parseColor("#F2F0FA"));
                  titleInput.setBackground(inputBg);
                  LinearLayout.LayoutParams titleLp = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  titleLp.topMargin = dp(8);
                  titleLp.bottomMargin = dp(20);
                  root.addView(titleInput, titleLp);

                  TextView dateLabel = new TextView(this);
                  dateLabel.setText("تاریخ رویداد");
                  dateLabel.setTextDirection(View.TEXT_DIRECTION_RTL);
                  dateLabel.setTextAlignment(View.TEXT_ALIGNMENT_VIEW_START);
                  dateLabel.setTextSize(13);
                  dateLabel.setTypeface(null, Typeface.BOLD);
                  dateLabel.setTextColor(Color.parseColor("#241F3D"));
                  root.addView(dateLabel);

                  dateValueText = new TextView(this);
                  dateValueText.setTextDirection(View.TEXT_DIRECTION_RTL);
                  dateValueText.setTextAlignment(View.TEXT_ALIGNMENT_VIEW_START);
                  dateValueText.setGravity(Gravity.END | Gravity.CENTER_VERTICAL);
                  dateValueText.setTextSize(15);
                  dateValueText.setTextColor(Color.parseColor("#4338CA"));
                  dateValueText.setTypeface(null, Typeface.BOLD);
                  dateValueText.setPadding(dp(12), dp(12), dp(12), dp(12));
                  GradientDrawable dateBg = new GradientDrawable();
                  dateBg.setCornerRadius(dp(12));
                  dateBg.setColor(Color.parseColor("#F2F0FA"));
                  dateValueText.setBackground(dateBg);
                  updateDateText();
                  LinearLayout.LayoutParams dateLp = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  dateLp.topMargin = dp(8);
                  dateLp.bottomMargin = dp(28);
                  dateValueText.setOnClickListener(new View.OnClickListener() {
                      @Override public void onClick(View v) { openDatePicker(); }
                  });
                  root.addView(dateValueText, dateLp);

                  Button saveBtn = new Button(this);
                  saveBtn.setText("ذخیره");
                  saveBtn.setAllCaps(false);
                  saveBtn.setTextColor(Color.WHITE);
                  saveBtn.setTypeface(null, Typeface.BOLD);
                  GradientDrawable saveBg = new GradientDrawable();
                  saveBg.setCornerRadius(dp(14));
                  saveBg.setColor(Color.parseColor("#4338CA"));
                  saveBtn.setBackground(saveBg);
                  saveBtn.setOnClickListener(new View.OnClickListener() {
                      @Override public void onClick(View v) { save(); }
                  });
                  LinearLayout.LayoutParams saveLp = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, dp(48));
                  root.addView(saveBtn, saveLp);

                  scroll.addView(root);
                  setContentView(scroll);
              }

              private void openDatePicker() {
                  DatePickerDialog dialog = new DatePickerDialog(this,
                          new DatePickerDialog.OnDateSetListener() {
                              @Override
                              public void onDateSet(android.widget.DatePicker view, int year, int month, int dayOfMonth) {
                                  pickedYear = year;
                                  pickedMonth = month;
                                  pickedDay = dayOfMonth;
                                  dateChosen = true;
                                  updateDateText();
                              }
                          }, pickedYear, pickedMonth, pickedDay);
                  dialog.show();
              }

              private void updateDateText() {
                  String[] months = {"ژانویه","فوریه","مارس","آوریل","مه","ژوئن","ژوئیه","اوت","سپتامبر","اکتبر","نوامبر","دسامبر"};
                  String label = String.format(Locale.US, "%d %s %d", pickedDay, months[pickedMonth], pickedYear);
                  dateValueText.setText(dateChosen ? label : label + "  (برای انتخاب ضربه بزن)");
              }

              private void save() {
                  String title = titleInput.getText().toString().trim();
                  if (title.isEmpty()) title = "رویداد";

                  SharedPreferences prefs = getSharedPreferences(TaskWidgetPlugin.PREFS_NAME, Context.MODE_PRIVATE);
                  prefs.edit()
                          .putString(CountdownWidgetProvider.titleKey(appWidgetId), title)
                          .putInt(CountdownWidgetProvider.yearKey(appWidgetId), pickedYear)
                          .putInt(CountdownWidgetProvider.monthKey(appWidgetId), pickedMonth)
                          .putInt(CountdownWidgetProvider.dayKey(appWidgetId), pickedDay)
                          .apply();

                  CountdownWidgetProvider.refreshOne(this, appWidgetId);

                  Intent result = new Intent();
                  result.putExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, appWidgetId);
                  setResult(RESULT_OK, result);
                  finish();
              }
          }
          JAVAEOF

          # ---- res/layout/widget_checklist.xml ----
          cat > "$RES_DIR/layout/widget_checklist.xml" <<'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent">

              <!-- Soft drop shadow: a static translucent rounded rect, offset a couple dp down so
                   the card in front reads as gently floating instead of a flat pasted-on rectangle. -->
              <ImageView
                  android:id="@+id/cardShadow"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:layout_marginTop="3dp"
                  android:src="@drawable/widget_card_shadow"
                  android:scaleType="fitXY" />

              <!-- The actual card: one shape recolored at runtime (setColorFilter) to whatever
                   theme.card color the app is currently using — this is what makes the widget
                   follow the in-app theme instead of a hardcoded lavender box. -->
              <ImageView
                  android:id="@+id/cardBg"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:src="@drawable/widget_card_shape"
                  android:scaleType="fitXY" />

              <!-- Optional decorative pattern (dots/stripes/grid/waves), drawn on top of cardBg
                   and tinted with the secondary theme color at runtime. Gone by default. -->
              <ImageView
                  android:id="@+id/cardPattern"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:scaleType="fitXY"
                  android:visibility="gone" />

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:orientation="vertical"
                  android:padding="16dp">

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="horizontal"
                      android:gravity="center_vertical"
                      android:paddingBottom="8dp">

                      <TextView
                          android:id="@+id/title"
                          android:layout_width="0dp"
                          android:layout_weight="1"
                          android:layout_height="wrap_content"
                          android:text="چک‌لیست امروز"
                          android:textDirection="rtl"
                          android:textAlignment="viewStart"
                          android:textColor="#241F3D"
                          android:textStyle="bold"
                          android:textSize="14sp" />

                      <!-- Jewel-style "done/total" badge — same gradient-capsule language as the
                           day-progress widget's digital clock badge. Hidden with no tasks at all. -->
                      <FrameLayout
                          android:id="@+id/progressBadgeWrap"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content">
                          <ImageView
                              android:id="@+id/progressBadgeBg"
                              android:layout_width="match_parent"
                              android:layout_height="match_parent"
                              android:src="@drawable/widget_card_shape_pill"
                              android:scaleType="fitXY" />
                          <TextView
                              android:id="@+id/progressBadgeText"
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:paddingStart="9dp"
                              android:paddingEnd="9dp"
                              android:paddingTop="3dp"
                              android:paddingBottom="3dp"
                              android:textColor="#FFFFFF"
                              android:textStyle="bold"
                              android:textSize="9.5sp" />
                      </FrameLayout>
                  </LinearLayout>

                  <!-- Slim gradient progress bar, hand-drawn bitmap (see progressBarBitmap in
                       ChecklistWidgetProvider). Height is fixed to match that bitmap exactly, so
                       scaleType="fitXY" below only ever stretches the width axis, never the height. -->
                  <ImageView
                      android:id="@+id/progressBar"
                      android:layout_width="match_parent"
                      android:layout_height="7dp"
                      android:layout_marginBottom="10dp"
                      android:scaleType="fitXY" />

                  <!-- Real scrollable task list (backed by ChecklistRemoteViewsService), so any
                       number of tasks can be swiped through — not capped at a fixed row count,
                       and resizing the widget taller simply reveals more rows at once. -->
                  <ListView
                      android:id="@+id/checklistListView"
                      android:layout_width="match_parent"
                      android:layout_height="0dp"
                      android:layout_weight="1"
                      android:divider="@null"
                      android:dividerHeight="0dp"
                      android:scrollbars="none"
                      android:listSelector="@android:color/transparent"
                      android:cacheColorHint="#00000000" />

                  <LinearLayout
                      android:id="@+id/emptyViewWrap"
                      android:layout_width="match_parent"
                      android:layout_height="0dp"
                      android:layout_weight="1"
                      android:orientation="vertical"
                      android:gravity="center"
                      android:visibility="gone">
                      <ImageView
                          android:id="@+id/emptyIcon"
                          android:layout_width="26dp"
                          android:layout_height="26dp"
                          android:layout_marginBottom="6dp"
                          android:src="@drawable/widget_check_off" />
                      <TextView
                          android:id="@+id/emptyView"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:gravity="center"
                          android:text="کاری برای امروز نیست"
                          android:textDirection="rtl"
                          android:textColor="#8A84AB"
                          android:textSize="12sp" />
                  </LinearLayout>

              </LinearLayout>
          </FrameLayout>
          XMLEOF

          # ---- res/layout/widget_checklist_item.xml (one row inside the scrollable list, built
