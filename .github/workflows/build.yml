                  {"شخصیت با آسایش و راحتی ساخته نمی‌شود؛ فقط از راه تجربه‌ی آزمون و رنج، روح تقویت می‌شود.", "هلن کلر"},
                  {"هرچند من نمی‌توانم راهی را که پیش رویم است ببینم، اما می‌توانم گام بردارم.", "هلن کلر"},
