          # ---- res/layout/widget_day_progress.xml ----
          cat > "$RES_DIR/layout/widget_day_progress.xml" <<'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:padding="8dp">

              <!-- Soft drop shadow behind the circular card (same floating-card trick as the
                   checklist widget), then the recolorable circular card, then the gradient ring. -->
              <ImageView
                  android:id="@+id/cardShadow"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:layout_marginTop="3dp"
                  android:src="@drawable/widget_card_shadow_circle"
                  android:scaleType="fitXY" />

              <ImageView
                  android:id="@+id/cardBg"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:src="@drawable/widget_card_shape_circle"
                  android:scaleType="fitXY" />

              <!-- Optional decorative pattern (dots/stripes/grid/waves), drawn on top of cardBg
                   and tinted with the secondary theme color at runtime. Gone by default. -->
              <ImageView
                  android:id="@+id/cardPattern"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:scaleType="fitXY"
                  android:visibility="gone" />

              <ImageView android:id="@+id/ring" android:layout_width="match_parent" android:layout_height="match_parent"
                  android:layout_gravity="center" android:padding="4dp" />
              <LinearLayout
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_gravity="center"
                  android:orientation="vertical"
                  android:gravity="center">
                  <TextView android:id="@+id/dayLabel" android:layout_width="wrap_content" android:layout_height="wrap_content"
                      android:textDirection="rtl" android:textColor="#241F3D"
                      android:textStyle="bold" android:textSize="16sp" />
                  <!-- Optional live HH / MM display (off by default — costs a bit more battery
                       since it needs a faster background refresh; see WidgetConfigActivity).
                       clockBadgeBg is only shown for the "capsule" style, tinted at runtime the
                       same way cardBg is — a small colored pill sitting behind the text. -->
                  <FrameLayout
                      android:id="@+id/clockLabelWrap"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="1dp"
                      android:visibility="gone">
                      <ImageView
                          android:id="@+id/clockBadgeBg"
                          android:layout_width="match_parent"
                          android:layout_height="match_parent"
                          android:src="@drawable/widget_card_shape_pill"
                          android:scaleType="fitXY"
                          android:visibility="gone" />
                      <TextView android:id="@+id/clockLabel" android:layout_width="wrap_content" android:layout_height="wrap_content"
                          android:layout_gravity="center"
                          android:paddingStart="6dp" android:paddingEnd="6dp" android:paddingTop="1dp" android:paddingBottom="1dp"
                          android:textDirection="ltr" android:textColor="#8A84AB"
                          android:textSize="9sp" />
                  </FrameLayout>
              </LinearLayout>
          </FrameLayout>
          XMLEOF

