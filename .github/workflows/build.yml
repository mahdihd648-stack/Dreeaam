                  {"موفقیت چیزی نیست که دنبالش بروی؛ چیزی است که با آنچه هستی، به سویت می‌آید.", "جیم ران"},
                  {"عملکردت را برای رسیدن به هدف تنظیم کن، نه فقط برای رسیدن به احساس خوب.", "جیم ران"},
                  {"روزها سخت‌اند اما پرثمر؛ آسان‌ترین روزها، اغلب کم‌ثمرترین‌اند.", "جیم ران"},
                  {"از کاری که برایت آسان است شروع کن؛ سختی‌ها را در راه یاد می‌گیری.", "جیم ران"},
                  {"اگر تو مراقب زندگی‌ات نباشی، دیگران آن را برایت مدیریت می‌کنند.", "جیم ران"},

                  // --- بروس لی ---
                  {"از آنچه هستی مأیوس نشو؛ نگران این باش که چه چیزی می‌توانی بشوی.", "بروس لی"},
                  {"نه از فردی که ده‌هزار مشت جدا از هم زده، بلکه از فردی که یک مشت را ده‌هزار بار تمرین کرده می‌ترسم.", "بروس لی"},
                  {"مانند آب باش، دوستِ من.", "بروس لی"},
