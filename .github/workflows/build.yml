          # ---- AndroidManifest.xml: register the two widget receivers ----
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          python3 - "$MANIFEST" "$APP_ID" <<'WIDGETPYEOF'
          import sys, re
          path = sys.argv[1]
          app_id = sys.argv[2]
          with open(path, encoding='utf-8') as f:
              src = f.read()

          if 'ChecklistWidgetProvider' not in src:
              receivers = (
                  '    <receiver android:name="' + app_id + '.widget.ChecklistWidgetProvider" android:exported="true">\n'
                  '        <intent-filter>\n'
                  '            <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />\n'
                  '            <action android:name="' + app_id + '.ACTION_TOGGLE_TASK" />\n'
                  '        </intent-filter>\n'
                  '        <meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_checklist_info" />\n'
                  '    </receiver>\n'
                  '    <service android:name="' + app_id + '.widget.ChecklistRemoteViewsService"\n'
                  '        android:exported="false"\n'
                  '        android:permission="android.permission.BIND_REMOTEVIEWS" />\n'
                  '    <receiver android:name="' + app_id + '.widget.DayProgressWidgetProvider" android:exported="true">\n'
                  '        <intent-filter>\n'
                  '            <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />\n'
                  '            <action android:name="' + app_id + '.ACTION_WIDGET_TICK" />\n'
                  '        </intent-filter>\n'
                  '        <meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_day_progress_info" />\n'
                  '    </receiver>\n'
                  '    <activity android:name="' + app_id + '.widget.WidgetConfigActivity"\n'
                  '        android:exported="true"\n'
                  '        android:theme="@android:style/Theme.DeviceDefault.NoActionBar">\n'
                  '        <intent-filter>\n'
                  '            <action android:name="android.appwidget.action.APPWIDGET_CONFIGURE" />\n'
                  '            <category android:name="android.intent.category.DEFAULT" />\n'
                  '        </intent-filter>\n'
                  '    </activity>\n'
              )
              src = src.replace('</application>', receivers + '</application>', 1)

          with open(path, 'w', encoding='utf-8') as f:
              f.write(src)
          WIDGETPYEOF

      - name: Add notification permissions (POST_NOTIFICATIONS / exact alarm / boot)
        # Without these, @capacitor/local-notifications schedules silently fail or get dropped
        # by the OS on Android 13+ (runtime permission), Android 12+ (exact alarms), and after
        # a phone reboot (rescheduling needs boot access).
        run: |
          set -e
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          python3 - "$MANIFEST" <<'PYEOF'
          import sys, re
          path = sys.argv[1]
          with open(path, encoding='utf-8') as f:
              src = f.read()

          notif_permissions = (
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n'
              '    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n'
              '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n'
              '    <uses-permission android:name="android.permission.VIBRATE" />\n'
          )
          for perm in [
              'android.permission.POST_NOTIFICATIONS',
              'android.permission.SCHEDULE_EXACT_ALARM',
              'android.permission.RECEIVE_BOOT_COMPLETED',
              'android.permission.VIBRATE',
          ]:
              if perm not in src:
                  src = re.sub(r'(<manifest[^>]*>\n)',
                                lambda m, p=perm: m.group(1) + f'    <uses-permission android:name="{p}" />\n',
                                src, count=1)

          with open(path, 'w', encoding='utf-8') as f:
              f.write(src)
          PYEOF

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: Wire up release signing in build.gradle
        run: |
          APP_GRADLE="android/app/build.gradle"
          python3 - "$APP_GRADLE" <<'PYEOF'
          import sys, re
          path = sys.argv[1]
          with open(path, encoding='utf-8') as f:
              src = f.read()

          signing_block = '''
              signingConfigs {
                  release {
                      storeFile file("release.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
          '''
          if 'signingConfigs' not in src:
              src = re.sub(r'(android\s*\{)', r'\1' + signing_block, src, count=1)

          if 'signingConfig signingConfigs.release' not in src:
              src = re.sub(
                  r'(buildTypes\s*\{\s*release\s*\{)',
                  r'\1\n            signingConfig signingConfigs.release',
                  src, count=1
              )

          with open(path, 'w', encoding='utf-8') as f:
              f.write(src)
          PYEOF

      - name: Build release APK (signed)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dreamlife-apk-release
          path: android/app/build/outputs/apk/release/app-release.apk
