                  {"شهامت، نخستین فضیلت انسانی است، چون همه‌ی فضیلت‌های دیگر را ممکن می‌سازد.", "وینستون چرچیل"},
                  {"نگرشِ ما نسبت به زندگی، نگرشِ زندگی را نسبت به ما تعیین می‌کند.", "وینستون چرچیل"},
                  {"ما با آنچه به دست می‌آوریم زندگی می‌سازیم؛ با آنچه می‌بخشیم، زندگی می‌سازیم.", "وینستون چرچیل"},

                  // --- مولانا ---
                  {"زخم همان جایی‌ست که نور به درونت راه پیدا می‌کند.", "مولانا"},
                  {"هر چیزی که دنبالش می‌گردی، خودش هم دنبال توست.", "مولانا"},
                  {"به‌جای این‌که بپرسی «چرا این اتفاق برای من افتاد؟»، بپرس «این اتفاق چه چیزی به من می‌آموزد؟»", "مولانا"},
