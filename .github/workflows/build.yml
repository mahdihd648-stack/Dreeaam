                  // --- مارک تواین ---
                  {"بیست سال دیگر، بیشتر از کارهایی که نکرده‌ای پشیمان می‌شوی تا کارهایی که کرده‌ای.", "مارک تواین"},
                  {"شجاعت، مقاومت در برابر ترس نیست؛ چیره‌شدن بر آن است.", "مارک تواین"},
