name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm install

      - name: Ensure local-notifications plugin is present
        # Safety net in case package.json/lock in the repo hasn't been updated yet — installs
        # the native notifications plugin so `npx cap sync android` has something to sync.
        # Best practice is still to add "@capacitor/local-notifications" to package.json
        # yourself and commit the lockfile, so this step becomes a no-op.
        run: |
          if ! node -e "require.resolve('@capacitor/local-notifications')" 2>/dev/null; then
            npm install @capacitor/local-notifications
          fi

      - name: Ensure push-notifications plugin is present
        # Same safety net as above, for @capacitor/push-notifications — the plugin that
        # index.html/app.js already calls (Capacitor.Plugins.PushNotifications, see
        # initPushNotifications) but that had no native counterpart in the project yet.
        # Capacitor auto-discovers this via its own gradle registration on `npx cap sync
        # android` — unlike MarketBillingPlugin/TaskWidgetPlugin below, no manual
        # registerPlugin() call is needed for it in MainActivity.
        run: |
          if ! node -e "require.resolve('@capacitor/push-notifications')" 2>/dev/null; then
            npm install @capacitor/push-notifications
          fi

      - name: Ensure share plugin is present
        # Same safety net again, for @capacitor/share — app.js calls
        # Capacitor.Plugins.Share, but package.json never listed the plugin, so
        # `npx cap sync android` had no native implementation to wire up and every
        # share button in the native app silently did nothing. Auto-discovered by
        # Capacitor the same way as push-notifications above — no MainActivity
        # registerPlugin() call needed.
        run: |
          if ! node -e "require.resolve('@capacitor/share')" 2>/dev/null; then
            npm install @capacitor/share
          fi

      - name: Locate icon source at repo root
        # Single source of truth for every generated icon (web + native). Looks directly
        # in the repo root instead of resources/icon-only.png (which wasn't being found),
        # and fails loudly with a directory listing if nothing matches.
        run: |
          set -e
          CANDIDATES=(icon-only.png icon.png app-icon.png logo.png icon-source.png)
          ICON_SRC=""
          for c in "${CANDIDATES[@]}"; do
            if [ -f "$c" ]; then
              ICON_SRC="$c"
              break
            fi
          done
          if [ -z "$ICON_SRC" ]; then
            echo "::error::No icon file found at repo root. Looked for: ${CANDIDATES[*]}"
            echo "Repo root contents:"
            ls -la
            exit 1
          fi
          echo "Using icon source: $ICON_SRC"
          echo "ICON_SRC=$ICON_SRC" >> "$GITHUB_ENV"

      - name: Generate web icons into assets/ (icon-192.png, icon-512.png)
        # The web app (index.html / manifest.json) expects icon-192.png and icon-512.png,
        # but nothing in the repo produced them before — this step derives them from the
        # same repo-root icon used for the native Android icon and drops them into assets/,
        # so they're versioned alongside the app's other assets and the next step can pick
        # them up from there.
        run: |
          sudo apt-get update -y && sudo apt-get install -y imagemagick
          mkdir -p assets
          convert "$ICON_SRC" -resize 192x192 assets/icon-192.png
          convert "$ICON_SRC" -resize 512x512 assets/icon-512.png

      - name: Commit generated web icons back to the repo
        # [skip ci] stops this commit from re-triggering the "push to main" trigger above —
        # without it, every run would push a commit that starts another run, forever.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/icon-192.png assets/icon-512.png
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate web icons (192/512) [skip ci]"
            for i in 1 2 3 4 5; do
              if git push; then
                break
              fi
              echo "Push rejected (remote moved on) — rebasing onto origin/main and retrying ($i/5)"
              git fetch origin main
              # These icons are binary and fully regenerated every run, so there's nothing
              # meaningful to merge — on conflict, always keep our freshly generated files.
              # Note: git rebase flips the usual meaning of ours/theirs — "theirs" here means
              # the commit being replayed (ours), not origin's.
              if ! git rebase -X theirs origin/main; then
                echo "::error::Rebase failed even with -X theirs — aborting"
                git rebase --abort
                exit 1
              fi
              if [ "$i" -eq 5 ]; then
                echo "::error::Could not push after 5 attempts"
                exit 1
              fi
            done
          else
            echo "Icons unchanged — nothing to commit"
          fi

      - name: Prepare web assets (www/)
        run: |
          mkdir -p www
          cp index.html www/index.html
          # index.html با <script defer src="app.js"> اسکریپت اصلی رو جدا لود می‌کنه —
          # بدون این خط، www/app.js اصلاً وجود نداره و اپ اندروید یه صفحه‌ی کاملاً سفید
          # و بدون جاوااسکریپت می‌شه (نه فقط باگ سوییچ تب، هیچی کار نمی‌کنه).
          [ -f app.js ] && cp app.js www/app.js || { echo "::error::app.js not found in repo root"; exit 1; }
          [ -f manifest.json ] && cp manifest.json www/manifest.json || true
          [ -f assets/icon-192.png ] && cp assets/icon-192.png www/icon-192.png || { [ -f icon-192.png ] && cp icon-192.png www/icon-192.png || true; }
          [ -f assets/icon-512.png ] && cp assets/icon-512.png www/icon-512.png || { [ -f icon-512.png ] && cp icon-512.png www/icon-512.png || true; }
          # index.html registers navigator.serviceWorker at '/sw.js' — the repo file is named
          # sw-1.js, so it must land in www/ as sw.js or registration 404s and the SW never installs.
          [ -f sw-1.js ] && cp sw-1.js www/sw.js || true
          [ -f sw.js ] && cp sw.js www/sw.js || true
          [ -d assets ] && cp -r assets www/assets || true

          # sw.js ships a __SW_CACHE_VERSION__ placeholder in its CACHE_NAME so the
          # app-shell cache is versioned. Stamp in the repo's VERSION file (same file
          # the "Set app version" step already reads) so every version bump busts the
          # old cache automatically — no manual sw.js edits needed on future releases.
          if [ -f www/sw.js ]; then
            SW_VERSION="dev"
            [ -f VERSION ] && SW_VERSION="$(tr -d '[:space:]' < VERSION)"
            sed -i "s/__SW_CACHE_VERSION__/${SW_VERSION}/g" www/sw.js
          fi

          ls -la www

      - name: Add Android platform
        run: npx cap add android


      - name: Wire up Firebase (google-services.json + Gradle plugin)
        # google-services.json sitting at the repo root does NOTHING on its own — the Android
        # Gradle build only picks it up once (a) the file is copied into android/app/ and
        # (b) the com.google.gms.google-services Gradle plugin is applied, which is what
        # actually generates the FCM sender/project config that @capacitor/push-notifications
        # reads at runtime. Without this step, google-services.json was present in the repo
        # but silently unused — push registration would fail with no sender ID.
        run: |
          set -e
          if [ ! -f google-services.json ]; then
            echo "::error::google-services.json not found at repo root"
            exit 1
          fi
          cp google-services.json android/app/google-services.json

          ROOT_GRADLE="android/build.gradle"
          python3 - "$ROOT_GRADLE" <<'PYEOF'
          import sys, re
          path = sys.argv[1]
          with open(path, encoding='utf-8') as f:
              src = f.read()
          classpath_line = "        classpath 'com.google.gms:google-services:4.4.2'\n"
          if 'com.google.gms:google-services' not in src:
              # Capacitor's generated root build.gradle always has a buildscript { dependencies { ... } }
              # block with at least the Android Gradle Plugin classpath already in it.
              new_src, n = re.subn(
                  r'(buildscript\s*\{[^}]*?dependencies\s*\{)',
                  r'\1\n' + classpath_line,
                  src, count=1, flags=re.S
              )
              if n == 0:
                  print("::error::could not find buildscript{ dependencies{ } } block in android/build.gradle")
                  sys.exit(1)
              src = new_src
          with open(path, 'w', encoding='utf-8') as f:
              f.write(src)
          PYEOF
          if ! grep -q 'com.google.gms:google-services' "$ROOT_GRADLE"; then
            echo "::error::google-services classpath was not added to android/build.gradle"
            exit 1
          fi

          APP_GRADLE="android/app/build.gradle"
          python3 - "$APP_GRADLE" <<'PYEOF'
          import sys
          path = sys.argv[1]
          with open(path, encoding='utf-8') as f:
              src = f.read()
          plugin_line = "apply plugin: 'com.google.gms.google-services'\n"
          if 'com.google.gms.google-services' not in src:
              # Applied at the very top, same convention Capacitor itself uses for
              # 'com.android.application' / 'kotlin-android' at the top of this file.
              src = plugin_line + src
          with open(path, 'w', encoding='utf-8') as f:
              f.write(src)
          PYEOF
          if ! grep -q 'com.google.gms.google-services' "$APP_GRADLE"; then
            echo "::error::google-services plugin was not applied in android/app/build.gradle"
            exit 1
          fi

          # Applying the google-services plugin only wires up the config; it does NOT pull in
          # the Firebase Messaging SDK itself. Without this, ChatReplyMessagingService.java
          # (added later in "Inject chat push-reply support") fails to compile: it cannot
          # resolve FirebaseMessagingService / RemoteMessage, and — since it then doesn't
          # properly extend FirebaseMessagingService (which is a Context) — the compiler also
          # rejects passing `this` as a Context ("cannot be converted to Context").
          python3 - "$APP_GRADLE" <<'PYEOF'
          import sys, re
          path = sys.argv[1]
          with open(path, encoding='utf-8') as f:
              src = f.read()

          firebase_deps = (
              "    implementation platform('com.google.firebase:firebase-bom:33.5.1')\n"
              "    implementation 'com.google.firebase:firebase-messaging'\n"
          )
          if 'com.google.firebase:firebase-messaging' not in src:
              new_src, n = re.subn(
                  r'(dependencies\s*\{)',
                  r'\1\n' + firebase_deps,
                  src, count=1
              )
              if n == 0:
                  print("::error::could not find dependencies{ } block in android/app/build.gradle")
                  sys.exit(1)
              src = new_src

          with open(path, 'w', encoding='utf-8') as f:
              f.write(src)
          PYEOF
          if ! grep -q 'com.google.firebase:firebase-messaging' "$APP_GRADLE"; then
            echo "::error::firebase-messaging dependency was not added to android/app/build.gradle"
            exit 1
          fi

      - name: Disable Capacitor's native splash/intro screen (app has its own JS intro)
        # کاپاسیتور به‌طور پیش‌فرض یه اسپلش‌اسکرین بومی می‌سازه (همون که تو اسکرین‌شات دیدی:
        # پس‌زمینه‌ی بنفش برند + آیکون اپ وسط صفحه) که قبل از لود شدن WebView نشون داده
        # می‌شه — این کاملاً جدا از اینتروی خودِ اپ (که با جاوااسکریپت توی app.js ساخته
        # شده) است، پس دوتا اینترو پشت‌سرهم می‌بینی. نکته‌ی مهم: تو API جدید اسپلش‌اسکرین
        # اندروید، اگه آیکون رو صریحاً ست نکنی، خودش از android:icon (همون آیکون اپ) به‌عنوان
        # پیش‌فرض استفاده می‌کنه -- پس صرفاً پاک‌کردن آیتم‌های داخل تم کافی نیست، اون آیکون
        # بازم برمی‌گرده. راه مطمئن: اصلاً نذاریم MainActivity از اون تمِ لانچ استفاده کنه.
        #   ۱) اگه تمِ لانچ یه postSplashScreenTheme مشخص کرده (یعنی "بعد از اسپلش برو سراغ
        #      این تم")، مستقیم خودِ MainActivity رو به همون تمِ واقعی/بی‌اسپلش وصل می‌کنیم --
        #      چون اون تم قطعاً معتبره (خودِ کاپاسیتور بهش رجوع می‌ده).
        #   ۲) اگه این مورد نبود ولی یه تمِ خواهر بدون پسوند Launch/NoActionBarLaunch پیدا
        #      بشه (الگوی استاندارد قالب کاپاسیتور)، به همون وصل می‌کنیم.
        #   ۳) در نهایت، اگه هیچ‌کدوم پیدا نشد، به‌عنوان آخرین راه، خودِ تمِ لانچ رو ویرایش
        #      می‌کنیم: parent اسپلش‌اسکرین و آیتم‌های مربوطش رو حذف می‌کنیم.
        # در هر سه حالت اسمِ خودِ تم عوض نمی‌شه مگه با یه تمِ از قبل موجود و معتبر، پس ریسک
        # "استایل ناموجود" عملاً صفره.
        run: |
          set -e
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          python3 - "$MANIFEST" <<'PYEOF'
          import re, sys

          manifest_path = sys.argv[1]
          with open(manifest_path, encoding='utf-8') as f:
              manifest_src = f.read()

          m = re.search(r'android:name="\.MainActivity"[^>]*?android:theme="@style/([\w.]+)"', manifest_src, re.S)
          if not m:
              m = re.search(r'android:theme="@style/([\w.]+)"[^>]*?android:name="\.MainActivity"', manifest_src, re.S)
          if not m:
              print("::warning::MainActivity theme attribute not found in AndroidManifest.xml -- skipping native splash removal")
              sys.exit(0)
          launch_theme = m.group(1)
          print(f"MainActivity launch theme: {launch_theme}")

          styles_candidates = [
              "android/app/src/main/res/values/styles.xml",
              "android/app/src/main/res/values-night/styles.xml",
          ]

          def find_style_block(src, name):
              pat = re.compile(r'<style\s+name="' + re.escape(name) + r'"[^>]*>.*?</style>', re.S)
              mm = pat.search(src)
              return mm

          def style_exists(src, name):
              return re.search(r'<style\s+name="' + re.escape(name) + r'"[^>\s]*[^>]*>', src) is not None

          redirect_target = None
          styles_path_used = None
          styles_src = None
          for styles_path in styles_candidates:
              try:
                  with open(styles_path, encoding='utf-8') as f:
                      src = f.read()
              except FileNotFoundError:
                  continue
              block = find_style_block(src, launch_theme)
              if not block:
                  continue
              styles_path_used = styles_path
              styles_src = src
              body = block.group(0)

              # Strategy 1: an explicit postSplashScreenTheme inside the launch style is the
              # most reliable signal -- Capacitor itself must point it at a real, working theme.
              pm = re.search(r'<item\s+name="postSplashScreenTheme">\s*@style/([\w.]+)\s*</item>', body)
              if pm:
                  redirect_target = pm.group(1)
                  print(f"Found postSplashScreenTheme -> redirecting MainActivity straight to '{redirect_target}'")
              break

          # Strategy 2: standard Capacitor naming convention is "<Base>Launch" / "<Base>.Launch"
          # sitting next to its non-launch sibling "<Base>" -- try stripping a trailing
          # "Launch" (with an optional preceding '.') and see if that style actually exists.
          if redirect_target is None and styles_src is not None:
              candidate = re.sub(r'\.?Launch$', '', launch_theme)
              if candidate and candidate != launch_theme and style_exists(styles_src, candidate):
                  redirect_target = candidate
                  print(f"No postSplashScreenTheme found -- derived sibling theme '{redirect_target}' exists, redirecting to it")

          if redirect_target is not None:
              new_manifest_src = manifest_src.replace(
                  f'android:theme="@style/{launch_theme}"',
                  f'android:theme="@style/{redirect_target}"',
              )
              if new_manifest_src == manifest_src:
                  print("::warning::redirect target computed but the theme string was not found verbatim in the manifest -- no change made")
              else:
                  with open(manifest_path, 'w', encoding='utf-8') as f:
                      f.write(new_manifest_src)
                  print(f"MainActivity now uses '@style/{redirect_target}' directly -- native splash bypassed entirely")
              sys.exit(0)

          # Strategy 3 (last resort): no safe redirect target found, so edit the launch style
          # itself in place -- strip the SplashScreen parent and any splash-specific items.
          if styles_path_used is None:
              print("::warning::could not locate the launch theme's <style> block in any styles.xml -- native splash may still show")
              sys.exit(0)

          block = find_style_block(styles_src, launch_theme)
          open_tag_m = re.match(r'<style\s+name="' + re.escape(launch_theme) + r'"([^>]*)>', block.group(0))
          attrs = open_tag_m.group(1)
          new_attrs = re.sub(r'\s+parent="Theme\.SplashScreen[^"]*"', ' parent="Theme.AppCompat.DayNight.NoActionBar"', attrs)
          body_only = block.group(0)[open_tag_m.end():-len('</style>')]
          new_body = re.sub(r'\s*<item\s+name="[^"]*[Ss]plash[Ss]creen[^"]*"[^>]*>.*?</item>', '', body_only, flags=re.S)
          new_body = re.sub(r'\s*<item\s+name="postSplashScreenTheme"[^>]*>.*?</item>', '', new_body, flags=re.S)
          new_body = re.sub(r'\s*<item\s+name="[^"]*[Ww]indow[Bb]ackground"[^>]*>\s*@drawable/splash\s*</item>', '', new_body, flags=re.S)
          new_block = f'<style name="{launch_theme}"{new_attrs}>{new_body}</style>'

          styles_src = styles_src[:block.start()] + new_block + styles_src[block.end():]
          with open(styles_path_used, 'w', encoding='utf-8') as f:
              f.write(styles_src)
          print(f"Fallback: stripped native splash-screen items directly from style '{launch_theme}' in {styles_path_used}")
          PYEOF

          if [ -f capacitor.config.json ]; then
            python3 - <<'PYEOF'
          import json

          path = "capacitor.config.json"
          with open(path, encoding='utf-8') as f:
              cfg = json.load(f)

          plugins = cfg.get('plugins', {})
          if 'SplashScreen' in plugins:
              plugins['SplashScreen']['launchShowDuration'] = 0
              plugins['SplashScreen']['launchAutoHide'] = True
              cfg['plugins'] = plugins
              with open(path, 'w', encoding='utf-8') as f:
                  json.dump(cfg, f, ensure_ascii=False, indent=2)
              print("capacitor.config.json: SplashScreen launchShowDuration set to 0")
          else:
              print("capacitor.config.json has no SplashScreen plugin block (nothing to patch there)")
          PYEOF
          fi

      - name: Set app version (versionCode/versionName) from VERSION file
        # مایکت (و گوگل‌پلی) رد می‌کنن اگه ورژن آپلودی از آخرین نسخه‌ی تأییدشده بالاتر
        # نباشه. تا قبل از این، این ورک‌فلو اصلاً دست به versionCode/versionName نمی‌زد،
        # پس هر بار همون مقدار پیش‌فرضِ Capacitor (versionCode=1, versionName="1.0")
        # می‌موند — دقیقاً برای همین هر بیلد جدید رد می‌شد (حتی وقتی فایل VERSION تو ریپو
        # عوض شده بود، چون هیچ‌کس این عدد رو واقعاً به build.gradle نمی‌رسوند).
        # از این به بعد: versionName = دقیقاً همون متن فایل VERSION (مثلاً "1.5")، و
        # versionCode = major*10000 + minor*100 + patch، که تا وقتی VERSION رو ببری بالا
        # همیشه از قبلی بزرگ‌تره. اگه مایکت بازم رد کرد، دقیق عددی که تو پنلش به‌عنوان
        # «آخرین نسخه‌ی پذیرفته‌شده» نشون می‌ده رو بگو تا offset این محاسبه رو باهاش هماهنگ کنم.
        run: |
          APP_GRADLE="android/app/build.gradle"
          python3 - "$APP_GRADLE" <<'PYEOF'
          import sys, re
          path = sys.argv[1]
          with open('VERSION', encoding='utf-8') as f:
              version_name = f.read().strip()
          parts = (version_name.split('.') + ['0','0'])[:3]
          major, minor, patch = (int(p) if p.isdigit() else 0 for p in parts)
          version_code = major*10000 + minor*100 + patch
          with open(path, encoding='utf-8') as f:
              src = f.read()
          new_src, n1 = re.subn(r'versionCode\s+\d+', f'versionCode {version_code}', src, count=1)
          if n1 == 0:
              print(f"::error::could not find a 'versionCode' line in {path}")
              sys.exit(1)
          new_src, n2 = re.subn(r'versionName\s+"[^"]*"', f'versionName "{version_name}"', new_src, count=1)
          if n2 == 0:
              print(f"::error::could not find a 'versionName' line in {path}")
              sys.exit(1)
          with open(path, 'w', encoding='utf-8') as f:
              f.write(new_src)
          print(f"Set versionName={version_name!r}, versionCode={version_code}")
          PYEOF

      - name: Generate app icon manually (legacy + adaptive, from repo-root icon)
        # Builds every launcher icon file by hand with ImageMagick instead of relying on
        # @capacitor/assets' own file discovery. Produces:
        #  - legacy square + round ic_launcher.png per density (mdpi..xxxhdpi), for API <26
        #  - adaptive ic_launcher_foreground.png per density, icon scaled into the ~66%
        #    "safe zone" so launchers that mask/crop the outer edge don't clip it
        #  - a solid brand-purple background color + mipmap-anydpi-v26 XML wiring both
        #    together for API 26+ adaptive icons
        run: |
          set -e
          sudo apt-get update -y && sudo apt-get install -y imagemagick
          SRC="$ICON_SRC"
          identify "$SRC"

          RES_BASE="android/app/src/main/res"
          BG_HEX="4338CA"

          declare -A LEGACY_SIZES=( [mdpi]=48 [hdpi]=72 [xhdpi]=96 [xxhdpi]=144 [xxxhdpi]=192 )
          declare -A FOREGROUND_SIZES=( [mdpi]=108 [hdpi]=162 [xhdpi]=216 [xxhdpi]=324 [xxxhdpi]=432 )

          for density in "${!LEGACY_SIZES[@]}"; do
            size=${LEGACY_SIZES[$density]}
            dir="$RES_BASE/mipmap-$density"
            mkdir -p "$dir"
            convert "$SRC" -resize ${size}x${size}^ -gravity center -extent ${size}x${size} "$dir/ic_launcher.png"
            convert "$dir/ic_launcher.png" \( +clone -alpha extract -fill black -colorize 100% -fill white -draw "circle $((size/2)),$((size/2)) $((size/2)),0" \) -alpha off -compose CopyOpacity -composite "$dir/ic_launcher_round.png"
          done

          for density in "${!FOREGROUND_SIZES[@]}"; do
            size=${FOREGROUND_SIZES[$density]}
            dir="$RES_BASE/mipmap-$density"
            mkdir -p "$dir"
            inner=$(( size * 66 / 100 ))
            convert -size ${size}x${size} xc:none \( "$SRC" -resize ${inner}x${inner} \) -gravity center -composite "$dir/ic_launcher_foreground.png"
          done

          mkdir -p "$RES_BASE/values"
          # Capacitor's default android template already ships its own
          # ic_launcher_background.xml defining the same @color/ic_launcher_background —
          # remove it first so we don't end up with two files declaring the same
          # resource name (which Gradle rejects as a duplicate resource merge error).
          rm -f "$RES_BASE/values/ic_launcher_background.xml"
          cat > "$RES_BASE/values/ic_launcher_background_color.xml" <<XMLEOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#$BG_HEX</color>
          </resources>
          XMLEOF

          mkdir -p "$RES_BASE/mipmap-anydpi-v26"
          cat > "$RES_BASE/mipmap-anydpi-v26/ic_launcher.xml" <<XMLEOF
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          XMLEOF
          cp "$RES_BASE/mipmap-anydpi-v26/ic_launcher.xml" "$RES_BASE/mipmap-anydpi-v26/ic_launcher_round.xml"

          echo "Generated launcher icons manually from $SRC:"
          find "$RES_BASE" -iname "ic_launcher*"

      - name: Generate notification small icon (ic_stat_icon)
        run: |
          declare -A sizes=( [mdpi]=24 [hdpi]=36 [xhdpi]=48 [xxhdpi]=72 [xxxhdpi]=96 )
          for density in "${!sizes[@]}"; do
            size="${sizes[$density]}"
            dir="android/app/src/main/res/drawable-${density}"
            mkdir -p "$dir"
            # Simple white bell silhouette on a transparent background — Android notification
            # icons must be a flat white/transparent shape (the OS colors it automatically).
            convert -size ${size}x${size} xc:transparent \
              -fill white -draw "circle $((size/2)),$((size/2)) $((size/2)),$((size/10))" \
              "$dir/ic_stat_icon.png"
          done
          # Fallback copy into the density-less drawable/ folder some plugin versions look at.
          mkdir -p android/app/src/main/res/drawable
          cp android/app/src/main/res/drawable-xhdpi/ic_stat_icon.png android/app/src/main/res/drawable/ic_stat_icon.png

      - name: Inject Myket billing plugin (native-billing/)
        run: |
          set -e
          APP_ID="com.mahdihd648.dreamlifeapp"
          APP_PATH="${APP_ID//./\/}"
          JAVA_DIR="android/app/src/main/java/${APP_PATH}"
          BILLING_DIR="${JAVA_DIR}/billing"

          # 1) AIDL interface Myket's billing service implements
          mkdir -p android/app/src/main/aidl/com/android/vending/billing
          cp native-billing/aidl/com/android/vending/billing/IInAppBillingService.aidl \
             android/app/src/main/aidl/com/android/vending/billing/IInAppBillingService.aidl

          # 2) The plugin itself, into the app's own package under a "billing" sub-package
          mkdir -p "$BILLING_DIR"
          cp native-billing/MarketBillingPlugin.java "$BILLING_DIR/MarketBillingPlugin.java"
          sed -i "s/^package .*billing;/package ${APP_ID}.billing;/" "$BILLING_DIR/MarketBillingPlugin.java"

          # 3) Register the plugin + import in MainActivity — rewrite the file fully instead
          #    of pattern-matching Capacitor's generated content, since its exact formatting
          #    (e.g. where the closing brace lands) isn't guaranteed across Capacitor versions.
          #    A silent regex/str-replace non-match here previously left the plugin unregistered
          #    with NO build error — the APK built and signed fine, but MarketBilling was never
          #    exposed to JS, so the in-app purchase button silently did nothing on-device.
          #    NOTE: also registers TaskWidgetPlugin (checklist + day-progress home-screen
          #    widgets) here, for the same reason — it's a native-only class, not an npm
          #    package, so Capacitor's autodiscovery won't find it on its own.
          MAIN_ACTIVITY="${JAVA_DIR}/MainActivity.java"
          cat > "$MAIN_ACTIVITY" <<JAVAEOF
          package ${APP_ID};

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          import ${APP_ID}.billing.MarketBillingPlugin;
          import ${APP_ID}.widget.TaskWidgetPlugin;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(MarketBillingPlugin.class);
                  registerPlugin(TaskWidgetPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVAEOF

          # Fail loudly instead of shipping a silently-broken APK again.
          if ! grep -q "registerPlugin(MarketBillingPlugin.class)" "$MAIN_ACTIVITY"; then
            echo "::error::MarketBillingPlugin was not registered in MainActivity.java"
            exit 1
          fi
          if ! grep -q "registerPlugin(TaskWidgetPlugin.class)" "$MAIN_ACTIVITY"; then
            echo "::error::TaskWidgetPlugin was not registered in MainActivity.java"
            exit 1
          fi

          # 4) Manifest: permission + package visibility <queries> for Myket's classic billing
          #    service (package visibility is required on Android 11+ to see the store app at all)
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          python3 - "$MANIFEST" <<'PYEOF'
          import sys, re
          path = sys.argv[1]
          with open(path, encoding='utf-8') as f:
              src = f.read()

          extra_permissions = (
              '    <uses-permission android:name="ir.mservices.market.BILLING" />\n'
          )
          if 'ir.mservices.market.BILLING' not in src:
              src = re.sub(r'(<manifest[^>]*>\n)', r'\1' + extra_permissions, src, count=1)

          # NOTE: Myket's own docs list BOTH the <package> entry AND this <intent> entry
          # together — a previous version of this step only added <package>, which is not
          # what's documented, so replicate the exact block Myket ships.
          queries_block = (
              '    <queries>\n'
              '        <package android:name="ir.mservices.market" />\n'
              '        <intent>\n'
              '            <action android:name="ir.mservices.market.InAppBillingService.BIND" />\n'
              '            <data android:mimeType="*/*" />\n'
              '        </intent>\n'
              '    </queries>\n'
          )
          if '<queries>' not in src:
              src = src.replace('<application', queries_block + '    <application', 1)

          with open(path, 'w', encoding='utf-8') as f:
              f.write(src)
          PYEOF

          # Fail loudly instead of shipping an APK where Myket's billing service is
          # invisible to bindService() on Android 11+ (package-visibility / <queries>).
          # This exact silent-failure class (build succeeds, APK signs fine, button
          # does nothing on-device) is what previously bit MainActivity registration —
          # same guard, applied here too.
          if ! grep -q 'ir.mservices.market.BILLING' "$MANIFEST"; then
            echo "::error::Myket BILLING <uses-permission> was not added to AndroidManifest.xml"
            exit 1
          fi
          if ! grep -q 'ir.mservices.market.InAppBillingService.BIND' "$MANIFEST"; then
            echo "::error::Myket <queries> block was not added to AndroidManifest.xml — bindService() to Myket's billing service WILL silently fail with 'no matching service found' on Android 11+ (see MarketBillingPlugin.ensureBound() logs). Check whether some other plugin already inserted an unrelated <queries> block before this step ran, since the script skips insertion whenever any <queries> tag is already present."
            exit 1
          fi

          # 5) Enable AIDL compilation. AGP 8+ turns this OFF by default, so without it the
          #    IInAppBillingService.aidl file from step 1 is silently ignored and the plugin
          #    fails to compile ("cannot find symbol: IInAppBillingService").
          APP_GRADLE="android/app/build.gradle"
          python3 - "$APP_GRADLE" <<'PYEOF'
          import sys, re
          path = sys.argv[1]
          with open(path, encoding='utf-8') as f:
              src = f.read()
          if 'buildFeatures' in src:
              if 'aidl' not in src:
                  src = re.sub(r'buildFeatures\s*\{', 'buildFeatures {\n        aidl true', src, count=1)
          else:
              src = re.sub(
                  r'(android\s*\{)',
                  r'\1\n    buildFeatures {\n        aidl true\n    }',
                  src, count=1
              )
          with open(path, 'w', encoding='utf-8') as f:
              f.write(src)
          PYEOF

          # Same class of silent failure as above: if neither branch of the regex matched
          # (e.g. build.gradle isn't formatted the way these regexes expect), aidl
          # compilation stays off and MarketBillingPlugin fails to compile with
          # "cannot find symbol: IInAppBillingService" — verify the flag actually landed.
          if ! grep -q 'aidl true' "$APP_GRADLE"; then
            echo "::error::'aidl true' was not added to android/app/build.gradle — IInAppBillingService.aidl will be silently ignored and MarketBillingPlugin will fail to compile."
            exit 1
          fi

      - name: Create Android notification channel for chat push messages
        # Android 8+ (API 26+) silently drops any notification whose channel_id was never
        # created on-device — the Worker's FCM payload (see /notify-new-message) sets
        # android.notification.channel_id = "chat_messages", so without this the whole push
        # pipeline would build, deploy, and run with no error anywhere, but no notification
        # would ever actually appear. Registering the channel once in MainActivity.onCreate
        # (createNotificationChannel is itself idempotent — safe to call every launch) is the
        # standard fix.
        run: |
          set -e
          APP_ID="com.mahdihd648.dreamlifeapp"
          APP_PATH="${APP_ID//./\/}"
          MAIN_ACTIVITY="android/app/src/main/java/${APP_PATH}/MainActivity.java"
          python3 - "$MAIN_ACTIVITY" <<'PYEOF'
          import sys, re
          path = sys.argv[1]
          with open(path, encoding='utf-8') as f:
              src = f.read()

          if 'chat_messages' in src:
              sys.exit(0)  # already patched

          imports_to_add = (
              "import android.app.NotificationChannel;\n"
              "import android.app.NotificationManager;\n"
              "import android.os.Build;\n"
          )
          # Insert new imports right after the package line.
          src, n = re.subn(r'(package [^\n]+;\n)', r'\1' + '\n' + imports_to_add, src, count=1)
          if n == 0:
              print("::error::could not find package declaration in MainActivity.java")
              sys.exit(1)

          channel_code = (
              "\n"
              "        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {\n"
              "            NotificationChannel channel = new NotificationChannel(\n"
              "                \"chat_messages\", \"پیام‌های چت عمومی\", NotificationManager.IMPORTANCE_HIGH);\n"
              "            NotificationManager nm = getSystemService(NotificationManager.class);\n"
              "            if (nm != null) nm.createNotificationChannel(channel);\n"
              "        }\n"
          )
          # Runs right after super.onCreate(...) inside onCreate, alongside the plugin
          # registrations this same file already sets up above.
          new_src, n2 = re.subn(
              r'(super\.onCreate\(savedInstanceState\);\n)',
              r'\1' + channel_code,
              src, count=1
          )
          if n2 == 0:
              print("::error::could not find super.onCreate(savedInstanceState) in MainActivity.java")
              sys.exit(1)

          with open(path, 'w', encoding='utf-8') as f:
              f.write(new_src)
          PYEOF
          if ! grep -q 'chat_messages' "$MAIN_ACTIVITY"; then
            echo "::error::chat_messages notification channel was not registered in MainActivity.java"
            exit 1
          fi

      - name: Inject chat push-reply support (data-only push + notification RemoteInput + AuthBridge)
        # داستان کامل: /notify-new-message تو worker حالا یه پیام FCM «data-only» می‌فرسته
        # (نه notification معمولی) — یعنی سیستم‌عامل دیگه خودش نوتیف رو نمی‌سازه، و
        # هر پیام از ChatReplyMessagingService (زیر) رد می‌شه. اونجا خودمون نوتیف رو با
        # یه Action شامل RemoteInput («ریپلای مستقیم») می‌سازیم. وقتی کاربر همون‌جا
        # تایپ و ارسال می‌کنه، ChatReplyReceiver (بدون باز کردنِ اپ) از AuthBridgePrefs
        # (که app.js با پلاگین AuthBridge هر بار سشن عوض می‌شه پر می‌کنه — ببین
        # pushAuthSessionToNative تو app.js) توکن رو می‌خونه، لازم شد رفرشش می‌کنه، و
        # مستقیم یه INSERT رو جدول messages به Supabase می‌زنه.
        # پیش‌نیاز مهم: چون یه FirebaseMessagingService دیگه (خودِ @capacitor/push-notifications)
        # از قبل تو مانیفست ثبت شده و FCM فقط یکی رو صدا می‌زنه، سرویسِ خودِ پلاگین رو
        # صریحاً حذف (tools:node="remove") و با سرویسِ خودمون جایگزین می‌کنیم.
        run: |
          set -e
          APP_ID="com.mahdihd648.dreamlifeapp"
          APP_PATH="${APP_ID//./\/}"
          JAVA_DIR="android/app/src/main/java/${APP_PATH}"
          AUTH_DIR="${JAVA_DIR}/auth"
          mkdir -p "$AUTH_DIR"

          # ---- AuthBridgePlugin.java (JS <-> native: کپیِ توکنِ سشن + پرچمِ «باز کردنِ چت») ----
          cat > "$AUTH_DIR/AuthBridgePlugin.java" <<JAVAEOF
          package ${APP_ID}.auth;

          import android.content.Context;
          import android.content.SharedPreferences;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "AuthBridge")
          public class AuthBridgePlugin extends Plugin {
              public static final String PREFS_NAME = "AuthBridgePrefs";
              public static final String KEY_ACCESS_TOKEN = "access_token";
              public static final String KEY_REFRESH_TOKEN = "refresh_token";
              public static final String KEY_EXPIRES_AT = "expires_at";
              public static final String KEY_USER_ID = "user_id";
              public static final String KEY_USERNAME = "username";
              public static final String KEY_PENDING_OPEN_CHAT = "pending_open_chat";

              private SharedPreferences prefs() {
                  return getContext().getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE);
              }

              @PluginMethod
              public void saveSession(PluginCall call) {
                  prefs().edit()
                      .putString(KEY_ACCESS_TOKEN, call.getString("accessToken", ""))
                      .putString(KEY_REFRESH_TOKEN, call.getString("refreshToken", ""))
                      .putString(KEY_EXPIRES_AT, call.getString("expiresAt", "0"))
                      .putString(KEY_USER_ID, call.getString("userId", ""))
                      .putString(KEY_USERNAME, call.getString("username", ""))
                      .apply();
                  call.resolve();
              }

              @PluginMethod
              public void clearSession(PluginCall call) {
                  // پرچمِ pending_open_chat عمداً پاک نمی‌شه — لاگ‌اوت نباید یه تپِ نوتیفِ
                  // قبلی رو که هنوز مصرف نشده گم کنه.
                  prefs().edit()
                      .remove(KEY_ACCESS_TOKEN).remove(KEY_REFRESH_TOKEN)
                      .remove(KEY_EXPIRES_AT).remove(KEY_USER_ID).remove(KEY_USERNAME)
                      .apply();
                  call.resolve();
              }

              // MainActivity وقتی از رویِ تپِ نوتیف باز می‌شه این پرچم رو ست می‌کنه (چون
              // اون لحظه ممکنه WebView/JS هنوز کامل لود نشده باشه)؛ app.js موقعِ start-up
              // و هر resume این متد رو صدا می‌زنه تا اگه پرچم ست بود بره تبِ چت — همون
              // الگویی که TaskWidgetPlugin.getPendingToggles برای ویجت استفاده می‌کنه.
              @PluginMethod
              public void getPendingOpenChat(PluginCall call) {
                  boolean pending = prefs().getBoolean(KEY_PENDING_OPEN_CHAT, false);
                  if (pending) prefs().edit().remove(KEY_PENDING_OPEN_CHAT).apply();
                  JSObject ret = new JSObject();
                  ret.put("pending", pending);
                  call.resolve(ret);
              }
          }
          JAVAEOF

          # ---- ChatReplyMessagingService.java (می‌سازه/نشون می‌ده نوتیفِ قابل‌ریپلای) ----
          cat > "$AUTH_DIR/ChatReplyMessagingService.java" <<JAVAEOF
          package ${APP_ID}.auth;

          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import androidx.core.app.NotificationCompat;
          import androidx.core.app.RemoteInput;
          import com.google.firebase.messaging.FirebaseMessagingService;
          import com.google.firebase.messaging.RemoteMessage;
          import ${APP_ID}.MainActivity;
          import ${APP_ID}.R;
          import java.util.Map;

          public class ChatReplyMessagingService extends FirebaseMessagingService {
              public static final int NOTIF_ID = 5001;
              public static final String ACTION_REPLY = "${APP_ID}.ACTION_CHAT_REPLY";
              public static final String KEY_REPLY_TEXT = "chat_reply_text";

              @Override
              public void onMessageReceived(RemoteMessage message) {
                  Map<String, String> data = message.getData();
                  if (data == null || !"chat_message".equals(data.get("type"))) return;
                  String title = data.containsKey("title") ? data.get("title") : "چت عمومی";
                  String body = data.containsKey("body") ? data.get("body") : "یه پیام جدید فرستاد";
                  showReplyableNotification(this, title, body);
              }

              static void showReplyableNotification(Context context, String title, String body) {
                  RemoteInput remoteInput = new RemoteInput.Builder(KEY_REPLY_TEXT)
                          .setLabel("پاسخت رو بنویس...")
                          .build();

                  Intent replyIntent = new Intent(context, ChatReplyReceiver.class);
                  replyIntent.setAction(ACTION_REPLY);
                  // FLAG_MUTABLE اجباریه — سیستم باید بتونه نتیجه‌ی RemoteInput رو به این
                  // Intent اضافه کنه؛ با FLAG_IMMUTABLE متنِ تایپ‌شده هیچ‌وقت به ما نمی‌رسه.
                  PendingIntent replyPendingIntent = PendingIntent.getBroadcast(
                          context, NOTIF_ID, replyIntent,
                          PendingIntent.FLAG_MUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);

                  NotificationCompat.Action replyAction =
                          new NotificationCompat.Action.Builder(
                                  android.R.drawable.ic_menu_send, "پاسخ", replyPendingIntent)
                                  .addRemoteInput(remoteInput)
                                  .setAllowGeneratedReplies(true)
                                  .build();

                  Intent tapIntent = new Intent(context, MainActivity.class);
                  tapIntent.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  tapIntent.putExtra("openChat", true);
                  PendingIntent tapPendingIntent = PendingIntent.getActivity(
                          context, NOTIF_ID, tapIntent,
                          PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);

                  NotificationCompat.Builder builder = new NotificationCompat.Builder(context, "chat_messages")
                          .setSmallIcon(R.drawable.ic_stat_icon)
                          .setContentTitle(title)
                          .setContentText(body)
                          .setAutoCancel(true)
                          .setPriority(NotificationCompat.PRIORITY_HIGH)
                          .setContentIntent(tapPendingIntent)
                          .addAction(replyAction);

                  NotificationManager nm = (NotificationManager) context.getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm != null) nm.notify(NOTIF_ID, builder.build());
              }
          }
          JAVAEOF

          # ---- ChatReplyReceiver.java (دستِ ریپلای — بدونِ باز کردنِ اپ اجرا می‌شه) ----
          cat > "$AUTH_DIR/ChatReplyReceiver.java" <<JAVAEOF
          package ${APP_ID}.auth;

          import android.app.NotificationManager;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Bundle;
          import androidx.core.app.NotificationCompat;
          import androidx.core.app.RemoteInput;
          import ${APP_ID}.R;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;
          import java.util.Scanner;
          import org.json.JSONObject;

          public class ChatReplyReceiver extends BroadcastReceiver {
              // همون مقادیرِ SUPABASE_URL / SUPABASE_ANON_KEY که بالای app.js تعریف شدن —
              // چون این کد جدا از WebView اجرا می‌شه، نمی‌تونه از اونجا بخونتشون.
              private static final String SUPABASE_URL = "https://elrctpacwmsplxkbhlur.supabase.co";
              private static final String SUPABASE_ANON_KEY = "sb_publishable_W0gxlYFD1uWfn3LGn4MvAA_qJUlJ5xs";

              @Override
              public void onReceive(Context context, Intent intent) {
                  if (!ChatReplyMessagingService.ACTION_REPLY.equals(intent.getAction())) return;

                  Bundle results = RemoteInput.getResultsFromIntent(intent);
                  CharSequence replyText = results != null
                          ? results.getCharSequence(ChatReplyMessagingService.KEY_REPLY_TEXT)
                          : null;
                  if (replyText == null || replyText.toString().trim().isEmpty()) return;
                  final String content = replyText.toString().trim();

                  // onReceive باید سریع برگرده؛ کارِ شبکه‌ای (و بالقوه رفرشِ توکن) رو تو یه
                  // ترد جدا انجام می‌دیم و با goAsync به سیستم می‌گیم صبر کنه تا finish().
                  final PendingResult pendingResult = goAsync();
                  final Context appContext = context.getApplicationContext();
                  new Thread(new Runnable() {
                      @Override public void run() {
                          try { sendReply(appContext, content); }
                          catch (Exception e) { showResultNotification(appContext, false, "ارسال نشد — دوباره از داخل اپ امتحان کن."); }
                          finally { pendingResult.finish(); }
                      }
                  }).start();
              }

              private void sendReply(Context context, String content) throws Exception {
                  SharedPreferences prefs = context.getSharedPreferences(AuthBridgePlugin.PREFS_NAME, Context.MODE_PRIVATE);
                  String accessToken = prefs.getString(AuthBridgePlugin.KEY_ACCESS_TOKEN, "");
                  String refreshToken = prefs.getString(AuthBridgePlugin.KEY_REFRESH_TOKEN, "");
                  String userId = prefs.getString(AuthBridgePlugin.KEY_USER_ID, "");
                  String username = prefs.getString(AuthBridgePlugin.KEY_USERNAME, "");
                  long expiresAt = parseLongSafe(prefs.getString(AuthBridgePlugin.KEY_EXPIRES_AT, "0"));

                  if (accessToken.isEmpty() || userId.isEmpty()) {
                      showResultNotification(context, false, "برای ریپلای از تو نوتیف، یه‌بار اپ رو باز کن و وارد شو.");
                      return;
                  }

                  long nowSec = System.currentTimeMillis() / 1000L;
                  // ۶۰ ثانیه حاشیه‌ی اطمینان تا وسطِ درخواستِ اینسرت منقضی نشه.
                  if (expiresAt > 0 && nowSec >= expiresAt - 60 && !refreshToken.isEmpty()) {
                      String[] refreshed = refreshAccessToken(refreshToken);
                      if (refreshed != null) {
                          accessToken = refreshed[0];
                          prefs.edit()
                              .putString(AuthBridgePlugin.KEY_ACCESS_TOKEN, refreshed[0])
                              .putString(AuthBridgePlugin.KEY_REFRESH_TOKEN, refreshed[1])
                              .putString(AuthBridgePlugin.KEY_EXPIRES_AT, refreshed[2])
                              .apply();
                      }
                      // اگه رفرش هم شکست خورد، همون توکنِ (احتمالاً منقضی‌شده‌ی) قبلی رو امتحان
                      // می‌کنیم — بدتر از این نمی‌شه؛ Supabase خودش با 401 ردش می‌کنه.
                  }

                  JSONObject body = new JSONObject();
                  body.put("user_id", userId);
                  body.put("username", username);
                  body.put("content", content);

                  URL url = new URL(SUPABASE_URL + "/rest/v1/messages");
                  HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                  conn.setRequestMethod("POST");
                  conn.setDoOutput(true);
                  conn.setConnectTimeout(15000);
                  conn.setReadTimeout(15000);
                  conn.setRequestProperty("apikey", SUPABASE_ANON_KEY);
                  conn.setRequestProperty("Authorization", "Bearer " + accessToken);
                  conn.setRequestProperty("Content-Type", "application/json");
                  conn.setRequestProperty("Prefer", "return=minimal");
                  OutputStream os = conn.getOutputStream();
                  os.write(body.toString().getBytes(StandardCharsets.UTF_8));
                  os.close();
                  int status = conn.getResponseCode();
                  conn.disconnect();

                  if (status >= 200 && status < 300) {
                      showResultNotification(context, true, content);
                  } else {
                      showResultNotification(context, false, "ارسال نشد — دوباره از داخل اپ امتحان کن.");
                  }
              }

              /** رفرشِ access_token با refresh_token. برمی‌گردونه {accessToken, refreshToken, expiresAt} یا null. */
              private String[] refreshAccessToken(String refreshToken) {
                  HttpURLConnection conn = null;
                  try {
                      URL url = new URL(SUPABASE_URL + "/auth/v1/token?grant_type=refresh_token");
                      conn = (HttpURLConnection) url.openConnection();
                      conn.setRequestMethod("POST");
                      conn.setDoOutput(true);
                      conn.setConnectTimeout(15000);
                      conn.setReadTimeout(15000);
                      conn.setRequestProperty("apikey", SUPABASE_ANON_KEY);
                      conn.setRequestProperty("Content-Type", "application/json");
                      JSONObject body = new JSONObject();
                      body.put("refresh_token", refreshToken);
                      OutputStream os = conn.getOutputStream();
                      os.write(body.toString().getBytes(StandardCharsets.UTF_8));
                      os.close();
                      int status = conn.getResponseCode();
                      if (status < 200 || status >= 300) return null;
                      InputStream is = conn.getInputStream();
                      Scanner scanner = new Scanner(is, "UTF-8").useDelimiter("\\\\A");
                      String responseBody = scanner.hasNext() ? scanner.next() : "";
                      JSONObject json = new JSONObject(responseBody);
                      String newAccess = json.optString("access_token", "");
                      String newRefresh = json.optString("refresh_token", refreshToken);
                      long expiresAtNew = json.optLong("expires_at", 0);
                      if (newAccess.isEmpty()) return null;
                      return new String[]{newAccess, newRefresh, String.valueOf(expiresAtNew)};
                  } catch (Exception e) {
                      return null;
                  } finally {
                      if (conn != null) conn.disconnect();
                  }
              }

              private long parseLongSafe(String s) {
                  try { return Long.parseLong(s); } catch (Exception e) { return 0; }
              }

              /** بعد از تمومِ کار (موفق یا شکست)، نوتیف رو آپدیت می‌کنه — هم اسپینرِ «در حالِ
               *  ارسال» بسته بشه، هم کاربر مطمئن بشه پیامش واقعاً رفت یا نرفت. */
              private void showResultNotification(Context context, boolean success, String message) {
                  NotificationCompat.Builder builder = new NotificationCompat.Builder(context, "chat_messages")
                          .setSmallIcon(R.drawable.ic_stat_icon)
                          .setContentTitle(success ? "پیامت ارسال شد" : "ارسال نشد")
                          .setContentText(message)
                          .setAutoCancel(true)
                          .setPriority(NotificationCompat.PRIORITY_DEFAULT);
                  NotificationManager nm = (NotificationManager) context.getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm != null) nm.notify(ChatReplyMessagingService.NOTIF_ID, builder.build());
              }
          }
          JAVAEOF

          # ---- MainActivity.java: بازنویسیِ کامل (همون الگویِ خودِ استپِ Myket بالاتر) تا
          #      هم پلاگین‌های قبلی (Billing/Widget) هم چنل‌سازیِ نوتیف هم رجیستریِ AuthBridge
          #      هم دستگیره‌ی «تپِ نوتیف → یادداشتِ pending_open_chat» همه با هم و بدون
          #      برخوردِ regex سرِ جاشون باشن.
          MAIN_ACTIVITY="${JAVA_DIR}/MainActivity.java"
          cat > "$MAIN_ACTIVITY" <<JAVAEOF
          package ${APP_ID};

          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Build;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          import ${APP_ID}.billing.MarketBillingPlugin;
          import ${APP_ID}.widget.TaskWidgetPlugin;
          import ${APP_ID}.auth.AuthBridgePlugin;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(MarketBillingPlugin.class);
                  registerPlugin(TaskWidgetPlugin.class);
                  registerPlugin(AuthBridgePlugin.class);
                  super.onCreate(savedInstanceState);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(
                          "chat_messages", "پیام‌های چت عمومی", NotificationManager.IMPORTANCE_HIGH);
                      NotificationManager nm = getSystemService(NotificationManager.class);
                      if (nm != null) nm.createNotificationChannel(channel);
                  }

                  handleOpenChatIntent(getIntent());
              }

              @Override
              public void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  handleOpenChatIntent(intent);
              }

              // تپ‌کردن روی بدنه‌ی نوتیفِ چت (نه دکمه‌ی ریپلای) از اینجا رد می‌شه —
              // ChatReplyMessagingService.showReplyableNotification همین اکسترا رو ست کرده.
              // چون این لحظه ممکنه WebView/JS هنوز کامل لود نشده باشه، مستقیم JS صدا
              // نمی‌زنیم؛ فقط یه پرچم تو SharedPreferences می‌ذاریم — app.js موقعِ
              // start-up/resume با AuthBridge.getPendingOpenChat() این پرچم رو می‌خونه.
              private void handleOpenChatIntent(Intent intent) {
                  if (intent == null || !intent.getBooleanExtra("openChat", false)) return;
                  intent.removeExtra("openChat");
                  SharedPreferences prefs = getSharedPreferences(AuthBridgePlugin.PREFS_NAME, MODE_PRIVATE);
                  prefs.edit().putBoolean(AuthBridgePlugin.KEY_PENDING_OPEN_CHAT, true).apply();
              }
          }
          JAVAEOF

          if ! grep -q 'registerPlugin(AuthBridgePlugin.class)' "$MAIN_ACTIVITY"; then
            echo "::error::AuthBridgePlugin was not registered in MainActivity.java"
            exit 1
          fi

          # ---- مانیفست: حذفِ سرویسِ داخلیِ پلاگینِ پوش (تا فقط سرویسِ خودمون FCM رو بگیره)
          #      و ثبتِ سرویس/ریسیورِ تازه ----
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          python3 - "$MANIFEST" "$APP_ID" <<'WIDGETPYEOF'
          import sys, re
          path = sys.argv[1]
          app_id = sys.argv[2]
          with open(path, encoding='utf-8') as f:
              src = f.read()

          # tools:node="remove" نیاز به xmlns:tools رو ریشه‌ی <manifest> داره.
          if 'xmlns:tools=' not in src:
              src = re.sub(r'(<manifest\b)', r'\1 xmlns:tools="http://schemas.android.com/tools"', src, count=1)

          if 'ChatReplyMessagingService' not in src:
              block = (
                  # سرویسِ خودِ @capacitor/push-notifications رو صریح غیرفعال می‌کنیم تا
                  # FCM فقط سرویسِ ما رو صدا بزنه (اندروید فقط یه FirebaseMessagingService
                  # فعال در هر اپ رو پشتیبانی می‌کنه). اگه اسمِ کلاسِ پلاگین تو نسخه‌ی نصب‌شده
                  # فرق کنه، این tag صرفاً بی‌اثره (چون match نمی‌شه) — و بازم سرویسِ ما پایین
                  # اضافه می‌شه؛ فقط اون‌وقت باید احتمالِ دوتا سرویسِ فعال رو دستی چک کنی.\n'
                  '    <service android:name="com.capacitorjs.plugins.pushnotifications.MessagingService" tools:node="remove" />\n'
                  '    <service android:name="' + app_id + '.auth.ChatReplyMessagingService" android:exported="false">\n'
                  '        <intent-filter>\n'
                  '            <action android:name="com.google.firebase.MESSAGING_EVENT" />\n'
                  '        </intent-filter>\n'
                  '    </service>\n'
                  '    <receiver android:name="' + app_id + '.auth.ChatReplyReceiver" android:exported="false" />\n'
              )
              src = src.replace('</application>', block + '</application>', 1)

          with open(path, 'w', encoding='utf-8') as f:
              f.write(src)
          WIDGETPYEOF
          if ! grep -q 'ChatReplyMessagingService' "$MANIFEST"; then
            echo "::error::ChatReplyMessagingService was not registered in AndroidManifest.xml"
            exit 1
          fi

