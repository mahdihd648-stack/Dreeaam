name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Ensure local-notifications plugin is present
        # Safety net in case package.json/lock in the repo hasn't been updated yet — installs
        # the native notifications plugin so `npx cap sync android` has something to sync.
        # Best practice is still to add "@capacitor/local-notifications" to package.json
        # yourself and commit the lockfile, so this step becomes a no-op.
        run: |
          if ! node -e "require.resolve('@capacitor/local-notifications')" 2>/dev/null; then
            npm install @capacitor/local-notifications
          fi

      - name: Locate icon source at repo root
        # Single source of truth for every generated icon (web + native). Looks directly
        # in the repo root instead of resources/icon-only.png (which wasn't being found),
        # and fails loudly with a directory listing if nothing matches.
        run: |
          set -e
          CANDIDATES=(icon-only.png icon.png app-icon.png logo.png icon-source.png)
          ICON_SRC=""
          for c in "${CANDIDATES[@]}"; do
            if [ -f "$c" ]; then
              ICON_SRC="$c"
              break
            fi
          done
          if [ -z "$ICON_SRC" ]; then
            echo "::error::No icon file found at repo root. Looked for: ${CANDIDATES[*]}"
            echo "Repo root contents:"
            ls -la
            exit 1
          fi
          echo "Using icon source: $ICON_SRC"
          echo "ICON_SRC=$ICON_SRC" >> "$GITHUB_ENV"

      - name: Generate web icons into assets/ (icon-192.png, icon-512.png)
        # The web app (index.html / manifest.json) expects icon-192.png and icon-512.png,
        # but nothing in the repo produced them before — this step derives them from the
        # same repo-root icon used for the native Android icon and drops them into assets/,
        # so they're versioned alongside the app's other assets and the next step can pick
        # them up from there.
        run: |
          sudo apt-get update -y && sudo apt-get install -y imagemagick
          mkdir -p assets
          convert "$ICON_SRC" -resize 192x192 assets/icon-192.png
          convert "$ICON_SRC" -resize 512x512 assets/icon-512.png

      - name: Commit generated web icons back to the repo
        # [skip ci] stops this commit from re-triggering the "push to main" trigger above —
        # without it, every run would push a commit that starts another run, forever.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/icon-192.png assets/icon-512.png
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate web icons (192/512) [skip ci]"
            for i in 1 2 3 4 5; do
              if git push; then
                break
              fi
              echo "Push rejected (remote moved on) — rebasing onto origin/main and retrying ($i/5)"
              git fetch origin main
              # These icons are binary and fully regenerated every run, so there's nothing
              # meaningful to merge — on conflict, always keep our freshly generated files.
              # Note: git rebase flips the usual meaning of ours/theirs — "theirs" here means
              # the commit being replayed (ours), not origin's.
              if ! git rebase -X theirs origin/main; then
                echo "::error::Rebase failed even with -X theirs — aborting"
                git rebase --abort
                exit 1
              fi
              if [ "$i" -eq 5 ]; then
                echo "::error::Could not push after 5 attempts"
                exit 1
              fi
            done
          else
            echo "Icons unchanged — nothing to commit"
          fi

      - name: Prepare web assets (www/)
        run: |
          mkdir -p www
          cp index.html www/index.html
          # index.html با <script defer src="app.js"> اسکریپت اصلی رو جدا لود می‌کنه —
          # بدون این خط، www/app.js اصلاً وجود نداره و اپ اندروید یه صفحه‌ی کاملاً سفید
          # و بدون جاوااسکریپت می‌شه (نه فقط باگ سوییچ تب، هیچی کار نمی‌کنه).
          [ -f app.js ] && cp app.js www/app.js || { echo "::error::app.js not found in repo root"; exit 1; }
          [ -f manifest.json ] && cp manifest.json www/manifest.json || true
          [ -f assets/icon-192.png ] && cp assets/icon-192.png www/icon-192.png || { [ -f icon-192.png ] && cp icon-192.png www/icon-192.png || true; }
          [ -f assets/icon-512.png ] && cp assets/icon-512.png www/icon-512.png || { [ -f icon-512.png ] && cp icon-512.png www/icon-512.png || true; }
          # index.html registers navigator.serviceWorker at '/sw.js' — the repo file is named
          # sw-1.js, so it must land in www/ as sw.js or registration 404s and the SW never installs.
          [ -f sw-1.js ] && cp sw-1.js www/sw.js || true
          [ -f sw.js ] && cp sw.js www/sw.js || true
          [ -d assets ] && cp -r assets www/assets || true
          ls -la www

      - name: Add Android platform
        run: npx cap add android

      - name: Disable Capacitor's native splash/intro screen (app has its own JS intro)
        # کاپاسیتور به‌طور پیش‌فرض یه اسپلش‌اسکرین بومی می‌سازه (همون که تو اسکرین‌شات دیدی:
        # پس‌زمینه‌ی بنفش برند + آیکون اپ وسط صفحه) که قبل از لود شدن WebView نشون داده
        # می‌شه — این کاملاً جدا از اینتروی خودِ اپ (که با جاوااسکریپت توی app.js ساخته
        # شده) است، پس دوتا اینترو پشت‌سرهم می‌بینی. نکته‌ی مهم: تو API جدید اسپلش‌اسکرین
        # اندروید، اگه آیکون رو صریحاً ست نکنی، خودش از android:icon (همون آیکون اپ) به‌عنوان
        # پیش‌فرض استفاده می‌کنه -- پس صرفاً پاک‌کردن آیتم‌های داخل تم کافی نیست، اون آیکون
        # بازم برمی‌گرده. راه مطمئن: اصلاً نذاریم MainActivity از اون تمِ لانچ استفاده کنه.
        #   ۱) اگه تمِ لانچ یه postSplashScreenTheme مشخص کرده (یعنی "بعد از اسپلش برو سراغ
        #      این تم")، مستقیم خودِ MainActivity رو به همون تمِ واقعی/بی‌اسپلش وصل می‌کنیم --
        #      چون اون تم قطعاً معتبره (خودِ کاپاسیتور بهش رجوع می‌ده).
        #   ۲) اگه این مورد نبود ولی یه تمِ خواهر بدون پسوند Launch/NoActionBarLaunch پیدا
        #      بشه (الگوی استاندارد قالب کاپاسیتور)، به همون وصل می‌کنیم.
        #   ۳) در نهایت، اگه هیچ‌کدوم پیدا نشد، به‌عنوان آخرین راه، خودِ تمِ لانچ رو ویرایش
        #      می‌کنیم: parent اسپلش‌اسکرین و آیتم‌های مربوطش رو حذف می‌کنیم.
        # در هر سه حالت اسمِ خودِ تم عوض نمی‌شه مگه با یه تمِ از قبل موجود و معتبر، پس ریسک
        # "استایل ناموجود" عملاً صفره.
        run: |
          set -e
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          python3 - "$MANIFEST" <<'PYEOF'
          import re, sys

          manifest_path = sys.argv[1]
          with open(manifest_path, encoding='utf-8') as f:
              manifest_src = f.read()

          m = re.search(r'android:name="\.MainActivity"[^>]*?android:theme="@style/([\w.]+)"', manifest_src, re.S)
          if not m:
              m = re.search(r'android:theme="@style/([\w.]+)"[^>]*?android:name="\.MainActivity"', manifest_src, re.S)
          if not m:
              print("::warning::MainActivity theme attribute not found in AndroidManifest.xml -- skipping native splash removal")
              sys.exit(0)
          launch_theme = m.group(1)
          print(f"MainActivity launch theme: {launch_theme}")

          styles_candidates = [
              "android/app/src/main/res/values/styles.xml",
              "android/app/src/main/res/values-night/styles.xml",
          ]

          def find_style_block(src, name):
              pat = re.compile(r'<style\s+name="' + re.escape(name) + r'"[^>]*>.*?</style>', re.S)
              mm = pat.search(src)
              return mm

          def style_exists(src, name):
              return re.search(r'<style\s+name="' + re.escape(name) + r'"[^>\s]*[^>]*>', src) is not None

          redirect_target = None
          styles_path_used = None
          styles_src = None
          for styles_path in styles_candidates:
              try:
                  with open(styles_path, encoding='utf-8') as f:
                      src = f.read()
              except FileNotFoundError:
                  continue
              block = find_style_block(src, launch_theme)
              if not block:
                  continue
              styles_path_used = styles_path
              styles_src = src
              body = block.group(0)

              # Strategy 1: an explicit postSplashScreenTheme inside the launch style is the
              # most reliable signal -- Capacitor itself must point it at a real, working theme.
              pm = re.search(r'<item\s+name="postSplashScreenTheme">\s*@style/([\w.]+)\s*</item>', body)
              if pm:
                  redirect_target = pm.group(1)
                  print(f"Found postSplashScreenTheme -> redirecting MainActivity straight to '{redirect_target}'")
              break

          # Strategy 2: standard Capacitor naming convention is "<Base>Launch" / "<Base>.Launch"
          # sitting next to its non-launch sibling "<Base>" -- try stripping a trailing
          # "Launch" (with an optional preceding '.') and see if that style actually exists.
          if redirect_target is None and styles_src is not None:
              candidate = re.sub(r'\.?Launch$', '', launch_theme)
              if candidate and candidate != launch_theme and style_exists(styles_src, candidate):
                  redirect_target = candidate
                  print(f"No postSplashScreenTheme found -- derived sibling theme '{redirect_target}' exists, redirecting to it")

          if redirect_target is not None:
              new_manifest_src = manifest_src.replace(
                  f'android:theme="@style/{launch_theme}"',
                  f'android:theme="@style/{redirect_target}"',
              )
              if new_manifest_src == manifest_src:
                  print("::warning::redirect target computed but the theme string was not found verbatim in the manifest -- no change made")
              else:
                  with open(manifest_path, 'w', encoding='utf-8') as f:
                      f.write(new_manifest_src)
                  print(f"MainActivity now uses '@style/{redirect_target}' directly -- native splash bypassed entirely")
              sys.exit(0)

          # Strategy 3 (last resort): no safe redirect target found, so edit the launch style
          # itself in place -- strip the SplashScreen parent and any splash-specific items.
          if styles_path_used is None:
              print("::warning::could not locate the launch theme's <style> block in any styles.xml -- native splash may still show")
              sys.exit(0)

          block = find_style_block(styles_src, launch_theme)
          open_tag_m = re.match(r'<style\s+name="' + re.escape(launch_theme) + r'"([^>]*)>', block.group(0))
          attrs = open_tag_m.group(1)
          new_attrs = re.sub(r'\s+parent="Theme\.SplashScreen[^"]*"', ' parent="Theme.AppCompat.DayNight.NoActionBar"', attrs)
          body_only = block.group(0)[open_tag_m.end():-len('</style>')]
          new_body = re.sub(r'\s*<item\s+name="[^"]*[Ss]plash[Ss]creen[^"]*"[^>]*>.*?</item>', '', body_only, flags=re.S)
          new_body = re.sub(r'\s*<item\s+name="postSplashScreenTheme"[^>]*>.*?</item>', '', new_body, flags=re.S)
          new_body = re.sub(r'\s*<item\s+name="[^"]*[Ww]indow[Bb]ackground"[^>]*>\s*@drawable/splash\s*</item>', '', new_body, flags=re.S)
          new_block = f'<style name="{launch_theme}"{new_attrs}>{new_body}</style>'

          styles_src = styles_src[:block.start()] + new_block + styles_src[block.end():]
          with open(styles_path_used, 'w', encoding='utf-8') as f:
              f.write(styles_src)
          print(f"Fallback: stripped native splash-screen items directly from style '{launch_theme}' in {styles_path_used}")
          PYEOF

          if [ -f capacitor.config.json ]; then
            python3 - <<'PYEOF'
          import json

          path = "capacitor.config.json"
          with open(path, encoding='utf-8') as f:
              cfg = json.load(f)

          plugins = cfg.get('plugins', {})
          if 'SplashScreen' in plugins:
              plugins['SplashScreen']['launchShowDuration'] = 0
              plugins['SplashScreen']['launchAutoHide'] = True
              cfg['plugins'] = plugins
              with open(path, 'w', encoding='utf-8') as f:
                  json.dump(cfg, f, ensure_ascii=False, indent=2)
              print("capacitor.config.json: SplashScreen launchShowDuration set to 0")
          else:
              print("capacitor.config.json has no SplashScreen plugin block (nothing to patch there)")
          PYEOF
          fi

      - name: Set app version (versionCode/versionName) from VERSION file
        # مایکت (و گوگل‌پلی) رد می‌کنن اگه ورژن آپلودی از آخرین نسخه‌ی تأییدشده بالاتر
        # نباشه. تا قبل از این، این ورک‌فلو اصلاً دست به versionCode/versionName نمی‌زد،
        # پس هر بار همون مقدار پیش‌فرضِ Capacitor (versionCode=1, versionName="1.0")
        # می‌موند — دقیقاً برای همین هر بیلد جدید رد می‌شد (حتی وقتی فایل VERSION تو ریپو
        # عوض شده بود، چون هیچ‌کس این عدد رو واقعاً به build.gradle نمی‌رسوند).
        # از این به بعد: versionName = دقیقاً همون متن فایل VERSION (مثلاً "1.5")، و
        # versionCode = major*10000 + minor*100 + patch، که تا وقتی VERSION رو ببری بالا
        # همیشه از قبلی بزرگ‌تره. اگه مایکت بازم رد کرد، دقیق عددی که تو پنلش به‌عنوان
        # «آخرین نسخه‌ی پذیرفته‌شده» نشون می‌ده رو بگو تا offset این محاسبه رو باهاش هماهنگ کنم.
        run: |
          APP_GRADLE="android/app/build.gradle"
          python3 - "$APP_GRADLE" <<'PYEOF'
          import sys, re
          path = sys.argv[1]
          with open('VERSION', encoding='utf-8') as f:
              version_name = f.read().strip()
          parts = (version_name.split('.') + ['0','0'])[:3]
          major, minor, patch = (int(p) if p.isdigit() else 0 for p in parts)
          version_code = major*10000 + minor*100 + patch
          with open(path, encoding='utf-8') as f:
              src = f.read()
          new_src, n1 = re.subn(r'versionCode\s+\d+', f'versionCode {version_code}', src, count=1)
          if n1 == 0:
              print(f"::error::could not find a 'versionCode' line in {path}")
              sys.exit(1)
          new_src, n2 = re.subn(r'versionName\s+"[^"]*"', f'versionName "{version_name}"', new_src, count=1)
          if n2 == 0:
              print(f"::error::could not find a 'versionName' line in {path}")
              sys.exit(1)
          with open(path, 'w', encoding='utf-8') as f:
              f.write(new_src)
          print(f"Set versionName={version_name!r}, versionCode={version_code}")
          PYEOF

      - name: Generate app icon manually (legacy + adaptive, from repo-root icon)
        # Builds every launcher icon file by hand with ImageMagick instead of relying on
        # @capacitor/assets' own file discovery. Produces:
        #  - legacy square + round ic_launcher.png per density (mdpi..xxxhdpi), for API <26
        #  - adaptive ic_launcher_foreground.png per density, icon scaled into the ~66%
        #    "safe zone" so launchers that mask/crop the outer edge don't clip it
        #  - a solid brand-purple background color + mipmap-anydpi-v26 XML wiring both
        #    together for API 26+ adaptive icons
        run: |
          set -e
          sudo apt-get update -y && sudo apt-get install -y imagemagick
          SRC="$ICON_SRC"
          identify "$SRC"

          RES_BASE="android/app/src/main/res"
          BG_HEX="4338CA"

          declare -A LEGACY_SIZES=( [mdpi]=48 [hdpi]=72 [xhdpi]=96 [xxhdpi]=144 [xxxhdpi]=192 )
          declare -A FOREGROUND_SIZES=( [mdpi]=108 [hdpi]=162 [xhdpi]=216 [xxhdpi]=324 [xxxhdpi]=432 )

          for density in "${!LEGACY_SIZES[@]}"; do
            size=${LEGACY_SIZES[$density]}
            dir="$RES_BASE/mipmap-$density"
            mkdir -p "$dir"
            convert "$SRC" -resize ${size}x${size}^ -gravity center -extent ${size}x${size} "$dir/ic_launcher.png"
            convert "$dir/ic_launcher.png" \( +clone -alpha extract -fill black -colorize 100% -fill white -draw "circle $((size/2)),$((size/2)) $((size/2)),0" \) -alpha off -compose CopyOpacity -composite "$dir/ic_launcher_round.png"
          done

          for density in "${!FOREGROUND_SIZES[@]}"; do
            size=${FOREGROUND_SIZES[$density]}
            dir="$RES_BASE/mipmap-$density"
            mkdir -p "$dir"
            inner=$(( size * 66 / 100 ))
            convert -size ${size}x${size} xc:none \( "$SRC" -resize ${inner}x${inner} \) -gravity center -composite "$dir/ic_launcher_foreground.png"
          done

          mkdir -p "$RES_BASE/values"
          # Capacitor's default android template already ships its own
          # ic_launcher_background.xml defining the same @color/ic_launcher_background —
          # remove it first so we don't end up with two files declaring the same
          # resource name (which Gradle rejects as a duplicate resource merge error).
          rm -f "$RES_BASE/values/ic_launcher_background.xml"
          cat > "$RES_BASE/values/ic_launcher_background_color.xml" <<XMLEOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#$BG_HEX</color>
          </resources>
          XMLEOF

          mkdir -p "$RES_BASE/mipmap-anydpi-v26"
          cat > "$RES_BASE/mipmap-anydpi-v26/ic_launcher.xml" <<XMLEOF
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          XMLEOF
          cp "$RES_BASE/mipmap-anydpi-v26/ic_launcher.xml" "$RES_BASE/mipmap-anydpi-v26/ic_launcher_round.xml"

          echo "Generated launcher icons manually from $SRC:"
          find "$RES_BASE" -iname "ic_launcher*"

      - name: Generate notification small icon (ic_stat_icon)
        run: |
          declare -A sizes=( [mdpi]=24 [hdpi]=36 [xhdpi]=48 [xxhdpi]=72 [xxxhdpi]=96 )
          for density in "${!sizes[@]}"; do
            size="${sizes[$density]}"
            dir="android/app/src/main/res/drawable-${density}"
            mkdir -p "$dir"
            # Simple white bell silhouette on a transparent background — Android notification
            # icons must be a flat white/transparent shape (the OS colors it automatically).
            convert -size ${size}x${size} xc:transparent \
              -fill white -draw "circle $((size/2)),$((size/2)) $((size/2)),$((size/10))" \
              "$dir/ic_stat_icon.png"
          done
          # Fallback copy into the density-less drawable/ folder some plugin versions look at.
          mkdir -p android/app/src/main/res/drawable
          cp android/app/src/main/res/drawable-xhdpi/ic_stat_icon.png android/app/src/main/res/drawable/ic_stat_icon.png

      - name: Inject Myket billing plugin (native-billing/)
        run: |
          set -e
          APP_ID="com.mahdihd648.dreamlifeapp"
          APP_PATH="${APP_ID//./\/}"
          JAVA_DIR="android/app/src/main/java/${APP_PATH}"
          BILLING_DIR="${JAVA_DIR}/billing"

          # 1) AIDL interface Myket's billing service implements
          mkdir -p android/app/src/main/aidl/com/android/vending/billing
          cp native-billing/aidl/com/android/vending/billing/IInAppBillingService.aidl \
             android/app/src/main/aidl/com/android/vending/billing/IInAppBillingService.aidl

          # 2) The plugin itself, into the app's own package under a "billing" sub-package
          mkdir -p "$BILLING_DIR"
          cp native-billing/MarketBillingPlugin.java "$BILLING_DIR/MarketBillingPlugin.java"
          sed -i "s/^package .*billing;/package ${APP_ID}.billing;/" "$BILLING_DIR/MarketBillingPlugin.java"

          # 3) Register the plugin + import in MainActivity — rewrite the file fully instead
          #    of pattern-matching Capacitor's generated content, since its exact formatting
          #    (e.g. where the closing brace lands) isn't guaranteed across Capacitor versions.
          #    A silent regex/str-replace non-match here previously left the plugin unregistered
          #    with NO build error — the APK built and signed fine, but MarketBilling was never
          #    exposed to JS, so the in-app purchase button silently did nothing on-device.
          #    NOTE: also registers TaskWidgetPlugin (checklist + day-progress home-screen
          #    widgets) here, for the same reason — it's a native-only class, not an npm
          #    package, so Capacitor's autodiscovery won't find it on its own.
          MAIN_ACTIVITY="${JAVA_DIR}/MainActivity.java"
          cat > "$MAIN_ACTIVITY" <<JAVAEOF
          package ${APP_ID};

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          import ${APP_ID}.billing.MarketBillingPlugin;
          import ${APP_ID}.widget.TaskWidgetPlugin;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(MarketBillingPlugin.class);
                  registerPlugin(TaskWidgetPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVAEOF

          # Fail loudly instead of shipping a silently-broken APK again.
          if ! grep -q "registerPlugin(MarketBillingPlugin.class)" "$MAIN_ACTIVITY"; then
            echo "::error::MarketBillingPlugin was not registered in MainActivity.java"
            exit 1
          fi
          if ! grep -q "registerPlugin(TaskWidgetPlugin.class)" "$MAIN_ACTIVITY"; then
            echo "::error::TaskWidgetPlugin was not registered in MainActivity.java"
            exit 1
          fi

          # 4) Manifest: permission + package visibility <queries> for Myket's classic billing
          #    service (package visibility is required on Android 11+ to see the store app at all)
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          python3 - "$MANIFEST" <<'PYEOF'
          import sys, re
          path = sys.argv[1]
          with open(path, encoding='utf-8') as f:
              src = f.read()

          extra_permissions = (
              '    <uses-permission android:name="ir.mservices.market.BILLING" />\n'
          )
          if 'ir.mservices.market.BILLING' not in src:
              src = re.sub(r'(<manifest[^>]*>\n)', r'\1' + extra_permissions, src, count=1)

          # NOTE: Myket's own docs list BOTH the <package> entry AND this <intent> entry
          # together — a previous version of this step only added <package>, which is not
          # what's documented, so replicate the exact block Myket ships.
          queries_block = (
              '    <queries>\n'
              '        <package android:name="ir.mservices.market" />\n'
              '        <intent>\n'
              '            <action android:name="ir.mservices.market.InAppBillingService.BIND" />\n'
              '            <data android:mimeType="*/*" />\n'
              '        </intent>\n'
              '    </queries>\n'
          )
          if '<queries>' not in src:
              src = src.replace('<application', queries_block + '    <application', 1)

          with open(path, 'w', encoding='utf-8') as f:
              f.write(src)
          PYEOF

          # Fail loudly instead of shipping an APK where Myket's billing service is
          # invisible to bindService() on Android 11+ (package-visibility / <queries>).
          # This exact silent-failure class (build succeeds, APK signs fine, button
          # does nothing on-device) is what previously bit MainActivity registration —
          # same guard, applied here too.
          if ! grep -q 'ir.mservices.market.BILLING' "$MANIFEST"; then
            echo "::error::Myket BILLING <uses-permission> was not added to AndroidManifest.xml"
            exit 1
          fi
          if ! grep -q 'ir.mservices.market.InAppBillingService.BIND' "$MANIFEST"; then
            echo "::error::Myket <queries> block was not added to AndroidManifest.xml — bindService() to Myket's billing service WILL silently fail with 'no matching service found' on Android 11+ (see MarketBillingPlugin.ensureBound() logs). Check whether some other plugin already inserted an unrelated <queries> block before this step ran, since the script skips insertion whenever any <queries> tag is already present."
            exit 1
          fi

          # 5) Enable AIDL compilation. AGP 8+ turns this OFF by default, so without it the
          #    IInAppBillingService.aidl file from step 1 is silently ignored and the plugin
          #    fails to compile ("cannot find symbol: IInAppBillingService").
          APP_GRADLE="android/app/build.gradle"
          python3 - "$APP_GRADLE" <<'PYEOF'
          import sys, re
          path = sys.argv[1]
          with open(path, encoding='utf-8') as f:
              src = f.read()
          if 'buildFeatures' in src:
              if 'aidl' not in src:
                  src = re.sub(r'buildFeatures\s*\{', 'buildFeatures {\n        aidl true', src, count=1)
          else:
              src = re.sub(
                  r'(android\s*\{)',
                  r'\1\n    buildFeatures {\n        aidl true\n    }',
                  src, count=1
              )
          with open(path, 'w', encoding='utf-8') as f:
              f.write(src)
          PYEOF

          # Same class of silent failure as above: if neither branch of the regex matched
          # (e.g. build.gradle isn't formatted the way these regexes expect), aidl
          # compilation stays off and MarketBillingPlugin fails to compile with
          # "cannot find symbol: IInAppBillingService" — verify the flag actually landed.
          if ! grep -q 'aidl true' "$APP_GRADLE"; then
            echo "::error::'aidl true' was not added to android/app/build.gradle — IInAppBillingService.aidl will be silently ignored and MarketBillingPlugin will fail to compile."
            exit 1
          fi

      - name: Inject DreamLife home-screen widgets (checklist + day progress)
        # Adds the native other half of window.Capacitor.Plugins.TaskWidget, which index.html
        # already calls (syncTaskWidget / applyPendingWidgetToggles) but that previously had
        # no native implementation to talk to. Everything is generated here at build time —
        # nothing needs to be uploaded into the repo itself.
        run: |
          set -e
          APP_ID="com.mahdihd648.dreamlifeapp"
          APP_PATH="${APP_ID//./\/}"
          JAVA_DIR="android/app/src/main/java/${APP_PATH}"
          WIDGET_DIR="${JAVA_DIR}/widget"
          RES_DIR="android/app/src/main/res"

          mkdir -p "$WIDGET_DIR" "$RES_DIR/layout" "$RES_DIR/xml" "$RES_DIR/drawable"

          # ---- TaskWidgetPlugin.java (the Capacitor bridge) ----
          cat > "$WIDGET_DIR/TaskWidgetPlugin.java" <<JAVAEOF
          package ${APP_ID}.widget;

          import android.content.Context;
          import android.content.SharedPreferences;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.util.HashSet;
          import java.util.Set;

          @CapacitorPlugin(name = "TaskWidget")
          public class TaskWidgetPlugin extends Plugin {
              public static final String PREFS_NAME = "TaskWidgetPrefs";
              public static final String KEY_TASKS = "tasks_json";
              public static final String KEY_DAY = "day_number";
              public static final String KEY_PENDING = "pending_toggles";
              public static final String KEY_ACCENT = "theme_accent";
              public static final String KEY_ACCENT2 = "theme_accent2";
              public static final String KEY_CARD = "theme_card";
              public static final String KEY_TEXT = "theme_text";
              public static final String KEY_MUTED = "theme_muted";

              private SharedPreferences prefs() {
                  return getContext().getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE);
              }

              @PluginMethod
              public void updateTasks(PluginCall call) {
                  JSArray tasks = call.getArray("tasks");
                  if (tasks == null) tasks = new JSArray();
                  prefs().edit().putString(KEY_TASKS, tasks.toString()).apply();
                  ChecklistWidgetProvider.refreshAll(getContext());
                  call.resolve();
              }

              @PluginMethod
              public void updateDayProgress(PluginCall call) {
                  Integer day = call.getInt("dayNumber", 0);
                  prefs().edit().putInt(KEY_DAY, day).apply();
                  DayProgressWidgetProvider.refreshAll(getContext());
                  call.resolve();
              }

              @PluginMethod
              public void updateTheme(PluginCall call) {
                  prefs().edit()
                      .putString(KEY_ACCENT, call.getString("accent", "#4338CA"))
                      .putString(KEY_ACCENT2, call.getString("accent2", "#BF26D3"))
                      .putString(KEY_CARD, call.getString("card", "#FDFCFF"))
                      .putString(KEY_TEXT, call.getString("text", "#241F3D"))
                      .putString(KEY_MUTED, call.getString("muted", "#8A84AB"))
                      .apply();
                  ChecklistWidgetProvider.refreshAll(getContext());
                  DayProgressWidgetProvider.refreshAll(getContext());
                  QuoteWidgetProvider.refreshAll(getContext());
                  call.resolve();
              }

              @PluginMethod
              public void getPendingToggles(PluginCall call) {
                  Set<String> pending = prefs().getStringSet(KEY_PENDING, new HashSet<String>());
                  JSArray ids = new JSArray();
                  if (pending != null) {
                      for (String s : pending) {
                          try { ids.put(Integer.parseInt(s)); } catch (NumberFormatException ignored) {}
                      }
                  }
                  prefs().edit().remove(KEY_PENDING).apply();
                  JSObject ret = new JSObject();
                  ret.put("ids", ids);
                  call.resolve(ret);
              }
          }
          JAVAEOF

          # ---- WidgetThemeCatalog.java (mirrors the app's THEMES table, for the "custom theme" widget picker) ----
