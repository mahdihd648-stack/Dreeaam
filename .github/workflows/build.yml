                  // --- مایا آنجلو ---
                  {"مردم فراموش می‌کنند چه گفتی، فراموش می‌کنند چه کردی، اما هرگز فراموش نمی‌کنند چه حسی به آن‌ها دادی.", "مایا آنجلو"},
                  {"اگر چیزی را دوست نداری، تغییرش بده؛ اگر نمی‌توانی تغییرش دهی، طرز نگاهت را به آن تغییر بده.", "مایا آنجلو"},
