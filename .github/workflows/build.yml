                  {"کسی که کمترین نیازها را دارد، به خدایان نزدیک‌تر است.", "سقراط"},
                  {"وقتت را با شکایت از دشمنانت هدر نده؛ آن را صرف رسیدن به هدف‌هایت کن.", "سقراط"},

                  // --- رالف والدو امرسون ---
                  {"آنچه پشتِ سر ما و آنچه پیشِ روی ماست، در برابر آنچه در درون ماست، اهمیتی ندارد.", "رالف والدو امرسون"},
                  {"موفقیت این نیست که هرگز نلغزی، بلکه این است که هر بار پس از افتادن برخیزی.", "رالف والدو امرسون"},
                  {"آنچه هستی، آن‌قدر بلند فریاد می‌زند که نمی‌گذارد بشنوم چه می‌گویی.", "رالف والدو امرسون"},
                  {"مسیری را که دیگران رفته‌اند، نرو؛ به‌جایش به‌جایی برو که هیچ راهی نیست و ردی از خود به‌جا بگذار.", "رالف والدو امرسون"},
                  {"بزرگ‌ترین جایزه‌ی زندگی این است که هیچ‌کس نمی‌تواند صادقانه به دیگری کمک کند، بی‌آنکه خودش هم کمک بگیرد.", "رالف والدو امرسون"},
                  {"آنچه اراده می‌کنیم، انجامش می‌دهیم؛ و آنچه انجام می‌دهیم، همان می‌شویم.", "رالف والدو امرسون"},
                  {"بخش بزرگی از شجاعت، همان شهامتِ داشتنِ چشمان بازِ خطر است.", "رالف والدو امرسون"},
                  {"شخصیت، بیش از عقل حرف می‌زند.", "رالف والدو امرسون"},
                  {"هر دیواری یک در است.", "رالف والدو امرسون"},
                  {"اعتماد به خودت، رازِ نخستِ موفقیت است.", "رالف والدو امرسون"},
                  {"زندگی، یک سفر است، نه یک مقصد.", "رالف والدو امرسون"},
                  {"نبوغ یعنی دوباره دیدنِ آنچه در کودکی می‌دیدیم.", "رالف والدو امرسون"},

                  // --- بنجامین فرانکلین ---
                  {"سرمایه‌گذاری در دانش، همیشه بهترین سود را می‌دهد.", "بنجامین فرانکلین"},
                  {"وقتی که کارت تمام شد، تمام شده؛ اما اگر آن را کامل انجام دادی، برای همیشه انجام شده.", "بنجامین فرانکلین"},
                  {"به من بگو و فراموش می‌کنم؛ به من بیاموز و شاید به‌یاد بسپارم؛ درگیرم کن و یاد می‌گیرم.", "بنجامین فرانکلین"},
                  {"شکست‌خوردن در آماده‌شدن، یعنی آماده‌شدن برای شکست‌خوردن.", "بنجامین فرانکلین"},
                  {"انرژی و پایداری، هر مانعی را از میان برمی‌دارند.", "بنجامین فرانکلین"},
                  {"زود بخواب و زود بیدار شو تا سالم، ثروتمند و خردمند شوی.", "بنجامین فرانکلین"},
                  {"کسی که وقتش را هدر می‌دهد، زندگی‌اش را هدر می‌دهد.", "بنجامین فرانکلین"},
                  {"بدون تلاش، تلاش‌کردنی وجود ندارد و بدون تلاش، پیشرفتی هم وجود ندارد.", "بنجامین فرانکلین"},
                  {"عدالت هرگز اجرا نمی‌شود مگر آن‌ها که آسیب ندیده‌اند به اندازه‌ی آن‌ها که آسیب دیده‌اند خشمگین باشند.", "بنجامین فرانکلین"},
                  {"سرمایه‌گذاری بر خودت، کمترین ریسک را دارد و بیشترین سود را می‌دهد.", "بنجامین فرانکلین"},

                  // --- ویکتور فرانکل ---
                  {"وقتی دیگر نمی‌توانیم شرایط را تغییر دهیم، در برابر چالش تغییر خودمان قرار می‌گیریم.", "ویکتور فرانکل"},
                  {"میان محرک و پاسخ، فضایی هست؛ در آن فضا قدرت انتخاب پاسخ ما نهفته است.", "ویکتور فرانکل"},
                  {"کسانی که چرایی برای زیستن دارند، تقریباً هر چگونه‌ای را تاب می‌آورند.", "ویکتور فرانکل"},
                  {"آنچه انسان را واقعاً به حرکت وامی‌دارد، نه لذت، بلکه معناست.", "ویکتور فرانکل"},
                  {"آزادترین چیزی که از انسان نمی‌توان گرفت، انتخاب نگرش او در هر شرایطی است.", "ویکتور فرانکل"},
                  {"در معنابخشیدن به رنج، رنج دیگر رنج نیست.", "ویکتور فرانکل"},
                  {"موفقیت را نباید دنبال کرد؛ باید گذاشت که به‌عنوان اثر جانبی وقف‌شدن به هدفی بزرگ‌تر از خودمان، پیش آید.", "ویکتور فرانکل"},
                  {"زندگی هرگز به‌خاطر شرایط، بی‌معنا نمی‌شود؛ فقط ما هستیم که ممکن است معنایش را نبینیم.", "ویکتور فرانکل"},

                  // --- کارل یونگ ---
                  {"تا وقتی ناخودآگاه را آگاه نکنی، آن ناخودآگاه زندگی‌ات را هدایت می‌کند و تو آن را سرنوشت می‌نامی.", "کارل یونگ"},
                  {"کسی که به بیرون نگاه می‌کند، خواب می‌بیند؛ کسی که به درون نگاه می‌کند، بیدار می‌شود.", "کارل یونگ"},
                  {"چیزی که در برابرش مقاومت می‌کنی، ماندگار می‌شود.", "کارل یونگ"},
                  {"امتیاز یک عمر، این است که خودِ واقعی‌ات باشی.", "کارل یونگ"},
                  {"تا وقتی که شعله‌ای در تو روشن است، ذوب می‌شوی؛ در آتش خودآگاهی نیز همین‌طور.", "کارل یونگ"},
                  {"من همان نیستم که در کودکی بر من گذشت، بلکه انتخابی هستم که با آن روبه‌رو شدم.", "کارل یونگ"},
                  {"در هر بزرگسال، کودکی نهفته است که همیشه در حال شدن است.", "کارل یونگ"},
                  {"سایه‌ی خودت را بشناس، وگرنه او بی‌آنکه بدانی، تو را هدایت می‌کند.", "کارل یونگ"},

                  // --- ناپلئون هیل ---
                  {"آنچه ذهن می‌تواند تصور و باور کند، می‌تواند به دست آورد.", "ناپلئون هیل"},
                  {"هر شکستی، بذر یک سود برابر یا بزرگ‌تر را همراه خود دارد.", "ناپلئون هیل"},
                  {"قدرت اندیشه‌ات را کنترل کن، و اندیشه‌ات محیطت را کنترل خواهد کرد.", "ناپلئون هیل"},
                  {"صبر کن، اندیشه‌هایت را سازمان بده، مسیرت را مشخص کن و سپس با اطمینان به سمت هدفت حرکت کن.", "ناپلئون هیل"},
                  {"شکست موقت، تنها زمانی به شکست دائمی تبدیل می‌شود که آن را به‌عنوان بهانه بپذیریم.", "ناپلئون هیل"},
                  {"هدف مشخص، آغاز همه‌ی موفقیت‌های ارزشمند است.", "ناپلئون هیل"},
                  {"بیشتر افراد بزرگ، درست پیش از بزرگ‌ترین لحظه‌ی موفقیتشان، بزرگ‌ترین شکستشان را تجربه کرده‌اند.", "ناپلئون هیل"},
                  {"عمل کن، نه فقط فکر؛ ایده‌ها بدون عمل، فقط ایده باقی می‌مانند.", "ناپلئون هیل"},

                  // --- جیم ران ---
                  {"اگر نظمی که برای رسیدن به رؤیایت لازم است را نپذیری، باید رنجِ از دست‌دادنش را بپذیری.", "جیم ران"},
                  {"هر روز، یا نظم را می‌سازی، یا پشیمانی را.", "جیم ران"},
