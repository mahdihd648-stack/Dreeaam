                  {"نباید از پرسیدن سؤال‌های ساده ترسید؛ همان‌ها گاهی به بزرگ‌ترین کشف‌ها می‌رسند.", "مریم میرزاخانی"},
                  {"هیچ مسئله‌ای حل‌نشدنی نیست؛ فقط هنوز راهش را نیافته‌ای.", "مریم میرزاخانی"},
