                  {"هر که با صبر بنشیند، سرانجام میوه‌ی کارش را می‌چیند.", "پروین اعتصامی"},
                  {"نیکی‌کردن هرگز از یاد نمی‌رود، حتی اگر گیرنده‌اش آن را فراموش کند.", "پروین اعتصامی"},

                  // --- مارتین لوتر کینگ ---
                  {"تاریکی نمی‌تواند تاریکی را بیرون کند؛ فقط نور می‌تواند این کار را بکند.", "مارتین لوتر کینگ"},
                  {"اگر نمی‌توانی پرواز کنی، بدو؛ اگر نمی‌توانی بدوی، راه برو؛ اگر نمی‌توانی راه بروی، بخز؛ اما هر طور شده، به‌پیش برو.", "مارتین لوتر کینگ"},
                  {"ایمانِ واقعی یعنی گام‌نهادن روی اولین پله، حتی وقتی نمی‌بینی پله‌ی آخر کجاست.", "مارتین لوتر کینگ"},
