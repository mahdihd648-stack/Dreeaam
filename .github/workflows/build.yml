name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Ensure local-notifications plugin is present
        # Safety net in case package.json/lock in the repo hasn't been updated yet — installs
        # the native notifications plugin so `npx cap sync android` has something to sync.
        # Best practice is still to add "@capacitor/local-notifications" to package.json
        # yourself and commit the lockfile, so this step becomes a no-op.
        run: |
          if ! node -e "require.resolve('@capacitor/local-notifications')" 2>/dev/null; then
            npm install @capacitor/local-notifications
          fi

      - name: Generate web icons into assets/ (icon-192.png, icon-512.png)
        # The web app (index.html / manifest.json) expects icon-192.png and icon-512.png,
        # but nothing in the repo produced them before — this step derives them from the
        # same source icon used for the native Android icon (resources/icon-only.png) and
        # drops them into assets/, so they're versioned alongside the app's other assets
        # and the next step can pick them up from there.
        run: |
          sudo apt-get update -y && sudo apt-get install -y imagemagick
          mkdir -p assets
          convert resources/icon-only.png -resize 192x192 assets/icon-192.png
          convert resources/icon-only.png -resize 512x512 assets/icon-512.png

      - name: Commit generated web icons back to the repo
        # [skip ci] stops this commit from re-triggering the "push to main" trigger above —
        # without it, every run would push a commit that starts another run, forever.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/icon-192.png assets/icon-512.png
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate web icons (192/512) [skip ci]"
            git push
          else
            echo "Icons unchanged — nothing to commit"
          fi

      - name: Prepare web assets (www/)
        run: |
          mkdir -p www
          cp index.html www/index.html
          [ -f manifest.json ] && cp manifest.json www/manifest.json || true
          [ -f assets/icon-192.png ] && cp assets/icon-192.png www/icon-192.png || { [ -f icon-192.png ] && cp icon-192.png www/icon-192.png || true; }
          [ -f assets/icon-512.png ] && cp assets/icon-512.png www/icon-512.png || { [ -f icon-512.png ] && cp icon-512.png www/icon-512.png || true; }
          # index.html registers navigator.serviceWorker at '/sw.js' — the repo file is named
          # sw-1.js, so it must land in www/ as sw.js or registration 404s and the SW never installs.
          [ -f sw-1.js ] && cp sw-1.js www/sw.js || true
          [ -f sw.js ] && cp sw.js www/sw.js || true
          [ -d assets ] && cp -r assets www/assets || true
          ls -la www

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icon (adaptive, from resources/icon-only.png)
        # @capacitor/assets requires this EXACT filename for a simple/flat icon —
        # "icon.png" is silently ignored (it looks for icon-only.png, or the
        # icon-foreground.png + icon-background.png pair for a layered icon).
        # --assetPath makes it check resources/ directly instead of assets/ first.
        run: npx @capacitor/assets generate --android --assetPath resources --iconBackgroundColor '#4338CA' --iconBackgroundColorDark '#4338CA'

      - name: Generate notification small icon (ic_stat_icon)
        run: |
          declare -A sizes=( [mdpi]=24 [hdpi]=36 [xhdpi]=48 [xxhdpi]=72 [xxxhdpi]=96 )
          for density in "${!sizes[@]}"; do
            size="${sizes[$density]}"
            dir="android/app/src/main/res/drawable-${density}"
            mkdir -p "$dir"
            # Simple white bell silhouette on a transparent background — Android notification
            # icons must be a flat white/transparent shape (the OS colors it automatically).
            convert -size ${size}x${size} xc:transparent \
              -fill white -draw "circle $((size/2)),$((size/2)) $((size/2)),$((size/10))" \
              "$dir/ic_stat_icon.png"
          done
          # Fallback copy into the density-less drawable/ folder some plugin versions look at.
          mkdir -p android/app/src/main/res/drawable
          cp android/app/src/main/res/drawable-xhdpi/ic_stat_icon.png android/app/src/main/res/drawable/ic_stat_icon.png

      - name: Inject Myket billing plugin (native-billing/)
        run: |
          set -e
          APP_ID="com.mahdihd648.dreamlifeapp"
          APP_PATH="${APP_ID//./\/}"
          JAVA_DIR="android/app/src/main/java/${APP_PATH}"
          BILLING_DIR="${JAVA_DIR}/billing"

          # 1) AIDL interface Myket's billing service implements
          mkdir -p android/app/src/main/aidl/com/android/vending/billing
          cp native-billing/aidl/com/android/vending/billing/IInAppBillingService.aidl \
             android/app/src/main/aidl/com/android/vending/billing/IInAppBillingService.aidl

          # 2) The plugin itself, into the app's own package under a "billing" sub-package
          mkdir -p "$BILLING_DIR"
          cp native-billing/MarketBillingPlugin.java "$BILLING_DIR/MarketBillingPlugin.java"
          sed -i "s/^package .*billing;/package ${APP_ID}.billing;/" "$BILLING_DIR/MarketBillingPlugin.java"

          # 3) Register the plugin + import in MainActivity — rewrite the file fully instead
          #    of pattern-matching Capacitor's generated content, since its exact formatting
          #    (e.g. where the closing brace lands) isn't guaranteed across Capacitor versions.
          #    A silent regex/str-replace non-match here previously left the plugin unregistered
          #    with NO build error — the APK built and signed fine, but MarketBilling was never
          #    exposed to JS, so the in-app purchase button silently did nothing on-device.
          #    NOTE: also registers TaskWidgetPlugin (checklist + day-progress home-screen
          #    widgets) here, for the same reason — it's a native-only class, not an npm
          #    package, so Capacitor's autodiscovery won't find it on its own.
          MAIN_ACTIVITY="${JAVA_DIR}/MainActivity.java"
          cat > "$MAIN_ACTIVITY" <<JAVAEOF
          package ${APP_ID};

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          import ${APP_ID}.billing.MarketBillingPlugin;
          import ${APP_ID}.widget.TaskWidgetPlugin;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(MarketBillingPlugin.class);
                  registerPlugin(TaskWidgetPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVAEOF

          # Fail loudly instead of shipping a silently-broken APK again.
          if ! grep -q "registerPlugin(MarketBillingPlugin.class)" "$MAIN_ACTIVITY"; then
            echo "::error::MarketBillingPlugin was not registered in MainActivity.java"
            exit 1
          fi
          if ! grep -q "registerPlugin(TaskWidgetPlugin.class)" "$MAIN_ACTIVITY"; then
            echo "::error::TaskWidgetPlugin was not registered in MainActivity.java"
            exit 1
          fi

          # 4) Manifest: permission + package visibility <queries> for Myket's classic billing
          #    service (package visibility is required on Android 11+ to see the store app at all)
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          python3 - "$MANIFEST" <<'PYEOF'
          import sys, re
          path = sys.argv[1]
          with open(path, encoding='utf-8') as f:
              src = f.read()

          extra_permissions = (
              '    <uses-permission android:name="ir.mservices.market.BILLING" />\n'
          )
          if 'ir.mservices.market.BILLING' not in src:
              src = re.sub(r'(<manifest[^>]*>\n)', r'\1' + extra_permissions, src, count=1)

          queries_block = (
              '    <queries>\n'
              '        <package android:name="ir.mservices.market" />\n'
              '    </queries>\n'
          )
          if '<queries>' not in src:
              src = src.replace('<application', queries_block + '    <application', 1)

          with open(path, 'w', encoding='utf-8') as f:
              f.write(src)
          PYEOF

          # 5) Enable AIDL compilation. AGP 8+ turns this OFF by default, so without it the
          #    IInAppBillingService.aidl file from step 1 is silently ignored and the plugin
          #    fails to compile ("cannot find symbol: IInAppBillingService").
          APP_GRADLE="android/app/build.gradle"
          python3 - "$APP_GRADLE" <<'PYEOF'
          import sys, re
          path = sys.argv[1]
          with open(path, encoding='utf-8') as f:
              src = f.read()
          if 'buildFeatures' in src:
              if 'aidl' not in src:
                  src = re.sub(r'buildFeatures\s*\{', 'buildFeatures {\n        aidl true', src, count=1)
          else:
              src = re.sub(
                  r'(android\s*\{)',
                  r'\1\n    buildFeatures {\n        aidl true\n    }',
                  src, count=1
              )
          with open(path, 'w', encoding='utf-8') as f:
              f.write(src)
          PYEOF

      - name: Inject DreamLife home-screen widgets (checklist + day progress)
        # Adds the native other half of window.Capacitor.Plugins.TaskWidget, which index.html
        # already calls (syncTaskWidget / applyPendingWidgetToggles) but that previously had
        # no native implementation to talk to. Everything is generated here at build time —
        # nothing needs to be uploaded into the repo itself.
        run: |
          set -e
          APP_ID="com.mahdihd648.dreamlifeapp"
          APP_PATH="${APP_ID//./\/}"
          JAVA_DIR="android/app/src/main/java/${APP_PATH}"
          WIDGET_DIR="${JAVA_DIR}/widget"
          RES_DIR="android/app/src/main/res"

          mkdir -p "$WIDGET_DIR" "$RES_DIR/layout" "$RES_DIR/xml" "$RES_DIR/drawable"

          # ---- TaskWidgetPlugin.java (the Capacitor bridge) ----
          cat > "$WIDGET_DIR/TaskWidgetPlugin.java" <<JAVAEOF
          package ${APP_ID}.widget;

          import android.content.Context;
          import android.content.SharedPreferences;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.util.HashSet;
          import java.util.Set;

          @CapacitorPlugin(name = "TaskWidget")
          public class TaskWidgetPlugin extends Plugin {
              public static final String PREFS_NAME = "TaskWidgetPrefs";
              public static final String KEY_TASKS = "tasks_json";
              public static final String KEY_DAY = "day_number";
              public static final String KEY_PENDING = "pending_toggles";

              private SharedPreferences prefs() {
                  return getContext().getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE);
              }

              @PluginMethod
              public void updateTasks(PluginCall call) {
                  JSArray tasks = call.getArray("tasks");
                  if (tasks == null) tasks = new JSArray();
                  prefs().edit().putString(KEY_TASKS, tasks.toString()).apply();
                  ChecklistWidgetProvider.refreshAll(getContext());
                  call.resolve();
              }

              @PluginMethod
              public void updateDayProgress(PluginCall call) {
                  Integer day = call.getInt("dayNumber", 0);
                  prefs().edit().putInt(KEY_DAY, day).apply();
                  DayProgressWidgetProvider.refreshAll(getContext());
                  call.resolve();
              }

              @PluginMethod
              public void getPendingToggles(PluginCall call) {
                  Set<String> pending = prefs().getStringSet(KEY_PENDING, new HashSet<String>());
                  JSArray ids = new JSArray();
                  if (pending != null) {
                      for (String s : pending) {
                          try { ids.put(Integer.parseInt(s)); } catch (NumberFormatException ignored) {}
                      }
                  }
                  prefs().edit().remove(KEY_PENDING).apply();
                  JSObject ret = new JSObject();
                  ret.put("ids", ids);
                  call.resolve(ret);
              }
          }
          JAVAEOF

          # ---- ChecklistWidgetProvider.java ----
          cat > "$WIDGET_DIR/ChecklistWidgetProvider.java" <<JAVAEOF
          package ${APP_ID}.widget;

          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.view.View;
          import android.widget.RemoteViews;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.util.HashSet;
          import java.util.Set;

          public class ChecklistWidgetProvider extends AppWidgetProvider {

              public static final String ACTION_TOGGLE = "${APP_ID}.ACTION_TOGGLE_TASK";

              private static final int[] ROW_IDS = { R.id.row0, R.id.row1, R.id.row2, R.id.row3 };
              private static final int[] LABEL_IDS = { R.id.label0, R.id.label1, R.id.label2, R.id.label3 };
              private static final int[] CHECK_IDS = { R.id.check0, R.id.check1, R.id.check2, R.id.check3 };

              public static void refreshAll(Context context) {
                  AppWidgetManager mgr = AppWidgetManager.getInstance(context);
                  int[] ids = mgr.getAppWidgetIds(new ComponentName(context, ChecklistWidgetProvider.class));
                  for (int id : ids) updateOne(context, mgr, id);
              }

              private static void updateOne(Context context, AppWidgetManager mgr, int widgetId) {
                  SharedPreferences prefs = context.getSharedPreferences(TaskWidgetPlugin.PREFS_NAME, Context.MODE_PRIVATE);
                  RemoteViews views = new RemoteViews(context.getPackageName(), R.layout.widget_checklist);
                  try {
                      JSONArray tasks = new JSONArray(prefs.getString(TaskWidgetPlugin.KEY_TASKS, "[]"));
                      for (int i = 0; i < 4; i++) {
                          if (i < tasks.length()) {
                              JSONObject t = tasks.getJSONObject(i);
                              int taskId = t.optInt("id", i);
                              views.setViewVisibility(ROW_IDS[i], View.VISIBLE);
                              views.setTextViewText(LABEL_IDS[i], t.optString("label"));
                              boolean done = t.optBoolean("done", false);
                              views.setImageViewResource(CHECK_IDS[i], done ? R.drawable.widget_check_on : R.drawable.widget_check_off);

                              Intent toggleIntent = new Intent(context, ChecklistWidgetProvider.class);
                              toggleIntent.setAction(ACTION_TOGGLE);
                              toggleIntent.putExtra("task_id", taskId);
                              PendingIntent pi = PendingIntent.getBroadcast(context, taskId, toggleIntent,
                                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                              views.setOnClickPendingIntent(ROW_IDS[i], pi);
                          } else {
                              views.setViewVisibility(ROW_IDS[i], View.GONE);
                          }
                      }
                  } catch (Exception e) {
                      // leave default/empty state if tasks_json is malformed
                  }
                  mgr.updateAppWidget(widgetId, views);
              }

              @Override
              public void onUpdate(Context context, AppWidgetManager mgr, int[] appWidgetIds) {
                  for (int id : appWidgetIds) updateOne(context, mgr, id);
              }

              @Override
              public void onReceive(Context context, Intent intent) {
                  super.onReceive(context, intent);
                  if (!ACTION_TOGGLE.equals(intent.getAction())) return;
                  int taskId = intent.getIntExtra("task_id", -1);
                  if (taskId < 0) return;

                  SharedPreferences prefs = context.getSharedPreferences(TaskWidgetPlugin.PREFS_NAME, Context.MODE_PRIVATE);
                  Set<String> pending = new HashSet<>(prefs.getStringSet(TaskWidgetPlugin.KEY_PENDING, new HashSet<String>()));
                  pending.add(String.valueOf(taskId));

                  try {
                      JSONArray tasks = new JSONArray(prefs.getString(TaskWidgetPlugin.KEY_TASKS, "[]"));
                      for (int i = 0; i < tasks.length(); i++) {
                          JSONObject t = tasks.getJSONObject(i);
                          if (t.optInt("id", i) == taskId) {
                              t.put("done", !t.optBoolean("done", false));
                          }
                      }
                      prefs.edit()
                          .putStringSet(TaskWidgetPlugin.KEY_PENDING, pending)
                          .putString(TaskWidgetPlugin.KEY_TASKS, tasks.toString())
                          .apply();
                  } catch (Exception e) {
                      prefs.edit().putStringSet(TaskWidgetPlugin.KEY_PENDING, pending).apply();
                  }

                  refreshAll(context);
              }
          }
          JAVAEOF

          # ---- DayProgressWidgetProvider.java ----
          cat > "$WIDGET_DIR/DayProgressWidgetProvider.java" <<JAVAEOF
          package ${APP_ID}.widget;

          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.RectF;
          import android.widget.RemoteViews;

          public class DayProgressWidgetProvider extends AppWidgetProvider {

              // Matches storeData.programLength's default (90) in index.html.
              private static final int TOTAL_DAYS = 90;

              public static void refreshAll(Context context) {
                  AppWidgetManager mgr = AppWidgetManager.getInstance(context);
                  int[] ids = mgr.getAppWidgetIds(new ComponentName(context, DayProgressWidgetProvider.class));
                  for (int id : ids) updateOne(context, mgr, id);
              }

              private static Bitmap ringBitmap(int day, int total, int sizeDp, Context context) {
                  float density = context.getResources().getDisplayMetrics().density;
                  int size = Math.max(1, (int) (sizeDp * density));
                  Bitmap bmp = Bitmap.createBitmap(size, size, Bitmap.Config.ARGB_8888);
                  Canvas canvas = new Canvas(bmp);
                  float stroke = size * 0.09f;
                  RectF rect = new RectF(stroke, stroke, size - stroke, size - stroke);

                  Paint track = new Paint(Paint.ANTI_ALIAS_FLAG);
                  track.setStyle(Paint.Style.STROKE);
                  track.setStrokeWidth(stroke);
                  track.setColor(Color.parseColor("#332B2540"));
                  track.setStrokeCap(Paint.Cap.ROUND);
                  canvas.drawArc(rect, 0f, 360f, false, track);

                  float pct = Math.max(0f, Math.min(1f, day / (float) total));
                  Paint fg = new Paint(Paint.ANTI_ALIAS_FLAG);
                  fg.setStyle(Paint.Style.STROKE);
                  fg.setStrokeWidth(stroke);
                  fg.setColor(Color.parseColor("#4338CA"));
                  fg.setStrokeCap(Paint.Cap.ROUND);
                  canvas.drawArc(rect, -90f, 360f * pct, false, fg);
                  return bmp;
              }

              private static void updateOne(Context context, AppWidgetManager mgr, int widgetId) {
                  SharedPreferences prefs = context.getSharedPreferences(TaskWidgetPlugin.PREFS_NAME, Context.MODE_PRIVATE);
                  int day = prefs.getInt(TaskWidgetPlugin.KEY_DAY, 0);
                  RemoteViews views = new RemoteViews(context.getPackageName(), R.layout.widget_day_progress);
                  views.setImageViewBitmap(R.id.ring, ringBitmap(day, TOTAL_DAYS, 96, context));
                  views.setTextViewText(R.id.dayLabel, "روز " + day);
                  mgr.updateAppWidget(widgetId, views);
              }

              @Override
              public void onUpdate(Context context, AppWidgetManager mgr, int[] appWidgetIds) {
                  for (int id : appWidgetIds) updateOne(context, mgr, id);
              }
          }
          JAVAEOF

          # ---- res/layout/widget_checklist.xml ----
          cat > "$RES_DIR/layout/widget_checklist.xml" <<'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="#F3EEFC"
              android:padding="12dp">

              <TextView
                  android:id="@+id/title"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="چک‌لیست امروز"
                  android:textDirection="rtl"
                  android:textAlignment="viewStart"
                  android:textColor="#241F3D"
                  android:textStyle="bold"
                  android:textSize="14sp"
                  android:paddingBottom="6dp" />

              <LinearLayout android:id="@+id/row0" android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:orientation="horizontal" android:gravity="center_vertical" android:paddingTop="4dp" android:paddingBottom="4dp">
                  <ImageView android:id="@+id/check0" android:layout_width="20dp" android:layout_height="20dp"
                      android:src="@drawable/widget_check_off" android:layout_marginEnd="8dp" />
                  <TextView android:id="@+id/label0" android:layout_width="0dp" android:layout_weight="1"
                      android:layout_height="wrap_content" android:textDirection="rtl" android:textAlignment="viewStart"
                      android:textColor="#241F3D" android:textSize="13sp" android:maxLines="1" android:ellipsize="end" />
              </LinearLayout>

              <LinearLayout android:id="@+id/row1" android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:orientation="horizontal" android:gravity="center_vertical" android:paddingTop="4dp" android:paddingBottom="4dp">
                  <ImageView android:id="@+id/check1" android:layout_width="20dp" android:layout_height="20dp"
                      android:src="@drawable/widget_check_off" android:layout_marginEnd="8dp" />
                  <TextView android:id="@+id/label1" android:layout_width="0dp" android:layout_weight="1"
                      android:layout_height="wrap_content" android:textDirection="rtl" android:textAlignment="viewStart"
                      android:textColor="#241F3D" android:textSize="13sp" android:maxLines="1" android:ellipsize="end" />
              </LinearLayout>

              <LinearLayout android:id="@+id/row2" android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:orientation="horizontal" android:gravity="center_vertical" android:paddingTop="4dp" android:paddingBottom="4dp">
                  <ImageView android:id="@+id/check2" android:layout_width="20dp" android:layout_height="20dp"
                      android:src="@drawable/widget_check_off" android:layout_marginEnd="8dp" />
                  <TextView android:id="@+id/label2" android:layout_width="0dp" android:layout_weight="1"
                      android:layout_height="wrap_content" android:textDirection="rtl" android:textAlignment="viewStart"
                      android:textColor="#241F3D" android:textSize="13sp" android:maxLines="1" android:ellipsize="end" />
              </LinearLayout>

              <LinearLayout android:id="@+id/row3" android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:orientation="horizontal" android:gravity="center_vertical" android:paddingTop="4dp" android:paddingBottom="4dp">
                  <ImageView android:id="@+id/check3" android:layout_width="20dp" android:layout_height="20dp"
                      android:src="@drawable/widget_check_off" android:layout_marginEnd="8dp" />
                  <TextView android:id="@+id/label3" android:layout_width="0dp" android:layout_weight="1"
                      android:layout_height="wrap_content" android:textDirection="rtl" android:textAlignment="viewStart"
                      android:textColor="#241F3D" android:textSize="13sp" android:maxLines="1" android:ellipsize="end" />
              </LinearLayout>

          </LinearLayout>
          XMLEOF

          # ---- res/layout/widget_day_progress.xml ----
          cat > "$RES_DIR/layout/widget_day_progress.xml" <<'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#F3EEFC"
              android:padding="10dp">
              <ImageView android:id="@+id/ring" android:layout_width="match_parent" android:layout_height="match_parent"
                  android:layout_gravity="center" />
              <TextView android:id="@+id/dayLabel" android:layout_width="wrap_content" android:layout_height="wrap_content"
                  android:layout_gravity="center" android:textDirection="rtl" android:textColor="#241F3D"
                  android:textStyle="bold" android:textSize="16sp" />
          </FrameLayout>
          XMLEOF

          # ---- res/xml/widget_checklist_info.xml ----
          cat > "$RES_DIR/xml/widget_checklist_info.xml" <<'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="250dp"
              android:minHeight="180dp"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/widget_checklist"
              android:previewImage="@mipmap/ic_launcher"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen" />
          XMLEOF

          # ---- res/xml/widget_day_progress_info.xml ----
          cat > "$RES_DIR/xml/widget_day_progress_info.xml" <<'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="110dp"
              android:minHeight="110dp"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/widget_day_progress"
              android:previewImage="@mipmap/ic_launcher"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen" />
          XMLEOF

          # ---- res/drawable/widget_check_on.xml ----
          cat > "$RES_DIR/drawable/widget_check_on.xml" <<'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#3FB87F"
                  android:pathData="M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10 10,-4.48 10,-10S17.52,2 12,2z"/>
              <path android:fillColor="#FFFFFF"
                  android:pathData="M10,15.17l-2.83,-2.83 -1.41,1.41L10,18 18.24,9.76l-1.41,-1.41z"/>
          </vector>
          XMLEOF

          # ---- res/drawable/widget_check_off.xml ----
          cat > "$RES_DIR/drawable/widget_check_off.xml" <<'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#00000000" android:strokeColor="#8A84AB" android:strokeWidth="1.6"
                  android:pathData="M12,3C7.03,3 3,7.03 3,12s4.03,9 9,9 9,-4.03 9,-9S16.97,3 12,3z"/>
          </vector>
          XMLEOF

          # ---- AndroidManifest.xml: register the two widget receivers ----
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          python3 - "$MANIFEST" "$APP_ID" <<'WIDGETPYEOF'
          import sys, re
          path = sys.argv[1]
          app_id = sys.argv[2]
          with open(path, encoding='utf-8') as f:
              src = f.read()

          if 'ChecklistWidgetProvider' not in src:
              receivers = (
                  '    <receiver android:name="' + app_id + '.widget.ChecklistWidgetProvider" android:exported="true">\n'
                  '        <intent-filter>\n'
                  '            <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />\n'
                  '            <action android:name="' + app_id + '.ACTION_TOGGLE_TASK" />\n'
                  '        </intent-filter>\n'
                  '        <meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_checklist_info" />\n'
                  '    </receiver>\n'
                  '    <receiver android:name="' + app_id + '.widget.DayProgressWidgetProvider" android:exported="true">\n'
                  '        <intent-filter>\n'
                  '            <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />\n'
                  '        </intent-filter>\n'
                  '        <meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_day_progress_info" />\n'
                  '    </receiver>\n'
              )
              src = src.replace('</application>', receivers + '</application>', 1)

          with open(path, 'w', encoding='utf-8') as f:
              f.write(src)
          WIDGETPYEOF

      - name: Add notification permissions (POST_NOTIFICATIONS / exact alarm / boot)
        # Without these, @capacitor/local-notifications schedules silently fail or get dropped
        # by the OS on Android 13+ (runtime permission), Android 12+ (exact alarms), and after
        # a phone reboot (rescheduling needs boot access).
        run: |
          set -e
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          python3 - "$MANIFEST" <<'PYEOF'
          import sys, re
          path = sys.argv[1]
          with open(path, encoding='utf-8') as f:
              src = f.read()

          notif_permissions = (
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n'
              '    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n'
              '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n'
              '    <uses-permission android:name="android.permission.VIBRATE" />\n'
          )
          for perm in [
              'android.permission.POST_NOTIFICATIONS',
              'android.permission.SCHEDULE_EXACT_ALARM',
              'android.permission.RECEIVE_BOOT_COMPLETED',
              'android.permission.VIBRATE',
          ]:
              if perm not in src:
                  src = re.sub(r'(<manifest[^>]*>\n)',
                                lambda m, p=perm: m.group(1) + f'    <uses-permission android:name="{p}" />\n',
                                src, count=1)

          with open(path, 'w', encoding='utf-8') as f:
              f.write(src)
          PYEOF

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: Wire up release signing in build.gradle
        run: |
          APP_GRADLE="android/app/build.gradle"
          python3 - "$APP_GRADLE" <<'PYEOF'
          import sys, re
          path = sys.argv[1]
          with open(path, encoding='utf-8') as f:
              src = f.read()

          signing_block = '''
              signingConfigs {
                  release {
                      storeFile file("release.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
          '''
          if 'signingConfigs' not in src:
              src = re.sub(r'(android\s*\{)', r'\1' + signing_block, src, count=1)

          if 'signingConfig signingConfigs.release' not in src:
              src = re.sub(
                  r'(buildTypes\s*\{\s*release\s*\{)',
                  r'\1\n            signingConfig signingConfigs.release',
                  src, count=1
              )

          with open(path, 'w', encoding='utf-8') as f:
              f.write(src)
          PYEOF

      - name: Build release APK (signed)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dreamlife-apk-release
          path: android/app/build/outputs/apk/release/app-release.apk
