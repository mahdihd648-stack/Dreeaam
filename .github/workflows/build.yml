                  {"یک هدف، بدون برنامه فقط یک آرزوست.", "بروس لی"},
                  {"اگر همیشه محدودیت‌ها را در نظر بگیری، تمام زندگی‌ات را محدود خواهی کرد.", "بروس لی"},

                  // --- هلن کلر ---
                  {"زندگی یا یک ماجراجویی جسورانه است یا هیچ.", "هلن کلر"},
                  {"خوش‌بینی، ایمانی است که به هر دستاوردی راه می‌برد؛ هیچ‌چیزی بدون امید و اعتمادبه‌نفس انجام نمی‌شود.", "هلن کلر"},
